<script>
/* ============================ DOCUMENTS ============================ */
function renderDocuments(root, { params }) {
  const projs = D.documentProjects;
  const id = params.id;
  const doc = D.documents.find(d => d.id === id) || null;
  const filter = params.project || "all";
  const docs = D.documents.filter(d => filter === "all" || d.project === filter);

  root.innerHTML = `
    ${pageHead({ eyebrow: "Workspace", title: "Documents", desc: "Upload readings, keep them with their annotations, and organise everything into projects.", actions: `<button class="btn" id="newTextDoc">${ico("plus")} New text document</button><label class="btn primary" style="margin:0">${ico("upload")} Upload file<input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.html,.pdf,image/*" class="hidden"></label>` })}
    <div class="grid" style="grid-template-columns:300px minmax(0,1fr);gap:16px" id="docsGrid">
      <div class="stack">
        <div class="card" style="padding:11px">
          <div class="row" style="justify-content:space-between;margin-bottom:7px"><span class="label">Projects</span><button class="icon-btn" id="addProject" style="width:24px;height:24px;border:0;background:transparent" aria-label="New project">${ico("plus")}</button></div>
          <div class="folder-list">
            <div class="fl ${filter === "all" ? "on" : ""}" data-proj="all">${ico("layers")} All documents <span class="n">${D.documents.length}</span></div>
            ${projs.map(p => `<div class="fl ${filter === p.id ? "on" : ""}" data-proj="${p.id}">${ico("folder")} ${esc(p.name)} <span class="n">${D.documents.filter(d => d.project === p.id).length}</span></div>`).join("")}
          </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div style="padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:650">${filter === "all" ? "All documents" : esc(projs.find(p => p.id === filter)?.name || "Documents")}</div>
          <div style="max-height:52vh;overflow:auto">
            ${docs.length ? docs.map(d => `<div class="chat-item ${d.id === id ? "on" : ""}" data-doc="${d.id}" role="button" tabindex="0" style="border-radius:0;border-bottom:1px solid var(--line-soft)">
              <div class="row" style="gap:8px"><div class="tile" style="width:26px;height:26px;border-radius:7px;background:${d.type?.includes("pdf") ? "var(--danger-soft)" : "var(--brand-soft)"};color:${d.type?.includes("pdf") ? "var(--danger)" : "var(--brand-2)"}">${ico("note")}</div><div class="t" style="flex:1;white-space:normal">${esc(d.name)}</div></div>
              <div class="s" style="margin-left:34px">${esc(bytes(d.size || 0))} · ${esc(D2.rel(d.uploaded))} · ${d.annotations?.length || 0} notes</div></div>`).join("") : `<div class="tiny muted" style="padding:16px;text-align:center">No documents here yet.</div>`}
          </div>
        </div>
      </div>
      <div class="card pad-0" style="min-height:420px">
        ${doc ? documentDetailHTML(doc) : `<div style="padding:26px">${emptyState("folder", "Your document workspace", "Upload a reading (text, Markdown, CSV, PDF or image), create a text document, then annotate the parts that matter.", `<label class="btn primary sm" style="margin:0">${ico("upload")} Upload a file<input type="file" id="fileInput2" multiple accept=".txt,.md,.csv,.json,.html,.pdf,image/*" class="hidden"></label>`)}</div>`}
      </div>
    </div>`;

  const handleFiles = async (files) => {
    if (!files?.length) return;
    for (const f of files) {
      if (f.size > 3 * 1024 * 1024) { toast(`${f.name} is larger than 3 MB and was skipped.`, "warn"); continue; }
      const isText = /text|json|csv|markdown|html|javascript|xml/.test(f.type) || /\.(txt|md|csv|json|html|xml)$/i.test(f.name);
      const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
      const isImg = f.type.startsWith("image/");
      let text = "", dataUrl = "";
      if (isText) text = await f.text();
      else if ((isPdf || isImg) && f.size <= 1.2 * 1024 * 1024) {
        dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
      }
      D.documents.unshift({
        id: uid("doc"), name: f.name, project: filter === "all" ? "dp_default" : filter, type: f.type || "application/octet-stream",
        size: f.size, uploaded: D2.iso(), text, dataUrl, annotations: [], subject: filter === "all" ? "general" : "general"
      });
      logActivity(`Uploaded “${f.name}”`, "upload", "documents");
    }
    saveDB(); renderRoute(); toast("Upload complete");
  };
  const fi = $("#fileInput", root); if (fi) fi.onchange = () => handleFiles(fi.files);
  const fi2 = $("#fileInput2", root); if (fi2) fi2.onchange = () => handleFiles(fi2.files);

  $$("[data-proj]", root).forEach(p => p.onclick = () => go("documents", p.dataset.proj === "all" ? {} : { project: p.dataset.proj }));
  $$("[data-doc]", root).forEach(d => d.onclick = () => {
    const cur = new URLSearchParams(location.search);
    go("documents", { id: d.dataset.doc, project: filter === "all" ? undefined : filter });
  });
  $("#addProject", root).onclick = () => modal({
    title: "New project", icon: "folder", body: `<div class="field"><label for="pn">Project name</label><input id="pn" placeholder="e.g. Research paper"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="pAdd">Create</button>`,
    onMount: (m) => $("#pAdd", m).onclick = () => {
      const name = $("#pn", m).value.trim(); if (!name) return;
      D.documentProjects.push({ id: uid("dp"), name }); saveDB(); closeModal(); renderRoute();
    }
  });
  $("#newTextDoc", root).onclick = () => modal({
    title: "New text document", icon: "note", wide: true, body: `
      <div class="field"><label for="dn">Title</label><input id="dn" placeholder="e.g. Lecture 5 — thermodynamics"></div>
      <div class="input-row"><div class="field"><label for="dp">Project</label><select id="dp">${D.documentProjects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="dsub">Subject</label><select id="dsub">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}<option value="general">General</option></select></div></div>
      <div class="field"><label for="dt">Content</label><textarea id="dt" rows="10" placeholder="Paste or type the document content…"></textarea></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="dCreate">Create document</button>`,
    onMount: (m) => $("#dCreate", m).onclick = () => {
      const name = $("#dn", m).value.trim() || "Untitled document";
      const text = $("#dt", m).value;
      const d = { id: uid("doc"), name, project: $("#dp", m).value, subject: $("#dsub", m).value, type: "text/plain", size: new Blob([text]).size, uploaded: D2.iso(), text, annotations: [] };
      D.documents.unshift(d); saveDB(); closeModal(); go("documents", { id: d.id }); toast("Document created");
    }
  });
  if (doc) bindDocumentDetail(doc, root);
}

function documentDetailHTML(d) {
  const isPdf = d.type?.includes("pdf"), isImg = d.type?.startsWith("image/");
  let preview = "";
  if (d.dataUrl && isPdf) preview = `<iframe src="${d.dataUrl}" style="width:100%;height:65vh;border:0;border-radius:8px;background:#fff" title="PDF preview"></iframe>`;
  else if (d.dataUrl && isImg) preview = `<img src="${d.dataUrl}" alt="${esc(d.name)}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">`;
  else if (d.text) preview = `<div id="docText" style="white-space:pre-wrap;font-size:13.5px;line-height:1.75;max-height:58vh;overflow:auto;padding:4px 2px" class="doc-text">${highlightQuotes(d)}</div>`;
  else preview = `<div class="empty"><div class="ico">${ico("file")}</div><h3>Preview unavailable</h3><p>${d.type?.includes("word") ? "Word documents are stored as metadata only in this browser." : "This file type cannot be rendered locally."} Convert it to PDF or paste the text with “New text document” to annotate it.</p></div>`;
  return `<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px">
      <div style="flex:1;min-width:180px"><div style="font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</div>
      <div class="tiny muted">${esc(bytes(d.size || 0))} · ${esc(d.type || "file")} · uploaded ${esc(D2.fmt(d.uploaded))}</div></div>
      <button class="btn sm" id="addAnn">${ico("pencil")} Annotate</button>
      <button class="btn sm ghost" id="exportDoc">${ico("download")}</button>
      <button class="btn sm ghost danger" id="delDoc" aria-label="Delete document">${ico("trash")}</button>
    </div>
    <div class="row" style="padding:8px 16px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap">
      <select id="docProject" style="width:auto;font-size:11.5px;padding:4px 24px 4px 8px" aria-label="Project">${D.documentProjects.map(p => `<option value="${p.id}" ${d.project === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      <select id="docSubject" style="width:auto;font-size:11.5px;padding:4px 24px 4px 8px" aria-label="Subject">${SUBJECTS.map(s => `<option value="${s.id}" ${d.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${d.subject === "general" ? "selected" : ""}>General</option></select>
      ${AI.ready() ? `<button class="btn sm soft" id="docAi">${ico("sparkle")} Summarise document</button>` : `<span class="tiny muted">${ico("sparkle")} AI summary needs an API key in Settings</span>`}
    </div>
    <div style="padding:16px">${preview}
      <div class="divider"></div>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="font-size:13.5px">Annotations</h3><span class="tiny muted">${d.annotations?.length || 0} saved</span></div>
      ${d.annotations?.length ? `<div class="stack">${d.annotations.map(a => `<div class="card" style="padding:11px;background:var(--panel-2)">
        <div class="row" style="align-items:flex-start;gap:9px"><div style="flex:1"><div style="font-size:12.5px;border-left:3px solid var(--brand);padding-left:9px;color:var(--text-2);font-style:italic">“${esc(a.quote)}”</div>
        <div class="small" style="margin-top:6px">${esc(a.note || "")}</div></div>
        <button class="icon-btn" data-del-ann="${a.id}" style="width:26px;height:26px" aria-label="Delete annotation">${ico("trash")}</button></div></div>`).join("")}</div>` : `<p class="tiny muted">Select text in the preview, then choose Annotate to attach a note to a quote.</p>`}
    </div>`;
}
function highlightQuotes(d) {
  if (!d.text) return "";
  let html = esc(d.text);
  (d.annotations || []).forEach(a => { if (a.quote && a.quote.length > 3) html = html.replace(esc(a.quote), `<mark>${esc(a.quote)}</mark>`); });
  return html;
}
function bindDocumentDetail(d, root) {
  $("#delDoc", root).onclick = () => confirmDialog("Delete document?", `“${d.name}” and its annotations will be removed.`, () => {
    D.documents = D.documents.filter(x => x.id !== d.id); saveDB(); go("documents"); toast("Document deleted");
  });
  $("#docProject", root).onchange = (e) => { d.project = e.target.value; saveDB(); toast("Moved to project"); };
  $("#docSubject", root).onchange = (e) => { d.subject = e.target.value; saveDB(); };
  $("#exportDoc", root).onclick = () => {
    if (d.text) download(d.name.replace(/\.[^.]+$/, "") + ".txt", d.text, "text/plain");
    else if (d.dataUrl) { const a = document.createElement("a"); a.href = d.dataUrl; a.download = d.name; a.click(); }
    else toast("No downloadable content stored for this file.", "warn");
  };
  $("#addAnn", root).onclick = () => {
    const sel = window.getSelection()?.toString().trim() || "";
    modal({
      title: "Add annotation", icon: "pencil", body: `
        <div class="field"><label for="annQ">Quote</label><textarea id="annQ" rows="3" placeholder="Select text in the preview, or paste the passage here">${esc(sel)}</textarea></div>
        <div class="field"><label for="annN">Your note</label><textarea id="annN" rows="3" placeholder="Why does this matter? What should you remember?"></textarea></div>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="annSave">Save annotation</button>`,
      onMount: (m) => $("#annSave", m).onclick = () => {
        const q = $("#annQ", m).value.trim(), n = $("#annN", m).value.trim();
        if (!q) return toast("Add a quote to anchor the annotation.", "warn");
        d.annotations = d.annotations || []; d.annotations.push({ id: uid("an"), quote: q, note: n, at: D2.iso() });
        saveDB(); closeModal(); renderRoute(); toast("Annotation saved");
      }
    });
  };
  $$("[data-del-ann]", root).forEach(b => b.onclick = () => {
    d.annotations = d.annotations.filter(a => a.id !== b.dataset.delAnn); saveDB(); renderRoute();
  });
  const ai = $("#docAi", root);
  if (ai) ai.onclick = async () => {
    if (!aiGuard()) return;
    if (!d.text) return toast("Only text-based documents can be summarised locally.", "warn");
    ai.disabled = true; ai.textContent = "Summarising…";
    try {
      const out = await AI.chat([{ role: "user", content: `Summarise this academic document for a ${D.profile.level || "university"} student. Give: (1) a 3-sentence overview, (2) key concepts as bullets, (3) any claims that need verification, (4) two questions a lecturer might ask.\n\nTitle: ${d.name}\n\n${d.text.slice(0, 14000)}` }], { system: "You summarise only what is present in the supplied document. Do not add outside facts; label inference clearly.", max_tokens: 1100 });
      modal({ title: "Document summary", icon: "sparkle", wide: true, body: `<div class="row" style="margin-bottom:10px"><span class="chip brand">${ico("sparkle")} AI-generated</span><span class="chip">from “${esc(d.name)}”</span></div><div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(out)}</div></div></div>`,
        footer: `<button class="btn" data-close>Close</button><button class="btn primary" id="sumNote">${ico("save")} Save as note</button>`,
        onMount: (m) => $("#sumNote", m).onclick = () => {
          const n = { id: uid("n"), title: "Summary — " + d.name, subject: d.subject || "general", folder: "f_default", tags: ["document", "ai-saved"], html: `<p class="muted small">Generated from “${esc(d.name)}”.</p>${md(out)}`, plain: out, created: D2.iso(), updated: D2.iso() };
          D.notes.unshift(n); saveDB(); closeModal(); toast("Summary saved to notes");
        } });
    } catch (e) { toast(e.message, "err", "AI request failed"); }
    finally { ai.disabled = false; ai.innerHTML = `${ico("sparkle")} Summarise document`; }
  };
}
page("documents", { title: "Documents" }, renderDocuments);
</script>
<script>
/* ============================ FLASHCARDS ============================ */
const fcState = { deck: "all", view: "study", queue: [], idx: 0, flipped: false, reviewed: 0, mode: "due", filter: "", finished: false };

function scheduleCard(card, grade) {
  // grade: 0 again, 1 hard, 2 good, 3 easy
  card.ease = card.ease || 2.5; card.interval = card.interval || 0; card.reps = card.reps || 0; card.lapses = card.lapses || 0;
  if (grade === 0) { card.lapses++; card.ease = Math.max(1.3, card.ease - 0.2); card.interval = 0; card.due = D2.iso(); }
  else {
    if (grade === 1) card.ease = Math.max(1.3, card.ease - 0.15);
    if (grade === 3) card.ease = Math.min(3.2, card.ease + 0.12);
    card.reps++;
    const mult = grade === 1 ? 1.2 : grade === 3 ? card.ease * 1.3 : card.ease;
    card.interval = card.interval ? Math.max(1, Math.round(card.interval * mult)) : (grade === 1 ? 1 : grade === 3 ? 3 : 1);
    card.due = D2.addDays(card.interval);
  }
  card.lastGrade = grade; card.lastReviewed = new Date().toISOString();
  D.reviews.push({ id: uid("rv"), cardId: card.id, grade, at: card.lastReviewed, interval: card.interval });
  D.reviews = D.reviews.slice(-2000);
  saveDB(true);
}
function buildQueue() {
  const now = D2.iso();
  let pool = D.cards.filter(c => fcState.deck === "all" || c.deck === fcState.deck);
  if (fcState.filter) { const q = fcState.filter.toLowerCase(); pool = pool.filter(c => (c.front + " " + c.back).toLowerCase().includes(q)); }
  let due = pool.filter(c => !c.due || c.due <= now);
  if (fcState.mode === "all") due = pool;
  if (fcState.mode === "due" && !due.length) return [];
  return [...due].sort((a, b) => (a.due || "").localeCompare(b.due || "")).slice(0, 40);
}

function renderFlashcards(root, { params }) {
  if (window._fcKey) { document.removeEventListener("keydown", window._fcKey); window._fcKey = null; }
  if (params.deck) fcState.deck = params.deck;
  if (params.view) fcState.view = params.view;
  if (params.topic) { fcState.filter = params.topic; fcState.view = "manage"; }
  if (params.subject) fcState.deck = "all";
  const decks = D.decks;
  const deckCards = D.cards.filter(c => fcState.deck === "all" || c.deck === fcState.deck);
  const dueCount = deckCards.filter(c => !c.due || c.due <= D2.iso()).length;
  const deckName = fcState.deck === "all" ? "All cards" : decks.find(d => d.id === fcState.deck)?.name || "Deck";

  root.innerHTML = `
    ${pageHead({ eyebrow: "Workspace", title: "Flashcards", desc: "Spaced repetition on a proven schedule: cards return right before you would forget them.", actions: `<button class="btn" id="genAi">${ico("sparkle")} Generate with AI</button><button class="btn primary" id="addCard">${ico("plus")} Add card</button>` })}
    <div class="grid" style="grid-template-columns:240px minmax(0,1fr);gap:16px" id="fcGrid">
      <aside class="stack">
        <div class="card" style="padding:10px">
          <div class="row" style="justify-content:space-between;padding:0 4px 6px"><span class="label">Decks</span><button class="icon-btn" id="addDeck" style="width:24px;height:24px;border:0;background:transparent" aria-label="New deck">${ico("plus")}</button></div>
          <div class="folder-list">
            <div class="fl ${fcState.deck === "all" ? "on" : ""}" data-deck="all">${ico("layers")} All cards <span class="n">${D.cards.length}</span></div>
            ${decks.map(d => `<div class="fl ${fcState.deck === d.id ? "on" : ""}" data-deck="${d.id}">${ico("cards")} ${esc(d.name)} <span class="n">${D.cards.filter(c => c.deck === d.id).length}</span></div>`).join("")}
          </div>
        </div>
        <div class="card">
          <div class="label" style="margin-bottom:8px">Today</div>
          <div class="row" style="justify-content:space-between"><span class="small muted">Due now</span><b style="font-size:18px">${dueCount}</b></div>
          <div class="row" style="justify-content:space-between;margin-top:4px"><span class="small muted">Reviewed</span><b>${D.reviews.filter(r => r.at?.slice(0, 10) === D2.iso()).length}</b></div>
          <div class="divider"></div>
          <div class="tiny muted">Retention estimate</div>
          <div class="row" style="gap:7px;margin-top:4px"><b style="font-size:17px">${retention()}%</b><span class="tiny muted">last 200 reviews</span></div>
          ${progressBar(retention(), "ok")}
        </div>
        <div class="card">
          <div class="label" style="margin-bottom:6px">How scheduling works</div>
          <p class="tiny muted" style="margin:0">Each card tracks ease and interval. “Again” resets it; “Good” multiplies the interval by its ease factor. You only see cards when they are due.</p>
        </div>
      </aside>
      <div>
        <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div class="pill-tabs" role="tablist">
            <button class="${fcState.view === "study" ? "on" : ""}" data-view="study" role="tab">Study</button>
            <button class="${fcState.view === "manage" ? "on" : ""}" data-view="manage" role="tab">Manage (${deckCards.length})</button>
          </div>
          <span class="spacer"></span>
          <div class="search-wrap" style="width:190px;margin:0">${ico("search")}<input id="fcSearch" placeholder="Filter cards…" value="${esc(fcState.filter)}" aria-label="Filter cards"></div>
        </div>
        <div id="fcBody">${fcState.view === "study" ? studyHTML(deckName, dueCount) : manageHTML(deckCards)}</div>
      </div>
    </div>`;

  $$("[data-deck]", root).forEach(d => d.onclick = () => { fcState.deck = d.dataset.deck; fcState.queue = []; fcState.idx = 0; fcState.flipped = false; renderRoute(); });
  $$("[data-view]", root).forEach(b => b.onclick = () => { fcState.view = b.dataset.view; renderRoute(); });
  $("#fcSearch", root).oninput = debounce((e) => { fcState.filter = e.target.value; if (fcState.view === "manage") renderRoute(); }, 260);
  $("#addCard", root).onclick = () => cardModal();
  $("#addDeck", root).onclick = () => deckModal();
  const g = $("#genAi", root); g.onclick = () => { if (!aiGuard()) return; aiCardsModal(); };
  if (fcState.view === "study") bindStudy(root, deckName);
  else bindManage(root);
}

function retention() {
  const r = D.reviews.slice(-200);
  if (!r.length) return 0;
  return Math.round((r.filter(x => x.grade >= 2).length / r.length) * 100);
}

function studyHTML(deckName, dueCount) {
  if (fcState.finished && fcState.queue.length) {
    return `<div class="card">${emptyState("trophy", "Session complete", `You reviewed ${fcState.reviewed} card${fcState.reviewed === 1 ? "" : "s"}. Cards have been rescheduled based on your answers.`, `<button class="btn primary" id="restart">${ico("reset")} New session</button>`)}</div>`;
  }
  if (!fcState.queue.length) {
    fcState.queue = buildQueue(); fcState.idx = 0; fcState.flipped = false; fcState.finished = false;
  }
  if (!fcState.queue.length) {
    return `<div class="card" style="padding:10px">${emptyState("check", dueCount === 0 ? "Nothing due right now" : "No cards in this deck", dueCount === 0 ? "Your schedule is clear. You can study ahead without disturbing the algorithm, or come back when cards are due." : "Add cards to this deck, or generate them from your notes with AI.",
      `<div class="row" style="justify-content:center;gap:8px"><button class="btn" id="studyAhead">${ico("play")} Study ahead</button><button class="btn primary" id="addFirst">${ico("plus")} Add cards</button></div>`)}</div>`;
  }
  const total = fcState.queue.length;
  const card = fcState.queue[fcState.idx];
  if (!card) {
    fcState.finished = true;
    return `<div class="card">${emptyState("trophy", "Session complete", `You reviewed ${fcState.reviewed} card${fcState.reviewed === 1 ? "" : "s"}. Cards have been rescheduled based on your answers.`, `<button class="btn primary" id="restart">${ico("reset")} New session</button>`)}</div>`;
  }
  const progress = Math.round((fcState.idx / total) * 100);
  return `<div class="card">
    <div class="row" style="margin-bottom:4px"><span class="tiny muted">${esc(deckName)}</span><span class="spacer"></span><span class="tiny muted">${fcState.idx + 1} / ${total}</span></div>
    ${progressBar(progress)}
    <div class="flash-stage">
      <div class="flash-card ${fcState.flipped ? "flip" : ""}" id="flashCard" role="button" tabindex="0" aria-label="${fcState.flipped ? "Answer shown. Press space to flip." : "Question. Press space to reveal the answer."}">
        <div class="side">${fcState.flipped ? "Answer" : "Question"} · ${esc(subj(card.subject).name)}</div>
        ${fcState.flipped ? `<div class="a">${esc(card.back)}</div>` : `<div class="q">${esc(card.front)}</div>`}
        <div class="tiny muted" style="position:absolute;bottom:14px">${fcState.flipped ? "How well did you recall it?" : "Tap or press Space to reveal"}</div>
      </div>
      ${fcState.flipped ? `<div class="rate-row">
        <button class="rate-btn r1" data-grade="0"><b>Again</b><span>${dueLabel(0, card)}</span></button>
        <button class="rate-btn r2" data-grade="1"><b>Hard</b><span>${dueLabel(1, card)}</span></button>
        <button class="rate-btn r3" data-grade="2"><b>Good</b><span>${dueLabel(2, card)}</span></button>
        <button class="rate-btn r4" data-grade="3"><b>Easy</b><span>${dueLabel(3, card)}</span></button>
      </div>` : `<div style="margin-top:16px;display:flex;gap:8px"><button class="btn" id="editThisCard">${ico("edit")} Edit</button><button class="btn primary" id="flipBtn">Reveal answer</button></div>`}
    </div>
    <div class="row" style="justify-content:center;gap:10px;margin-top:6px">
      <button class="btn sm ghost" id="prevCard" ${fcState.idx === 0 ? "disabled" : ""}>${ico("arrowLeft")} Previous</button>
      <button class="btn sm ghost" id="skipCard">Skip</button>
      <button class="btn sm ghost" id="endSession">End session</button>
    </div>
  </div>`;
}
function dueLabel(grade, card) {
  const test = { ...card, ease: card.ease || 2.5, interval: card.interval || 0, reps: card.reps || 0 };
  if (grade === 0) return "today";
  const mult = grade === 1 ? 1.2 : grade === 3 ? (test.ease) * 1.3 : test.ease;
  const iv = test.interval ? Math.round(test.interval * mult) : grade === 1 ? 1 : grade === 3 ? 3 : 1;
  return iv === 1 ? "1 day" : iv + " days";
}
function bindStudy(root, deckName) {
  const card = fcState.queue[fcState.idx];
  const flip = () => { fcState.flipped = !fcState.flipped; renderRoute(); };
  const fc = $("#flashCard", root); if (fc) { fc.onclick = flip; fc.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } }; }
  const fb = $("#flipBtn", root); if (fb) fb.onclick = flip;
  const restart = $("#restart", root); if (restart) restart.onclick = () => { fcState.queue = []; fcState.idx = 0; fcState.reviewed = 0; fcState.finished = false; fcState.mode = "due"; renderRoute(); };
  const ahead = $("#studyAhead", root); if (ahead) ahead.onclick = () => { fcState.mode = "all"; fcState.queue = []; renderRoute(); };
  const addFirst = $("#addFirst", root); if (addFirst) addFirst.onclick = () => cardModal();
  $$("[data-grade]", root).forEach(b => b.onclick = () => {
    if (!card) return;
    scheduleCard(card, +b.dataset.grade);
    fcState.reviewed++;
    if (+b.dataset.grade === 0) { fcState.queue.push(card); }
    fcState.idx++; fcState.flipped = false;
    if (fcState.idx >= fcState.queue.length) { fcState.finished = true; fcState.idx = 0; fcState.flipped = false; }
    logActivity(`Reviewed a ${subj(card.subject).name} flashcard`, "cards", "flashcards");
    renderRoute();
  });
  const prev = $("#prevCard", root); if (prev && !prev.disabled) prev.onclick = () => { fcState.idx = Math.max(0, fcState.idx - 1); fcState.flipped = false; renderRoute(); };
  const skip = $("#skipCard", root); if (skip) skip.onclick = () => { fcState.idx++; fcState.flipped = false; if (fcState.idx >= fcState.queue.length) { fcState.finished = true; fcState.idx = 0; } renderRoute(); };
  const end = $("#endSession", root); if (end) end.onclick = () => { fcState.queue = []; fcState.idx = 0; fcState.finished = false; renderRoute(); };
  const ed = $("#editThisCard", root); if (ed) ed.onclick = () => cardModal(card);
  const keyHandler = (e) => {
    if (e.target.matches("input,textarea,select,[contenteditable=true]")) return;
    if (fcState.view !== "study") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!fcState.flipped) { fcState.flipped = true; renderRoute(); } }
    else if (["1", "2", "3", "4"].includes(e.key)) { const b = $(`[data-grade="${+e.key - 1}"]`, document); if (b) b.click(); }
  };
  window._fcKey = keyHandler; document.addEventListener("keydown", keyHandler);
}

function manageHTML(cards) {
  if (!cards.length) return `<div class="card">${emptyState("cards", "No cards yet", "Create cards manually or generate them from a note.", `<button class="btn primary" id="firstCard">${ico("plus")} Add your first card</button>`)}</div>`;
  return `<div class="card pad-0" style="overflow:hidden">
    <table><thead><tr><th>Front</th><th style="width:130px">Deck</th><th style="width:110px">Due</th><th style="width:90px">Reps</th><th style="width:70px"></th></tr></thead>
    <tbody>${cards.map(c => `<tr>
      <td><div style="font-weight:550">${esc(c.front)}</div><div class="tiny muted" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.back)}</div></td>
      <td><span class="chip">${esc(D.decks.find(d => d.id === c.deck)?.name || "Deck")}</span></td>
      <td class="small ${(c.due || "") <= D2.iso() ? "muted" : ""}">${esc(D2.rel(c.due || D2.iso()))}</td>
      <td class="small muted">${c.reps || 0}</td>
      <td><div class="row" style="gap:2px"><button class="icon-btn" style="width:27px;height:27px" data-edit="${c.id}" aria-label="Edit card">${ico("edit")}</button>
      <button class="icon-btn" style="width:27px;height:27px" data-del="${c.id}" aria-label="Delete card">${ico("trash")}</button></div></td>
    </tr>`).join("")}</tbody></table></div>`;
}
function bindManage(root) {
  const first = $("#firstCard", root); if (first) first.onclick = () => cardModal();
  $$("[data-edit]", root).forEach(b => b.onclick = () => cardModal(D.cards.find(c => c.id === b.dataset.edit)));
  $$("[data-del]", root).forEach(b => b.onclick = () => confirmDialog("Delete card?", "It will be removed from this deck permanently.", () => {
    D.cards = D.cards.filter(c => c.id !== b.dataset.del); saveDB(); renderRoute();
  }));
}
function cardModal(card) {
  const edit = !!card;
  const decks = D.decks;
  modal({
    title: edit ? "Edit card" : "New card", icon: "cards", body: `
      <div class="field"><label for="cfFront">Front (question)</label><textarea id="cfFront" rows="3" placeholder="What is the derivative of sin x?">${esc(card?.front || "")}</textarea></div>
      <div class="field"><label for="cfBack">Back (answer)</label><textarea id="cfBack" rows="3" placeholder="cos x">${esc(card?.back || "")}</textarea></div>
      <div class="input-row">
        <div class="field"><label for="cfDeck">Deck</label><select id="cfDeck">${decks.map(d => `<option value="${d.id}" ${(card?.deck || fcState.deck) === d.id ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="cfSubject">Subject</label><select id="cfSubject">${SUBJECTS.map(s => `<option value="${s.id}" ${card?.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${card?.subject === "general" ? "selected" : ""}>General</option></select></div>
      </div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="cfSave">${edit ? "Save card" : "Add card"}</button>`,
    onMount: (m) => {
      $("#cfFront", m).focus();
      $("#cfSave", m).onclick = () => {
        const f = $("#cfFront", m).value.trim(), b = $("#cfBack", m).value.trim();
        if (!f || !b) return toast("Both sides are required.", "warn");
        if (edit) { Object.assign(card, { front: f, back: b, deck: $("#cfDeck", m).value, subject: $("#cfSubject", m).value }); }
        else {
          D.cards.unshift({ id: uid("c"), front: f, back: b, deck: $("#cfDeck", m).value, subject: $("#cfSubject", m).value, ease: 2.5, interval: 0, reps: 0, due: D2.iso(), lapses: 0, created: D2.iso() });
          logActivity(`Created flashcard “${f.slice(0, 40)}”`, "cards", "flashcards");
        }
        saveDB(); closeModal(); fcState.queue = []; renderRoute(); toast(edit ? "Card updated" : "Card added");
      };
    }
  });
}
function deckModal() {
  modal({
    title: "New deck", icon: "cards", body: `<div class="field"><label for="dkName">Deck name</label><input id="dkName" placeholder="e.g. Organic chemistry mechanisms"></div>
      <div class="field"><label for="dkSub">Subject</label><select id="dkSub">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}<option value="general">General</option></select></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="dkAdd">Create deck</button>`,
    onMount: (m) => $("#dkAdd", m).onclick = () => {
      const name = $("#dkName", m).value.trim(); if (!name) return;
      const d = { id: uid("d"), name, subject: $("#dkSub", m).value };
      D.decks.push(d); saveDB(); closeModal(); fcState.deck = d.id; renderRoute(); toast("Deck created");
    }
  });
}
function aiCardsModal() {
  const noteOpts = D.notes.map(n => `<option value="${n.id}">${esc(n.title)}</option>`).join("");
  modal({
    title: "Generate flashcards with AI", icon: "sparkle", wide: true, body: `
      <div class="row" style="margin-bottom:12px"><span class="chip brand">${ico("sparkle")} Real AI request</span><span class="tiny muted">Cards are generated from text you supply, then saved locally. Review them before studying.</span></div>
      <div class="field"><label for="aiSrc">Source</label><select id="aiSrc"><option value="note">Use one of my notes</option><option value="paste">Paste text</option></select></div>
      <div class="field" id="notePickWrap"><label for="aiNote">Note</label><select id="aiNote">${noteOpts || `<option value="">No notes available</option>`}</select></div>
      <div class="field hidden" id="pasteWrap"><label for="aiText">Source text</label><textarea id="aiText" rows="8" placeholder="Paste a chapter summary, lecture transcript or article…"></textarea></div>
      <div class="input-row">
        <div class="field"><label for="aiCount">Number of cards</label><select id="aiCount">${[5, 8, 10, 15, 20].map(n => `<option ${n === 10 ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div class="field"><label for="aiDeck">Add to deck</label><select id="aiDeck">${D.decks.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="aiDifficulty">Style</label><select id="aiDifficulty"><option value="definition">Definitions & facts</option><option value="conceptual">Conceptual understanding</option><option value="exam">Exam-style recall</option></select></div>
      </div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="aiGen">${ico("sparkle")} Generate cards</button>`,
    onMount: (m) => {
      $("#aiSrc", m).onchange = () => {
        const paste = $("#aiSrc", m).value === "paste";
        $("#pasteWrap", m).classList.toggle("hidden", !paste);
        $("#notePickWrap", m).classList.toggle("hidden", paste);
      };
      $("#aiGen", m).onclick = async () => {
        if (!aiGuard()) return;
        let text = "";
        const src = $("#aiSrc", m).value;
        if (src === "note") {
          const n = D.notes.find(x => x.id === $("#aiNote", m).value);
          if (!n) return toast("Choose a note with content first.", "warn");
          text = n.plain || n.html.replace(/<[^>]+>/g, " ");
        } else text = $("#aiText", m).value.trim();
        if (text.length < 80) return toast("Add at least a paragraph of source text.", "warn");
        const btn = $("#aiGen", m); btn.disabled = true; btn.innerHTML = `<span class="typing"><i></i><i></i><i></i></span> Generating…`;
        try {
          const count = $("#aiCount", m).value, style = $("#aiDifficulty", m).value;
          const out = await AI.chat([{ role: "user", content: `Create ${count} flashcards from the material below. Style: ${style}. Rules: one testable fact or concept per card; fronts must be answerable without the source; no duplicates; include a short answer. Return ONLY a JSON array of objects with keys "front" and "back". Do not wrap in commentary.\n\nMATERIAL:\n${text.slice(0, 12000)}` }], { system: "You are an expert instructional designer. Output valid JSON only.", temperature: 0.35, max_tokens: 2600 });
          let arr;
          try {
            const m2 = out.match(/\[[\s\S]*\]/);
            arr = JSON.parse(m2 ? m2[0] : out);
          } catch { throw new Error("The AI response was not valid JSON. Nothing was saved. Try again with a shorter source."); }
          if (!Array.isArray(arr) || !arr.length) throw new Error("No usable cards were returned. Nothing was saved.");
          const deck = $("#aiDeck", m).value;
          const deckObj = D.decks.find(d => d.id === deck);
          let added = 0;
          arr.slice(0, 40).forEach(x => {
            if (!x || !x.front || !x.back) return;
            D.cards.unshift({ id: uid("c"), front: String(x.front).slice(0, 400), back: String(x.back).slice(0, 1200), deck, subject: deckObj?.subject || "general", ease: 2.5, interval: 0, reps: 0, due: D2.iso(), lapses: 0, created: D2.iso(), aiGenerated: true });
            added++;
          });
          if (!added) throw new Error("The returned cards were missing front/back text. Nothing was saved.");
          logActivity(`Generated ${added} flashcards with AI`, "sparkle", "flashcards");
          saveDB(); closeModal(); fcState.queue = []; renderRoute();
          toast(`${added} cards added to ${deckObj?.name || "deck"}. Review them before studying.`, "ok", "Cards generated");
        } catch (e) {
          toast(e.message, "err", "Generation failed");
          btn.disabled = false; btn.innerHTML = `${ico("sparkle")} Generate cards`;
        }
      };
    }
  });
}
page("flashcards", { title: "Flashcards" }, renderFlashcards);
</script>
<script>
/* ============================ MIND MAPS ============================ */
const mmState = { sel: null, drag: null };

function renderMindmaps(root, { params }) {
  if (params.id) return renderMapEditor(root, params.id);
  const maps = [...D.mindmaps].sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  root.innerHTML = `
    ${pageHead({ eyebrow: "Workspace", title: "Mind maps", desc: "Turn a tangled topic into a visible structure. Drag nodes freely; connections follow.", actions: `<button class="btn primary" id="newMap">${ico("plus")} New map</button>` })}
    <div class="grid g-auto">
      ${maps.length ? maps.map(m => `<div class="card hoverable" data-map="${m.id}" role="button" tabindex="0" style="cursor:pointer">
        <div class="row" style="align-items:flex-start;margin-bottom:10px"><div class="tile" style="background:${subj(m.subject).color}1c;color:${subj(m.subject).color}">${ico("map")}</div><span class="spacer"></span><span class="chip">${m.nodes.length} nodes</span></div>
        <h4 style="font-size:14px;margin-bottom:3px">${esc(m.title)}</h4>
        <div class="small muted">${esc(subj(m.subject).name)} · edited ${esc(D2.rel((m.updated || "").slice(0, 10)))}</div>
        <div style="margin-top:12px;display:flex;gap:3px;flex-wrap:wrap">${m.nodes.slice(0, 4).map(n => `<span class="chip tiny" style="font-size:10px">${esc(n.text.slice(0, 22))}</span>`).join("")}${m.nodes.length > 4 ? `<span class="chip tiny" style="font-size:10px">+${m.nodes.length - 4}</span>` : ""}</div>
      </div>`).join("") : `<div class="card" style="grid-column:1/-1">${emptyState("map", "No mind maps yet", "Start with a central idea, then branch outward. Maps are saved automatically.", `<button class="btn primary" id="newMap2">${ico("plus")} Create your first map</button>`)}</div>`}
    </div>`;
  const nm = () => newMapModal();
  $("#newMap", root).onclick = nm;
  const n2 = $("#newMap2", root); if (n2) n2.onclick = nm;
  $$("[data-map]", root).forEach(m => m.onclick = () => go("mindmaps", { id: m.dataset.map }));
}

function newMapModal() {
  modal({
    title: "New mind map", icon: "map", body: `
      <div class="field"><label for="mmTitle">Central idea</label><input id="mmTitle" placeholder="e.g. The French Revolution"></div>
      <div class="field"><label for="mmSub">Subject</label><select id="mmSub">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}<option value="general">General</option></select></div>
      <div class="field"><label class="label">Optional: seed branches</label><textarea id="mmBranches" rows="3" placeholder="One per line, e.g.&#10;Causes&#10;Key events&#10;Consequences"></textarea><div class="hint">Leave empty to start with just the centre.</div></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="mmCreate">Create map</button>`,
    onMount: (m) => $("#mmCreate", m).onclick = () => {
      const title = $("#mmTitle", m).value.trim() || "Untitled map";
      const branches = $("#mmBranches", m).value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 8);
      const nodes = [{ id: "root", text: title, x: 50, y: 50, parent: null }];
      branches.forEach((b, i) => {
        const ang = (i / Math.max(1, branches.length)) * Math.PI * 2;
        nodes.push({ id: uid("mn"), text: b, x: clamp(50 + Math.cos(ang) * 26, 8, 92), y: clamp(50 + Math.sin(ang) * 30, 8, 92), parent: "root" });
      });
      const map = { id: uid("mm"), title, subject: $("#mmSub", m).value, nodes, created: D2.iso(), updated: D2.iso() };
      D.mindmaps.unshift(map); saveDB(); closeModal(); go("mindmaps", { id: map.id });
    }
  });
}

  root.innerHTML = `
    <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <button class="btn sm ghost" data-go="mindmaps">${ico("arrowLeft")} Maps</button>
      <input id="mapTitle" value="${esc(map.title)}" style="max-width:300px;font-weight:650;border-color:transparent;background:transparent;font-size:16px" aria-label="Map title">
      <select id="mapSubject" style="width:auto;font-size:11.5px;padding:4px 24px 4px 8px" aria-label="Subject">${SUBJECTS.map(s => `<option value="${s.id}" ${map.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${map.subject === "general" ? "selected" : ""}>General</option></select>
      <span class="spacer"></span>
      <button class="btn sm" id="addChild" ${sel ? "" : "disabled"}>${ico("plus")} Add branch</button>
      <button class="btn sm" id="renameNode" ${sel ? "" : "disabled"}>${ico("edit")} Rename</button>
      <button class="btn sm" id="delNode" ${sel && sel.id !== "root" ? "disabled" : "disabled"}>${ico("trash")}</button>
      <button class="btn sm ghost" id="exportMap">${ico("download")}</button>
      <button class="btn sm ghost danger" id="delMap">${ico("trash")}</button>
    </div>
    <div class="mm-canvas" id="canvas" role="application" aria-label="Mind map canvas. Select a node, then add or rename branches.">
      <svg id="mmLines" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        ${map.nodes.filter(n => n.parent).map(n => { const p = map.nodes.find(x => x.id === n.parent); if (!p) return ""; return `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="var(--line)" stroke-width="0.35" vector-effect="non-scaling-stroke"/>`; }).join("")}
      </svg>
      ${map.nodes.map(n => `<div class="mm-node ${n.id === "root" ? "root" : ""} ${mmState.sel === n.id ? "sel" : ""}" data-node="${n.id}" style="left:${n.x}%;top:${n.y}%" tabindex="0" role="button" aria-label="Node: ${esc(n.text)}">${esc(n.text)}</div>`).join("")}
      <div class="mm-tools">
        <button class="btn sm" id="addChild2">${ico("plus")} Branch</button>
        <button class="btn sm ghost" id="centreMap">${ico("target")} Centre</button>
        <span class="tiny muted" style="align-self:center;padding:0 5px">Drag nodes · select then add</span>
      </div>
    </div>
    <p class="tiny muted" style="margin-top:8px">Changes save automatically. Deleting a branch also removes its sub-branches.</p>`;

  const canvas = $("#canvas", root);
  const saveMap = debounce(() => { map.updated = new Date().toISOString(); saveDB(true); }, 400);
  $("#mapTitle", root).oninput = (e) => { map.title = e.target.value; saveMap(); };
  $("#mapSubject", root).onchange = (e) => { map.subject = e.target.value; saveMap(); };

  function select(nid) {
    mmState.sel = nid;
    $$(".mm-node", root).forEach(el => el.classList.toggle("sel", el.dataset.node === nid));
    $("#addChild", root).disabled = !nid; $("#renameNode", root).disabled = !nid;
    const n = map.nodes.find(x => x.id === nid);
    $("#delNode", root).disabled = !n || n.id === "root";
  }
  $$("[data-node]", root).forEach(el => {
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault(); select(el.dataset.node);
      const r = canvas.getBoundingClientRect();
      const node = map.nodes.find(n => n.id === el.dataset.node);
      mmState.drag = { id: node.id, r, moved: false };
      el.setPointerCapture(e.pointerId);
      const move = (ev) => {
        if (!mmState.drag) return;
        node.x = clamp(((ev.clientX - r.left) / r.width) * 100, 3, 97);
        node.y = clamp(((ev.clientY - r.top) / r.height) * 100, 4, 96);
        el.style.left = node.x + "%"; el.style.top = node.y + "%";
        drawLines(); mmState.drag.moved = true;
      };
      const up = () => {
        el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up);
        if (mmState.drag?.moved) saveMap();
        mmState.drag = null;
      };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
    });
    el.addEventListener("dblclick", () => { select(el.dataset.node); renameNode(); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { select(el.dataset.node); renameNode(); } });
  });
  function drawLines() {
    const svg = $("#mmLines", root);
    svg.innerHTML = map.nodes.filter(n => n.parent).map(n => { const p = map.nodes.find(x => x.id === n.parent); if (!p) return ""; return `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="var(--line)" stroke-width="0.35" vector-effect="non-scaling-stroke"/>`; }).join("");
  }
  function addChild(parentId) {
    const parent = map.nodes.find(n => n.id === parentId) || map.nodes.find(n => n.id === "root");
    const siblings = map.nodes.filter(n => n.parent === parent.id).length;
    const ang = siblings * 0.9 + 0.3;
    const node = { id: uid("mn"), text: "New idea", x: clamp(parent.x + Math.cos(ang) * 20, 6, 94), y: clamp(parent.y + Math.sin(ang) * 22, 8, 92), parent: parent.id };
    map.nodes.push(node); saveMap(); renderMapEditor(root, id); mmState.sel = node.id;
    setTimeout(() => renameNode(), 50);
  }
  const add = () => addChild(mmState.sel || "root");
  $("#addChild", root).onclick = add; $("#addChild2", root).onclick = add;
  function renameNode() {
    const n = map.nodes.find(x => x.id === mmState.sel); if (!n) return;
    modal({ title: n.id === "root" ? "Rename central idea" : "Rename branch", icon: "edit", body: `<div class="field"><label for="mnText">Text</label><input id="mnText" value="${esc(n.text)}" maxlength="90"></div>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="mnSave">Save</button>`,
      onMount: (m) => { const inp = $("#mnText", m); inp.select(); inp.onkeydown = (e) => { if (e.key === "Enter") $("#mnSave", m).click(); };
        $("#mnSave", m).onclick = () => { n.text = inp.value.trim() || n.text; saveMap(); closeModal(); renderMapEditor(root, id); }; } });
  }
  $("#renameNode", root).onclick = renameNode;
  $("#delNode", root).onclick = () => {
    const n = map.nodes.find(x => x.id === mmState.sel); if (!n || n.id === "root") return;
    const collect = (nid) => { const kids = map.nodes.filter(x => x.parent === nid); return [nid, ...kids.flatMap(k => collect(k.id))]; };
    const ids = collect(n.id);
    confirmDialog("Delete branch?", `“${n.text}” and ${ids.length - 1} sub-branch(es) will be deleted.`, () => {
      map.nodes = map.nodes.filter(x => !ids.includes(x.id)); mmState.sel = null; saveDB(); renderMapEditor(root, id);
    });
  };
  $("#centreMap", root).onclick = () => {
    const rootNode = map.nodes.find(n => n.id === "root");
    const cx = rootNode?.x ?? 50, cy = rootNode?.y ?? 50;
    map.nodes.forEach(n => { n.x = clamp(n.x - cx + 50, 4, 96); n.y = clamp(n.y - cy + 50, 5, 95); });
    saveMap(); renderMapEditor(root, id);
  };
  $("#exportMap", root).onclick = () => {
    const outline = []; const walk = (nid, depth) => { map.nodes.filter(n => n.parent === nid).forEach(n => { outline.push("  ".repeat(depth) + "- " + n.text); walk(n.id, depth + 1); }); };
    const rootNode = map.nodes.find(n => n.id === "root");
    const txt = map.title + "\n\n" + (rootNode ? "• " + rootNode.text : "") + "\n" + outline.join("\n");
    download(map.title.replace(/[^\w\s-]/g, "") + ".txt", txt, "text/plain");
    toast("Outline exported");
  };
  $("#delMap", root).onclick = () => confirmDialog("Delete mind map?", `“${map.title}” will be permanently deleted.`, () => {
    D.mindmaps = D.mindmaps.filter(m => m.id !== map.id); saveDB(); go("mindmaps"); toast("Map deleted");
  });
  const del = $("#delNode", root); if (del) del.disabled = !sel || sel.id === "root";
}
page("mindmaps", { title: "Mind maps" }, renderMindmaps);
</script>

const QUESTION_BANK = (() => {
  const out = [];
  Object.entries(BANK_RAW).forEach(([subject, rows]) => rows.forEach((r, i) => {
    const [topic, difficulty, type, text, options, answer, explanation] = r;
    out.push({ id: `qb_${subject}_${i}`, subject, topic, difficulty, type, text, options: options || null, answer: typeof answer === "number" ? answer : null, model: typeof answer === "string" ? answer : null, explanation });

/* ============================ EXAMS ============================ */
const examSession = { active: null, timer: null };

function renderExams(root, { params }) {

  $$("[data-practice-topic]", root).forEach(b => b.onclick = () => {

  }));

}

function quickPractice() {
  const opts = SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  modal({
    title: "Quick practice", icon: "play", body: `
      <p class="small muted">10 questions, 15 minutes, immediate explanations. Perfect for a focused warm-up.</p>
      <div class="field"><label for="qpSub">Subject</label><select id="qpSub">${opts}</select></div>
      <div class="field"><label for="qpDiff">Difficulty</label><select id="qpDiff"><option value="any">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="qpGo">Start 10 questions</button>`,
    onMount: (m) => $("#qpGo", m).onclick = () => {
      const s = $("#qpSub", m).value, d = $("#qpDiff", m).value;
      let pool = QUESTION_BANK.filter(q => q.subject === s && (d === "any" || q.difficulty === d));
      if (pool.length < 5) pool = QUESTION_BANK.filter(q => q.subject === s);
      if (!pool.length) return toast("No bank questions for this subject. Create a custom exam instead.", "warn");
      const picked = shuffle(pool).slice(0, 10);
      closeModal(); startCustom(picked, `Quick practice — ${subj(s).name}`, s, 15);
    }
  });
}
function shuffle(a) { const x = [...a]; for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }

function buildExamModal(preselect) {

  const subjectsWithQuestions = uniq(QUESTION_BANK.map(q => q.subject));
  modal({
    title: "Create an exam", icon: "exam", wide: true, body: `
      <div class="field"><label for="exTitle">Exam title</label><input id="exTitle" placeholder="e.g. Mid-term revision paper"></div>

        <div class="field"><label for="exDiff">Difficulty</label><select id="exDiff"><option value="any">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
        <div class="field"><label for="exCount">Questions</label><select id="exCount">${[5, 8, 10, 15, 20, 25, 30].map(n => `<option ${n === 10 ? "selected" : ""}>${n}</option>`).join("")}</select></div>

    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="exCreate">${ico("plus")} Build exam</button>`,
    onMount: (m) => {
      const preview = () => {
        const s = $("#exSub", m).value, d = $("#exDiff", m).value;
        const custom = D.questionBank.filter(q => q.subject === s);
        let pool = [...QUESTION_BANK.filter(q => q.subject === s && (d === "any" || q.difficulty === d)), ...($("#exCustom", m).checked ? custom : [])];
        $("#exPreview", m).textContent = `${pool.length} questions available`;
      };
      ["exSub", "exDiff", "exCustom"].forEach(id => $("#" + id, m).addEventListener("change", preview));
      preview();
      $("#exCreate", m).onclick = () => {
        const s = $("#exSub", m).value, d = $("#exDiff", m).value, n = +$("#exCount", m).value, dur = clamp(+$("#exDur", m).value || 30, 5, 180), due = $("#exDue", m).value || null;
        const custom = D.questionBank.filter(q => q.subject === s);

        if (!pool.length) return toast("No questions match those filters.", "warn");
        const picked = shuffle(pool).slice(0, n).map(q => ({ ...q, id: uid("q") }));
        const title = $("#exTitle", m).value.trim() || `${subj(s).name} ${d === "any" ? "mixed" : d} paper`;
        const e = { id: uid("e"), title, subject: s, duration: dur, dueDate: due, createdAt: D2.iso(), questions: picked };
        D.exams.unshift(e); saveDB(); closeModal(); startExam(e.id);
      };
    }
  });
}

function startExam(examId) {
  const e = D.exams.find(x => x.id === examId);
  if (!e) return;
  startCustom(e.questions, e.title, e.subject, e.duration, e);
}
function startCustom(questions, title, subject, duration, savedExam) {
  if (examSession.timer) clearInterval(examSession.timer);
  examSession.active = {
    id: uid("att"), examId: savedExam?.id || "practice", examTitle: title, subject, duration,
    questions, answers: {}, startedAt: new Date().toISOString(), endsAt: Date.now() + duration * 60000, index: 0
  };
  go("exams", { take: examSession.active.id });
}
