<script>
/* ============================ AI TUTOR ============================ */
const tutorState = { chatId: null, controller: null, pending: false };

function tutorSystem(subjectId, level) {
  const s = subjectId && subjectId !== "general" ? subj(subjectId).name : "any subject";
  return `You are Atlas, a patient, rigorous academic tutor for a ${level || "university"} student. Subject focus: ${s}.

How you teach:
- Lead with understanding, not answers. Explain the underlying idea first, then the method, then the answer.
- Match vocabulary and depth to the student's level (${level || "university"}). If a simpler idea would unlock it, offer that first.
- Use short, well-structured Markdown: a brief direct answer, then numbered steps, then one concrete worked example, then a common-mistake warning.
- Use LaTeX-free plain notation for maths (x^2, sqrt(), integral sign words) unless code is clearly better; keep equations readable in plain text.
- When solving problems, show every step and say WHY each step is valid.
- After explaining, ask one focused check-for-understanding question, or offer a small practice problem.
- If the question is ambiguous, state the assumption you are making rather than refusing.
- Never invent sources, statistics, or quotes. If uncertain, say what is uncertain.
- If the student appears to misunderstand something, name the misconception gently and correct it.
- Do not pad with praise, filler, or repeated summaries.`;
}

function renderTutor(root, { params }) {
  const chats = [...D.chats].sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  if (params.id) tutorState.chatId = params.id;
  if (!tutorState.chatId || !chats.some(c => c.id === tutorState.chatId)) tutorState.chatId = chats[0]?.id || null;
  const active = chats.find(c => c.id === tutorState.chatId);

  root.innerHTML = `
  <div class="tutor">
    <aside class="chat-list" aria-label="Conversations">
      <div class="chat-list-head">
        <button class="btn primary sm block" id="newChat">${ico("plus")} New session</button>
      </div>
      <div class="chat-items" id="chatItems">
        ${chats.length ? chats.map(c => `<div class="chat-item ${c.id === tutorState.chatId ? "on" : ""}" data-chat="${c.id}" role="button" tabindex="0">
          <div class="t">${esc(c.title)}</div>
          <div class="s">${esc(subj(c.subject).name)} · ${esc(D2.rel((c.updated || "").slice(0, 10)))}${c.saved ? " · saved" : ""}</div>
        </div>`).join("") : `<div class="muted small" style="padding:12px;line-height:1.6">No sessions yet. Start with a topic you find difficult.</div>`}
      </div>
      <div style="padding:9px;border-top:1px solid var(--line)">
        <button class="btn sm ghost block" data-go="settings" data-tab="ai">${ico("key")} AI settings</button>
      </div>
    </aside>
    <section class="chat-main" aria-label="Tutor conversation">
      <div class="chat-head" id="chatHead"></div>
      <div class="chat-scroll" id="chatScroll" aria-live="polite"></div>
      <div class="chat-compose">
        <div class="compose-inner">
          <label class="sr-only" for="tutorInput">Message the tutor</label>
          <textarea id="tutorInput" rows="1" placeholder="${AI.ready() ? "Ask anything — “explain eigenvectors like I'm 16”, “check my working”, “quiz me on cell respiration”…" : "Configure an AI key in Settings to start tutoring"}" ${AI.ready() ? "" : "disabled"}></textarea>
          <div class="compose-bar">
            <select class="sel" id="tutorSubject" aria-label="Subject focus">${[["general", "Any subject"], ...SUBJECTS.map(s => [s.id, s.name])].map(([v, l]) => `<option value="${v}" ${active?.subject === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
            <select class="sel" id="tutorLevel" aria-label="Explanation level">${LEVELS.map(l => `<option ${(D.profile.level || CURRENT_USER.level) === l ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
            <span class="spacer"></span>
            <span class="tiny muted" id="tutorHint">Enter to send · Shift+Enter for a new line</span>
            <button class="btn primary sm" id="sendBtn" ${AI.ready() ? "" : "disabled"}>${ico("send")} Send</button>
            <button class="btn sm danger hidden" id="stopBtn">${ico("pause")} Stop</button>
          </div>
        </div>
        <div class="tiny muted" style="padding:6px 6px 0; display:flex; gap:10px; flex-wrap:wrap">
          <span>${AI.ready() ? "AI responses can be wrong — verify important facts." : "No AI provider is connected. Responses are never simulated."}</span>
          <span style="margin-left:auto">${esc(AI.cfg().model)}</span>
        </div>
      </div>
    </section>
  </div>`;

  const scroll = $("#chatScroll", root);
  const head = $("#chatHead", root);

  function paintHead() {
    const c = D.chats.find(x => x.id === tutorState.chatId);
    head.innerHTML = c ? `
      <div class="tile" style="width:30px;height:30px;background:${subj(c.subject).color}22;color:${subj(c.subject).color}">${ico(subj(c.subject).icon)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</div>
      <div class="tiny muted">${esc(subj(c.subject).name)} · ${c.messages.length} messages${c.saved ? " · saved" : ""}</div></div>
      <button class="icon-btn" id="renameChat" data-tip="Rename" aria-label="Rename conversation">${ico("edit")}</button>
      <button class="icon-btn" id="saveChat" data-tip="Save as note" aria-label="Save conversation as note">${ico("save")}</button>
      <button class="icon-btn" id="delChat" data-tip="Delete" aria-label="Delete conversation">${ico("trash")}</button>`
      : `<div style="flex:1"><div style="font-size:13.5px;font-weight:650">New tutoring session</div><div class="tiny muted">Choose a subject and ask your first question.</div></div>`;
    if (!c) return;
    $("#renameChat", head).onclick = () => {
      modal({ title: "Rename session", body: `<div class="field"><label for="rn">Title</label><input id="rn" value="${esc(c.title)}"></div>`,
        footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rnSave">Save</button>`,
        onMount: (m) => $("#rnSave", m).onclick = () => { c.title = $("#rn", m).value.trim() || c.title; c.updated = new Date().toISOString(); saveDB(); renderRoute(); closeModal(); } });
    };
    $("#saveChat", head).onclick = () => { c.saved = true; saveDB(); saveChatAsNote(c); };
    $("#delChat", head).onclick = () => confirmDialog("Delete this session?", "The conversation will be permanently removed. Saved notes are unaffected.", () => {
      D.chats = D.chats.filter(x => x.id !== c.id); tutorState.chatId = null; saveDB(); renderRoute(); toast("Session deleted");
    });
  }

  function paintMessages() {
    const c = D.chats.find(x => x.id === tutorState.chatId);
    if (!c) {
      scroll.innerHTML = `<div style="max-width:640px;margin:20px auto 0">
        ${AI.ready() ? `<div style="text-align:center;padding:16px 0 22px">
          <div class="tile" style="width:48px;height:48px;border-radius:14px;margin:0 auto 14px">${ico("sparkle")}</div>
          <h2 style="font-size:21px;margin-bottom:6px">What should we understand today?</h2>
          <p class="muted small">Atlas explains the reasoning, checks your understanding, and adapts to your level.</p>
        </div>
        <div class="grid g2" style="gap:8px">
          ${[["Explain the chain rule with a real example", "math"], ["Why does osmosis only move water?", "biology"], ["Walk me through balancing a redox equation", "chemistry"], ["Quiz me on the causes of WWI", "history"], ["Explain pointers and memory in C", "cs"], ["Help me outline a comparative essay", "literature"]].map(([q, s]) => `<button class="btn" style="justify-content:flex-start;text-align:left;white-space:normal;height:auto;padding:11px 13px" data-starter="${esc(q)}" data-subj="${s}">${ico("sparkle")} <span>${esc(q)}</span></button>`).join("")}
        </div>` : `<div class="card">${emptyState("key", "AI tutoring needs a provider key", "Atlas calls OpenRouter directly from your browser with a key you control. Until a key is added, no AI request is made and nothing is simulated.", `<div class="row" style="justify-content:center"><button class="btn" data-go="settings" data-tab="ai">Open AI settings</button><button class="btn ghost" id="whyKey">Why my own key?</button></div>`)}</div>`}
      </div>`;
      $$("[data-starter]", scroll).forEach(b => b.onclick = () => {
        if (!AI.ready()) return;
        $("#tutorSubject").value = b.dataset.subj;
        $("#tutorInput").value = b.dataset.starter;
        send();
      });
      const why = $("#whyKey", scroll); if (why) why.onclick = () => modal({ title: "How the AI connection works", icon: "shield", body: `<p>Atlas is a local-first application. There is no Atlas server holding an API key, so the app cannot bundle one without exposing it.</p><p>You connect your own OpenRouter account once. The key is stored in this browser's local storage and sent only to <code>openrouter.ai</code> when you send a message.</p><p class="muted small">This keeps the app transparent: every AI action either reaches a real provider or tells you it cannot.</p>`, footer: `<button class="btn primary" data-close>Understood</button>` });
      return;
    }
    scroll.innerHTML = c.messages.map((m, i) => msgHTML(m, i)).join("");
    bindMsgActions();
    requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
  }

  function msgHTML(m, i) {
    const isUser = m.role === "user";
    return `<div class="msg ${isUser ? "user" : "ai"}" data-mi="${i}">
      <div class="av">${isUser ? esc((D.profile.name || "You").slice(0, 1).toUpperCase()) : ico("sparkle")}</div>
      <div class="body">
        <div class="who">${isUser ? "You" : "Atlas"} ${!isUser && m.model ? `<span class="tiny" style="font-weight:500;opacity:.6">${esc(m.model)}</span>` : ""}${m.error ? `<span class="chip danger">error</span>` : ""}</div>
        ${m.error ? `<div class="text"><div style="background:var(--danger-soft);border:1px solid rgba(220,38,38,.25);color:var(--danger);padding:10px 13px;border-radius:9px;font-size:13px">${esc(m.errorMessage || "The request failed.")}<div class="tiny" style="opacity:.8;margin-top:4px;color:var(--muted)">No answer was generated. Retry or check Settings → AI.</div></div></div>` : `<div class="text">${isUser ? `<p>${esc(m.content).replace(/\n/g, "<br>")}</p>` : md(m.content || "")}</div>`}
        ${!isUser && m.content ? `<div class="msg-actions">
          <button data-copy="${i}" aria-label="Copy response">${ico("copy")} Copy</button>
          <button data-save="${i}" aria-label="Save as note">${ico("save")} Save</button>
          <button data-retry="${i}" aria-label="Regenerate response">${ico("reset")} Retry</button>
        </div>` : ""}
      </div></div>`;
  }

  function bindMsgActions() {
    const c = D.chats.find(x => x.id === tutorState.chatId); if (!c) return;
    $$("[data-copy]", scroll).forEach(b => b.onclick = () => copyText(c.messages[+b.dataset.copy].content));
    $$("[data-save]", scroll).forEach(b => b.onclick = () => saveMessageAsNote(c, c.messages[+b.dataset.save]));
    $$("[data-retry]", scroll).forEach(b => b.onclick = () => {
      if (tutorState.pending) return;
      const i = +b.dataset.retry;
      c.messages = c.messages.slice(0, i); saveDB(); paintMessages(); send(c.messages[i - 1]?.content || "");
    });
  }

  function paintAll() { paintHead(); paintMessages(); }

  // initial
  paintAll();
  const preSub = sessionStorage.getItem("atlas:tutorSubject");
  if (preSub) { sessionStorage.removeItem("atlas:tutorSubject"); const sel = $("#tutorSubject", root); if (sel) sel.value = preSub; }
  const prefill = sessionStorage.getItem("atlas:tutorPrefill");
  if (prefill) {
    sessionStorage.removeItem("atlas:tutorPrefill");
    const inp = $("#tutorInput", root);
    if (inp) { inp.value = prefill; inp.style.height = "auto"; inp.style.height = Math.min(180, inp.scrollHeight) + "px"; inp.focus(); }
  }

  // chat switching
  $$("[data-chat]", root).forEach(el => el.onclick = () => {
    if (tutorState.pending) return toast("Please wait for the current response or stop it.", "warn");
    tutorState.chatId = el.dataset.chat;
    const c = D.chats.find(x => x.id === tutorState.chatId);
    if (c) $("#tutorSubject").value = c.subject;
    $$("[data-chat]", root).forEach(x => x.classList.toggle("on", x.dataset.chat === tutorState.chatId));
    paintAll();
  });

  $("#newChat", root).onclick = () => {
    if (tutorState.pending) return toast("Stop the current response first.", "warn");
    tutorState.chatId = null; paintAll();
    const c = D.chats.find(x => x.id === tutorState.chatId);
    $("#tutorInput").focus();
  };

  const ta = $("#tutorInput", root);
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(180, ta.scrollHeight) + "px"; });
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  $("#sendBtn", root).onclick = () => send();
  $("#stopBtn", root).onclick = () => { tutorState.controller?.abort(); };

  async function send(forceText) {
    if (!AI.ready()) return aiGuard();
    if (tutorState.pending) return;
    const text = (forceText || ta.value).trim();
    if (!text) return;
    const subject = $("#tutorSubject", root).value;
    const level = $("#tutorLevel", root).value;
    let c = D.chats.find(x => x.id === tutorState.chatId);
    if (!c) {
      c = { id: uid("ch"), title: text.slice(0, 60), subject, created: new Date().toISOString(), updated: new Date().toISOString(), messages: [], saved: false };
      D.chats.unshift(c); tutorState.chatId = c.id;
      const items = $("#chatItems", root);
      const first = $(".chat-item", items);
      const div = document.createElement("div");
      div.className = "chat-item on"; div.dataset.chat = c.id; div.setAttribute("role", "button"); div.tabIndex = 0;
      div.innerHTML = `<div class="t">${esc(c.title)}</div><div class="s">${esc(subj(subject).name)} · just now</div>`;
      if (first) items.insertBefore(div, first); else items.innerHTML = "";
      $$(".chat-item", items).forEach(x => { if (x !== div) x.classList.remove("on"); });
      div.onclick = () => { tutorState.chatId = c.id; paintAll(); $$(".chat-item", items).forEach(x => x.classList.toggle("on", x.dataset.chat === c.id)); };
    }
    if (!forceText) { ta.value = ""; ta.style.height = "auto"; }
    c.messages.push({ role: "user", content: text, at: new Date().toISOString() });
    if (c.messages.length === 1) c.title = text.slice(0, 60);
    c.updated = new Date().toISOString();
    c.subject = subject;
    saveDB();
    paintHead(); paintMessages();

    // streaming ai placeholder
    const placeholder = { role: "assistant", content: "", at: new Date().toISOString(), model: AI.cfg().model, pending: true };
    c.messages.push(placeholder);
    const el = document.createElement("div");
    el.className = "msg ai"; el.id = "streamMsg";
    el.innerHTML = `<div class="av">${ico("sparkle")}</div><div class="body"><div class="who">Atlas <span class="tiny" style="opacity:.6">${esc(AI.cfg().model)}</span></div>
      <div class="text" id="streamText"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
    scroll.appendChild(el); scroll.scrollTop = scroll.scrollHeight;

    tutorState.pending = true;
    tutorState.controller = new AbortController();
    $("#sendBtn", root).classList.add("hidden"); $("#stopBtn", root).classList.remove("hidden");
    $("#tutorHint", root).textContent = "Generating…";
    document.body.dataset.generating = "1";

    const history = c.messages.slice(0, -1).slice(-14).map(m => ({ role: m.role, content: m.content }));
    try {
      const full = await AI.chat(history, {
        system: tutorSystem(subject, level), temperature: 0.45, max_tokens: 2200,
        signal: tutorState.controller.signal,
        onToken: (t, all) => {
          const st = $("#streamText");
          if (st) { st.innerHTML = md(all); }
          scroll.scrollTop = scroll.scrollHeight;
        }
      });
      placeholder.content = full; placeholder.pending = false;
      c.updated = new Date().toISOString();
      logActivity(`Tutoring session: ${c.title}`, "sparkle", "tutor");
      saveDB();
      paintMessages();
    } catch (err) {
      if (err.name === "AbortError") {
        placeholder.content = (placeholder.content || "") + "\n\n_(stopped)_";
        placeholder.pending = false;
        if (!placeholder.content.trim()) c.messages.pop();
      } else {
        c.messages.pop();
        c.messages.push({ role: "assistant", content: "", error: true, at: new Date().toISOString(), errorMessage: err.message });
        // store error separately so it is never treated as content
        c.messages[c.messages.length - 1].content = "";
        renderRoute();
        toast(err.message, "err", "AI request failed");
        setTimeout(() => {
          modal({ title: "The AI request failed", icon: "alert", body: `<p>${esc(err.message)}</p><p class="small muted">Nothing was fabricated in place of the answer. Check Settings → AI, your credit balance, or your connection, then retry.</p>`, footer: `<button class="btn" data-close>Close</button><button class="btn primary" data-go="settings" data-tab="ai" data-close>Open AI settings</button>` });
        }, 60);
      }
    } finally {
      tutorState.pending = false; tutorState.controller = null;
      $("#sendBtn", root)?.classList.remove("hidden"); $("#stopBtn", root)?.classList.add("hidden");
      $("#tutorHint", root) && ($("#tutorHint", root).textContent = "Enter to send · Shift+Enter for a new line");
      delete document.body.dataset.generating;
      saveDB();
      if (!c.messages.some(m => m.error)) paintMessages();
    }
  }
}

function saveChatAsNote(c) {
  const body = c.messages.filter(m => m.role === "assistant" && m.content).map(m => `<h3>${esc(m.at ? D2.fmt(m.at, { month: "short", day: "numeric" }) : "Explanation")}</h3>${md(m.content)}`).join("<hr>");
  const n = { id: uid("n"), title: "Tutor notes — " + c.title, subject: c.subject === "general" ? "general" : c.subject, folder: "f_default", tags: ["ai-saved"], html: body, plain: c.messages.map(m => m.content).join(" "), created: D2.iso(), updated: D2.iso(), pinned: false };
  D.notes.unshift(n); logActivity(`Saved tutoring explanation “${n.title}”`, "note", "notes"); saveDB();
  toast("Conversation saved to Notes", "ok"); go("notes", { id: n.id });
}
function saveMessageAsNote(c, m) {
  const n = { id: uid("n"), title: (c.title || "Tutor explanation").slice(0, 70), subject: c.subject === "general" ? "general" : c.subject, folder: "f_default", tags: ["ai-saved"], html: md(m.content), plain: m.content, created: D2.iso(), updated: D2.iso(), pinned: false };
  D.notes.unshift(n); saveDB(); toast("Explanation saved to Notes");
}
page("tutor", { title: "AI Tutor" }, renderTutor);
</script>
<script>
/* ============================ SUBJECT CENTRES ============================ */

  history: [["Crash Course World History", "https://www.youtube.com/playlist?list=PLBDA2E52FB1EF80C9"], ["Internet History Sourcebooks", "https://sourcebooks.fordham.edu/"], ["Our World in Data", "https://ourworldindata.org/"]],

  accounting: [["OpenStax Principles of Accounting", "https://openstax.org/details/books/principles-financial-accounting"], ["IFRS Foundation", "https://www.ifrs.org/"], ["Investopedia ratios", "https://www.investopedia.com/terms/r/ratioanalysis.asp"]],
  business: [["Harvard Business Review", "https://hbr.org/"], ["OpenStax Business", "https://openstax.org/subjects/business"], ["OECD data", "https://data.oecd.org/"]],
  philosophy: [["Stanford Encyclopedia of Philosophy", "https://plato.stanford.edu/"], ["Internet Encyclopedia of Philosophy", "https://iep.utm.edu/"], ["Philosophy Basics", "https://www.philosophybasics.com/"]],
  science: [["NASA Science", "https://science.nasa.gov/"], ["PhET simulations", "https://phet.colorado.edu/"], ["Scientific American", "https://www.scientificamerican.com/"]],

};

function renderSubjects(root, { params }) {
  const id = params.id;
  if (id) return renderSubjectDetail(root, id);
  const rows = SUBJECTS.map(s => ({ s, t: topicStats(s.id), open: !!D.subjects[s.id] }));
  const started = rows.filter(r => r.open).length;
  const mastered = rows.reduce((a, r) => a + r.t.mastered, 0);
  const totalTopics = rows.reduce((a, r) => a + r.t.total, 0);

  root.innerHTML = `
    ${pageHead({ eyebrow: "Learning centre", title: "Subjects", desc: `${started} of ${SUBJECTS.length} subjects active · ${mastered}/${totalTopics} topics mastered. Open a subject to track topics, revise with notes, and generate targeted practice.`, actions: `<button class="btn" data-go="tools">${ico("calc")} Reference tools</button><button class="btn primary" data-go="exams">${ico("exam")} Practise</button>` })}
    <div class="grid g-auto" style="margin-bottom:18px">
      ${rows.map(({ s, t, open }) => `<div class="subject-tile" data-sid="${s.id}" role="button" tabindex="0" aria-label="Open ${esc(s.name)}">
        <div class="st-ico" style="background:${s.color}1c;color:${s.color}">${ico(s.icon)}</div>
        <h4>${esc(s.name)}</h4>
        <div class="meta">${t.mastered} mastered · ${t.learning} in progress</div>
        ${progressBar(t.pct)}
        <div class="row" style="justify-content:space-between;margin-top:7px">
          <span class="tiny muted">${open ? t.pct + "% ready" : "Not started"}</span>
          <span class="tiny" style="color:${s.color}">${open ? "Continue" : "Start"} ${ico("arrowRight")}</span>
        </div>
      </div>`).join("")}
    </div>
    <div class="card">
      <div class="card-head"><h3>How to use subject centres</h3></div>
      <div class="grid g3" style="gap:14px">
        ${[["target", "Track topic mastery", "Mark each topic as new, learning or mastered. Mastery feeds your dashboard and revision recommendations."],
           ["sparkle", "Ask for an explanation", "Open the AI tutor with this subject in focus and your level preset — every answer adapts."],
           ["exam", "Generate practice", "Build a timed exam from the question bank or your own questions, then review weak topics."]].map(([i, t, d]) => `
          <div class="row" style="align-items:flex-start;gap:10px"><div class="tile">${ico(i)}</div><div><div style="font-weight:650;font-size:13px;margin-bottom:2px">${t}</div><div class="small muted">${d}</div></div></div>`).join("")}
      </div>
    </div>`;
  $$("[data-sid]", root).forEach(el => {
    el.onclick = () => go("subjects", { id: el.dataset.sid });
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } };
  });
}

function renderSubjectDetail(root, id) {
  const s = SUBJECTS.find(x => x.id === id);
  if (!s) { root.innerHTML = `<div class="card">${emptyState("alert", "Subject not found", "That subject does not exist.", `<button class="btn" data-go="subjects">Back to subjects</button>`)}</div>`; return; }
  const st = D.subjects[s.id] = D.subjects[s.id] || { topics: {}, updated: D2.iso() };
  st.topics = st.topics || {};
  const t = topicStats(s.id);
  const notes = D.notes.filter(n => n.subject === s.id);
  const cards = D.cards.filter(c => c.subject === s.id);
  const attempts = D.attempts.filter(a => a.subject === s.id);
  const res = RESOURCES[s.id] || [];
  const STATUS = { new: ["Not started", ""], learning: ["In progress", "warn"], mastered: ["Mastered", "ok"] };

  root.innerHTML = `
    <div class="row" style="margin-bottom:14px"><button class="btn sm ghost" data-go="subjects">${ico("arrowLeft")} All subjects</button></div>
    <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,${s.color}14,transparent 65%)">
      <div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div class="st-ico" style="width:52px;height:52px;border-radius:14px;background:${s.color}22;color:${s.color};display:grid;place-items:center;flex:none">${ico(s.icon)}</div>
        <div style="flex:1;min-width:220px">
          <div class="eyebrow" style="color:${s.color}">Subject centre</div>
          <h1 style="font-size:26px;margin:2px 0 4px">${esc(s.name)}</h1>
          <div class="row wrap" style="gap:6px">
            <span class="chip">${t.mastered}/${t.total} mastered</span>
            <span class="chip">${notes.length} notes</span>
            <span class="chip">${cards.length} cards</span>
            <span class="chip">${attempts.length} practice runs</span>
          </div>
        </div>
        <div class="row" style="gap:17px;flex-wrap:wrap">
          ${donutChart([{ v: t.mastered, c: s.color }, { v: t.learning, c: s.color + "66" }, { v: Math.max(0, t.total - t.mastered - t.learning), c: "var(--panel-3)" }], { size: 88, thickness: 10, center: `<div><b style="font-size:15px">${t.pct}%</b><div class="tiny muted">ready</div></div>` })}
          <div class="stack" style="gap:6px">
            <button class="btn primary sm" data-go="tutor" data-subj="${s.id}" id="askSubj">${ico("sparkle")} Ask the tutor</button>
            <button class="btn sm" id="practiceSubj">${ico("exam")} Build practice</button>
            <button class="btn sm" id="newSubjectNote">${ico("note")} New note</button>
          </div>
        </div>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px" id="subjGrid">
      <div class="card">
        <div class="card-head"><h3>Topics & mastery</h3><span class="tiny muted">Click a status to cycle</span></div>
        <div class="topics-list">${s.topics.map(topic => {
          const v = st.topics[topic] || "new"; const [label, cls] = STATUS[v];
          return `<div class="topic">
            <button class="icon-btn" style="width:28px;height:28px;border-radius:8px;${v === "mastered" ? `background:${s.color};color:#fff;border-color:${s.color}` : ""}" data-cycle="${esc(topic)}" aria-label="Change status for ${esc(topic)}">${ico(v === "mastered" ? "check" : v === "learning" ? "clock" : "plus")}</button>
            <div class="grow" style="flex:1;min-width:0"><div style="font-size:13px;font-weight:550">${esc(topic)}</div><div class="tiny muted">${label}</div></div>
            <button class="btn sm ghost" data-topic-ask="${esc(topic)}" data-tip="Explain this topic">${ico("sparkle")}</button>
            <button class="btn sm ghost" data-topic-cards="${esc(topic)}" data-tip="Make cards">${ico("cards")}</button>
          </div>`;
        }).join("")}</div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-head"><h3>Study resources</h3></div>
          <div class="list">${res.map(([name, url]) => `<a class="list-row" href="${url}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><div class="tile" style="width:28px;height:28px">${ico("link")}</div><div class="grow"><div class="t">${esc(name)}</div><div class="s">External · opens in a new tab</div></div>${ico("arrowRight")}</a>`).join("")}</div>
          <p class="tiny muted" style="margin:10px 0 0">Resources are curated links to established providers. Atlas does not copy or host their content.</p>
        </div>
        <div class="card">
          <div class="card-head"><h3>Your materials</h3></div>
          ${notes.length ? `<div class="list">${notes.slice(0, 4).map(n => `<div class="list-row" style="cursor:pointer" data-open-note="${n.id}"><div class="grow"><div class="t">${esc(n.title)}</div><div class="s">Edited ${esc(D2.rel((n.updated || "").slice(0, 10)))}</div></div>${ico("chevronRight")}</div>`).join("")}</div>` : `<p class="small muted">No notes in this subject yet.</p>`}
          <div class="divider"></div>
          <div class="row wrap" style="gap:6px"><span class="chip brand">${cards.filter(c => (c.due || "") <= D2.iso()).length} cards due</span><button class="btn sm ghost" data-go="flashcards">Review</button></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Practice history</h3></div>
          ${attempts.length ? `<div class="list">${attempts.slice(-4).reverse().map(a => `<div class="list-row"><div class="grow"><div class="t">${esc(a.examTitle)}</div><div class="s">${esc(D2.rel((a.finishedAt || "").slice(0, 10)))}</div></div><span class="chip ${a.score >= 80 ? "ok" : a.score >= 60 ? "warn" : "danger"}">${a.score}%</span></div>`).join("")}</div>` : `<p class="small muted">No practice attempts yet. Build a short exam to see where you stand.</p>`}
        </div>
      </div>
    </div>`;

  $$("[data-cycle]", root).forEach(b => b.onclick = () => {
    const k = b.dataset.cycle; const cur = st.topics[k] || "new";
    st.topics[k] = cur === "new" ? "learning" : cur === "learning" ? "mastered" : "new";
    st.updated = D2.iso(); logActivity(`${s.name}: ${k} marked ${st.topics[k]}`, s.icon, "subjects"); saveDB(); renderSubjectDetail(root, id);
  });
  $("#askSubj", root).onclick = () => { sessionStorage.setItem("atlas:tutorSubject", s.id); go("tutor"); };
  $$("[data-topic-ask]", root).forEach(b => b.onclick = () => {
    sessionStorage.setItem("atlas:tutorPrefill", `Explain "${b.dataset.topicAsk}" in ${s.name} clearly, with one worked example and a common mistake to avoid.`);
    sessionStorage.setItem("atlas:tutorSubject", s.id); go("tutor");
  });
  $$("[data-topic-cards]", root).forEach(b => b.onclick = () => go("flashcards", { topic: b.dataset.topicCards, subject: s.id }));
  $("#practiceSubj", root).onclick = () => go("exams", { build: s.id });
  $("#newSubjectNote", root).onclick = () => {
    const n = { id: uid("n"), title: "Untitled " + s.name + " note", subject: s.id, folder: "f_default", tags: [], html: "", plain: "", created: D2.iso(), updated: D2.iso() };
    D.notes.unshift(n); saveDB(); go("notes", { id: n.id });
  };
  $$("[data-open-note]", root).forEach(n => n.onclick = () => go("notes", { id: n.dataset.openNote }));
  const g = $("#subjGrid"); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}
page("subjects", { title: "Subjects" }, renderSubjects);
</script>
<script>
/* ============================ NOTES ============================ */
const notesState = { folder: "all", q: "", tag: null, saveTimer: null, dirty: false };

function renderNotes(root, { params }) {
  const folders = D.folders;
  const activeId = params.id;
  let list = D.notes.filter(n => notesState.folder === "all" || n.folder === notesState.folder);
  if (notesState.q) { const q = notesState.q.toLowerCase(); list = list.filter(n => (n.title + " " + (n.plain || "") + " " + (n.tags || []).join(" ")).toLowerCase().includes(q)); }
  if (notesState.tag) list = list.filter(n => (n.tags || []).includes(notesState.tag));
  list = [...list].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updated || "").localeCompare(a.updated || ""));
  const note = D.notes.find(n => n.id === activeId) || null;
  const allTags = uniq(D.notes.flatMap(n => n.tags || []));

  root.innerHTML = `
    ${pageHead({ eyebrow: "Workspace", title: "Notes", desc: "Rich notes organised by subject, folder and tag — saved automatically as you type.", actions: `<button class="btn" id="tplBtn">${ico("layers")} Templates</button><button class="btn primary" id="newNote">${ico("plus")} New note</button>` })}
    <div class="notes-layout" id="notesLayout">
      <aside class="card" style="padding:9px; align-self:start">
        <div class="row" style="justify-content:space-between;padding:2px 6px 6px"><span class="label">Folders</span><button class="icon-btn" style="width:24px;height:24px;border:0;background:transparent" id="addFolder" aria-label="New folder">${ico("plus")}</button></div>
        <div class="folder-list">
          <div class="fl ${notesState.folder === "all" ? "on" : ""}" data-folder="all">${ico("layers")} All notes <span class="n">${D.notes.length}</span></div>
          ${folders.map(f => `<div class="fl ${notesState.folder === f.id ? "on" : ""}" data-folder="${f.id}">
            <span style="width:8px;height:8px;border-radius:2px;background:${f.color || "#6c5ce7"};flex:none"></span>${esc(f.name)}<span class="n">${D.notes.filter(n => n.folder === f.id).length}</span></div>`).join("")}
        </div>
        <div class="divider"></div>
        <div class="label" style="padding:0 6px 5px">Tags</div>
        <div class="row wrap" style="gap:4px;padding:0 5px">
          ${allTags.length ? allTags.map(t => `<button class="chip ${notesState.tag === t ? "brand" : ""}" data-tag="${esc(t)}" style="cursor:pointer;border:0">${esc(t)}</button>`).join("") : `<span class="tiny muted">No tags yet</span>`}
        </div>
      </aside>
      <div class="card" style="padding:0;align-self:start;overflow:hidden">
        <div style="padding:9px"><div class="search-wrap" style="width:100%;margin:0">${ico("search")}<input id="noteSearch" placeholder="Search notes…" value="${esc(notesState.q)}" aria-label="Search notes"></div></div>
        <div style="max-height:62vh;overflow:auto" id="noteList">
          ${list.length ? list.map(n => `<div class="chat-item ${n.id === activeId ? "on" : ""}" data-note="${n.id}" role="button" tabindex="0" style="border-bottom:1px solid var(--line-soft);border-radius:0">
            <div class="row" style="gap:6px"><div class="t" style="flex:1">${n.pinned ? ico("star") + " " : ""}${esc(n.title || "Untitled")}</div></div>
            <div class="s">${esc(subj(n.subject).name)} · ${esc(D2.rel((n.updated || "").slice(0, 10)))}</div>
          </div>`).join("") : `<div class="tiny muted" style="padding:16px;text-align:center">No notes match this view.</div>`}
        </div>
        <div style="padding:8px;border-top:1px solid var(--line)"><div class="tiny muted center">${list.length} of ${D.notes.length} notes</div></div>
      </div>
      <div class="card pad-0 note-editor-wrap" style="align-self:start">
        ${note ? noteEditorHTML(note) : `<div style="padding:30px 20px">${emptyState("note", "Select a note", "Choose a note from the list, or create one to start writing.", `<button class="btn primary sm" id="newNote2">${ico("plus")} New note</button>`)}</div>`}
      </div>
    </div>`;

  $("#newNote", root).onclick = createNotePrompt;
  const n2 = $("#newNote2", root); if (n2) n2.onclick = createNotePrompt;
  $("#addFolder", root).onclick = addFolderPrompt;
  $("#tplBtn", root).onclick = templatesPrompt;
  $$("[data-folder]", root).forEach(f => f.onclick = () => { notesState.folder = f.dataset.folder; notesState.tag = null; renderRoute(); });
  $$("[data-tag]", root).forEach(t => t.onclick = () => { notesState.tag = notesState.tag === t.dataset.tag ? null : t.dataset.tag; renderRoute(); });
  $$("[data-note]", root).forEach(n => n.onclick = () => go("notes", { id: n.dataset.note }));
  const ns = $("#noteSearch", root);
  ns.oninput = debounce(() => { notesState.q = ns.value; const pos = ns.selectionStart; renderRoute(); const el = $("#noteSearch"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 220);
  if (note) bindEditor(note, root);
}

function noteEditorHTML(n) {
  return `<div class="row" style="padding:8px 12px;border-bottom:1px solid var(--line);gap:6px;flex-wrap:wrap">
      <span class="save-state" id="saveState">${ico("check")} Saved</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="pinNote" data-tip="${n.pinned ? "Unpin" : "Pin"}" aria-label="Pin note" ${n.pinned ? `style="color:var(--brand)"` : ""}>${ico("star")}</button>
      <button class="icon-btn" id="exportNote" data-tip="Export" aria-label="Export note">${ico("download")}</button>
      <button class="icon-btn" id="dupNote" data-tip="Duplicate" aria-label="Duplicate note">${ico("copy")}</button>
      <button class="icon-btn" id="delNote" data-tip="Delete" aria-label="Delete note">${ico("trash")}</button>
    </div>
    <input class="note-title-input" id="noteTitle" value="${esc(n.title)}" placeholder="Note title" aria-label="Note title">
    <div class="row wrap" style="padding:4px 18px 10px;gap:7px">
      <select id="noteSubject" style="width:auto;font-size:11.5px;padding:4px 24px 4px 8px">${SUBJECTS.map(s => `<option value="${s.id}" ${n.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${n.subject === "general" ? "selected" : ""}>General</option></select>
      <select id="noteFolder" style="width:auto;font-size:11.5px;padding:4px 24px 4px 8px">${D.folders.map(f => `<option value="${f.id}" ${n.folder === f.id ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
      <input id="noteTags" value="${esc((n.tags || []).join(", "))}" placeholder="tags, comma, separated" style="width:auto;flex:1;min-width:120px;font-size:11.5px;padding:4px 8px" aria-label="Tags">
    </div>
    <div class="editor-toolbar" role="toolbar" aria-label="Formatting">
      <button class="tb" data-cmd="bold" data-tip="Bold"><b>B</b></button>
      <button class="tb" data-cmd="italic" data-tip="Italic"><i>I</i></button>
      <button class="tb" data-cmd="underline" data-tip="Underline"><u>U</u></button>
      <button class="tb" data-cmd="strikeThrough" data-tip="Strikethrough">S</button>
      <span class="tb-sep"></span>
      <button class="tb" data-block="h2" data-tip="Heading">H</button>
      <button class="tb" data-block="h3" data-tip="Subheading">h</button>
      <button class="tb" data-cmd="formatBlock" data-val="p" data-tip="Paragraph">¶</button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="insertUnorderedList" data-tip="Bullet list">${ico("list")}</button>
      <button class="tb" data-cmd="insertOrderedList" data-tip="Numbered list">1.</button>
      <button class="tb" data-cmd="formatBlock" data-val="blockquote" data-tip="Quote">${ico("quote")}</button>
      <button class="tb" data-cmd="insertHorizontalRule" data-tip="Divider">—</button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="hiliteColor" data-val="rgba(250,204,21,.35)" data-tip="Highlight">${ico("pencil")}</button>
      <button class="tb" data-cmd="removeFormat" data-tip="Clear formatting">${ico("x")}</button>
      <span class="spacer"></span>
      <button class="tb" id="noteAi" data-tip="Summarise with AI" ${AI.ready() ? "" : "disabled"}>${ico("sparkle")}</button>
    </div>
    <div class="note-body" id="noteBody" contenteditable="true" data-placeholder="Start writing… Use the toolbar for structure, or paste material in." spellcheck="true">${sanitizeHTML(n.html || "")}</div>
    <div class="row" style="padding:8px 16px;border-top:1px solid var(--line);gap:12px">
      <span class="tiny muted" id="wordCount"></span>
      <span class="spacer"></span>
      <span class="tiny muted">Autosaves locally</span>
    </div>`;
}

function bindEditor(n, root) {
  const body = $("#noteBody", root), title = $("#noteTitle", root), state = $("#saveState", root);
  const textOf = (el) => (el.innerText !== undefined ? el.innerText : el.textContent) || "";
  const words = () => (textOf(body).trim().match(/\S+/g) || []).length;
  const wc = $("#wordCount", root);
  const setWC = () => { const w = words(); wc.textContent = `${w} words · ${Math.max(1, Math.round(w / 200))} min read`; };
  setWC();
  const markDirty = () => {
    state.innerHTML = `${ico("clock")} Saving…`; state.className = "save-state";
    clearTimeout(notesState.saveTimer);
    notesState.saveTimer = setTimeout(persist, 600);
  };
  const persist = () => {
    n.title = title.value.trim() || "Untitled note";
    n.html = sanitizeHTML(body.innerHTML);
    n.plain = textOf(body).slice(0, 4000);
    n.subject = $("#noteSubject", root).value;
    n.folder = $("#noteFolder", root).value;
    n.tags = $("#noteTags", root).value.split(",").map(t => t.trim()).filter(Boolean);
    n.updated = new Date().toISOString();
    saveDB();
    state.innerHTML = `${ico("check")} Saved`; state.className = "save-state ok";
    const item = $(`.chat-item[data-note="${n.id}"] .t`);
    if (item) item.textContent = n.title;
  };
  body.addEventListener("input", () => { setWC(); markDirty(); });
  title.addEventListener("input", markDirty);
  $("#noteTags", root).addEventListener("input", markDirty);
  $("#noteSubject", root).addEventListener("change", markDirty);
  $("#noteFolder", root).addEventListener("change", markDirty);
  $$(".tb[data-cmd]", root).forEach(b => b.addEventListener("mousedown", (e) => e.preventDefault()));
  $$(".tb[data-cmd]", root).forEach(b => b.addEventListener("click", () => {
    body.focus();
    try { document.execCommand(b.dataset.cmd, false, b.dataset.val || null); } catch {}
    markDirty();
  }));
  $$(".tb[data-block]", root).forEach(b => b.addEventListener("click", () => {
    body.focus(); try { document.execCommand("formatBlock", false, b.dataset.block); } catch {} markDirty();
  }));
  $("#pinNote", root).onclick = () => { n.pinned = !n.pinned; saveDB(); renderRoute(); };
  $("#delNote", root).onclick = () => confirmDialog("Delete this note?", `“${n.title}” will be permanently deleted.`, () => {
    D.notes = D.notes.filter(x => x.id !== n.id); saveDB(); go("notes"); toast("Note deleted");
  });
  $("#dupNote", root).onclick = () => {
    const copy = { ...n, id: uid("n"), title: n.title + " (copy)", created: D2.iso(), updated: D2.iso(), pinned: false };
    D.notes.unshift(copy); saveDB(); go("notes", { id: copy.id }); toast("Note duplicated");
  };
  $("#exportNote", root).onclick = () => {
    const html = `<!doctype html><meta charset="utf-8"><title>${esc(n.title)}</title><style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;line-height:1.7;color:#111;padding:0 20px}blockquote{border-left:3px solid #6c5ce7;margin:16px 0;padding:6px 16px;background:#f6f6fb}</style><h1>${esc(n.title)}</h1>${n.html}`;
    download((n.title.replace(/[^\w\s-]/g, "").trim() || "note") + ".html", html, "text/html");
    toast("Note exported as HTML");
  };
  $("#noteAi", root).onclick = async () => {
    if (!aiGuard()) return;
    const text = textOf(body).trim();
    if (text.length < 40) return toast("Write a little more before summarising.", "warn");
    const btn = $("#noteAi", root); btn.disabled = true;
    try {
      const about = `Summarise these notes for a ${D.profile.level || "university"} student. Return: 5 key points as a bullet list, then 3 likely exam questions, then one thing the notes leave unclear. Use their own wording where possible.\n\n${text.slice(0, 12000)}`;
      const out = await AI.chat([{ role: "user", content: about }], { system: "You are a concise academic study assistant. Never invent facts not present or reasonably implied by the notes; mark anything uncertain as uncertain.", max_tokens: 900 });
      modal({ title: "AI summary", icon: "sparkle", wide: true, body: `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="who">Atlas summary · generated from this note</div><div class="text">${md(out)}</div></div></div>`,
        footer: `<button class="btn" data-close>Close</button><button class="btn" id="insSum">${ico("plus")} Append to note</button>`,
        onMount: (m) => $("#insSum", m).onclick = () => { body.innerHTML += `<hr><h3>AI summary</h3>${md(out)}`; markDirty(); closeModal(); toast("Summary appended"); } });
    } catch (e) { toast(e.message, "err", "AI request failed"); }
    finally { btn.disabled = false; }
  };
  body.focus();
}

function createNotePrompt() {
  modal({
    title: "New note", icon: "note", body: `
      <div class="field"><label for="nnTitle">Title</label><input id="nnTitle" placeholder="e.g. Photosynthesis — light reactions"></div>
      <div class="input-row">
        <div class="field"><label for="nnSubject">Subject</label><select id="nnSubject">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}<option value="general">General</option></select></div>
        <div class="field"><label for="nnFolder">Folder</label><select id="nnFolder">${D.folders.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="nnTpl">Start from</label><select id="nnTpl">
        <option value="blank">Blank note</option>
        <option value="cornell">Cornell lecture notes</option>
        <option value="summary">Chapter summary</option>
        <option value="essay">Essay plan</option>
        <option value="lab">Lab report</option>
        <option value="formula">Formula sheet</option>
      </select></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="nnCreate">Create note</button>`,
    onMount: (m) => {
      $("#nnTitle", m).addEventListener("keydown", e => { if (e.key === "Enter") $("#nnCreate", m).click(); });
      $("#nnCreate", m).onclick = () => {
        const title = $("#nnTitle", m).value.trim() || "Untitled note";
        const tpl = $("#nnTpl", m).value;
        const n = { id: uid("n"), title, subject: $("#nnSubject", m).value, folder: $("#nnFolder", m).value, tags: [], html: NOTE_TEMPLATES[tpl], plain: "", pinned: false, created: D2.iso(), updated: D2.iso() };
        D.notes.unshift(n); saveDB(); closeModal(); go("notes", { id: n.id });
        toast("Note created");
      };
    }
  });
}
const NOTE_TEMPLATES = {
  blank: "",
  cornell: `<h3>Cue questions</h3><ul><li>What is the core claim?</li><li>Why does it work that way?</li></ul><hr><h3>Notes</h3><p></p><hr><h3>Summary</h3><p></p>`,
  summary: `<h3>Big picture</h3><p></p><h3>Key terms</h3><ul><li></li></ul><h3>Key processes / arguments</h3><ol><li></li></ol><h3>Common exam questions</h3><ul><li></li></ul><h3>What I still don't understand</h3><p></p>`,
  essay: `<h3>Question</h3><p></p><h3>Position / thesis</h3><p></p><h3>Arguments</h3><ol><li><strong>Claim:</strong> <br><em>Evidence:</em> <br><em>Analysis:</em></li><li><strong>Claim:</strong> <br><em>Evidence:</em> <br><em>Analysis:</em></li></ol><h3>Counter-argument</h3><p></p><h3>Conclusion</h3><p></p>`,
  lab: `<h3>Aim</h3><p></p><h3>Hypothesis</h3><p></p><h3>Variables</h3><ul><li><strong>Independent:</strong></li><li><strong>Dependent:</strong></li><li><strong>Control:</strong></li></ul><h3>Method</h3><ol><li></li></ol><h3>Results</h3><p></p><h3>Evaluation</h3><p></p>`,
  formula: `<h3>Core formulas</h3><pre>y = mx + c\n...</pre><h3>When to use each</h3><ul><li></li></ul><h3>Worked example</h3><p></p>`
};
function addFolderPrompt() {
  modal({
    title: "New folder", icon: "folder", body: `<div class="field"><label for="fn">Folder name</label><input id="fn" placeholder="e.g. Term 2 revision"></div>
      <div class="field"><label for="fc">Colour</label><input id="fc" type="color" value="#6c5ce7" style="height:40px;padding:3px"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="fAdd">Create folder</button>`,
    onMount: (m) => $("#fAdd", m).onclick = () => {
      const name = $("#fn", m).value.trim(); if (!name) return;
      D.folders.push({ id: uid("f"), name, color: $("#fc", m).value }); saveDB(); closeModal(); renderRoute(); toast("Folder created");
    }

}
function templatesPrompt() {
  modal({
    title: "Note templates", icon: "layers", body: `<p class="small muted">Templates create a structured starting point. You can edit or delete anything inside.</p>
      <div class="grid g2" style="gap:8px">${[["cornell", "Cornell notes", "Cue / notes / summary"], ["summary", "Chapter summary", "Terms, processes, questions"], ["essay", "Essay plan", "Thesis, arguments, counterpoint"], ["lab", "Lab report", "Aim, variables, evaluation"], ["formula", "Formula sheet", "Formulas with usage notes"]].map(([k, t, d]) => `<button class="btn" style="height:auto;justify-content:flex-start;text-align:left;padding:11px;white-space:normal" data-tpl="${k}"><div><b>${t}</b><div class="tiny muted">${d}</div></div></button>`).join("")}</div>`,
    footer: `<button class="btn" data-close>Close</button>`,
    onMount: (m) => $$("[data-tpl]", m).forEach(b => b.onclick = () => {
      const n = { id: uid("n"), title: b.querySelector("b").textContent, subject: "general", folder: "f_default", tags: ["template"], html: NOTE_TEMPLATES[b.dataset.tpl], plain: "", created: D2.iso(), updated: D2.iso() };
      D.notes.unshift(n); saveDB(); closeModal(); go("notes", { id: n.id });
