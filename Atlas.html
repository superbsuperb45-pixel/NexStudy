function habitsView(body) {
  const last7 = [...Array(7)].map((_, i) => D2.addDays(i - 6));
  body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><b style="font-size:13.5px">Daily habits</b><div class="tiny muted">Small, repeatable actions. Tap a day to toggle it.</div></div><button class="btn sm primary" id="habitAdd">${ico("plus")} New habit</button></div>
    ${D.habits.length ? `<div class="stack">${D.habits.map(h => {
      const streak = habitStreak(h);
      return `<div class="card">
        <div class="row wrap" style="gap:10px;margin-bottom:10px"><div class="tile" style="background:var(--warn-soft);color:var(--warn)">${ico(h.icon || "flame")}</div>
          <div style="flex:1;min-width:130px"><div style="font-weight:650;font-size:13.5px">${esc(h.name)}</div><div class="tiny muted">${streak} day streak · ${h.logs.length} total</div></div>
          <button class="btn sm ${h.logs.includes(D2.iso()) ? "primary" : ""}" data-habit-today="${h.id}">${h.logs.includes(D2.iso()) ? ico("check") + " Done today" : "Mark today"}</button>
          <button class="icon-btn" style="width:26px;height:26px" data-habit-del="${h.id}" aria-label="Delete habit">${ico("trash")}</button>
        </div>
        <div class="row" style="gap:5px">${last7.map(d => `<button class="icon-btn" style="flex:1;height:34px;border-radius:7px;flex-direction:column;gap:1px;${h.logs.includes(d) ? "background:var(--brand);color:#fff;border-color:var(--brand)" : ""}" data-habit-day="${h.id}:${d}" aria-label="${d}">${ico(h.logs.includes(d) ? "check" : "plus")}<span style="font-size:8px">${D2.parse(d).getDate()}</span></button>`).join("")}</div>
      </div>`;
    }).join("")}</div>` : `<div class="card">${emptyState("flame", "No habits tracked", "Habits are the smallest unit of consistency. Add one you can do even on a bad day.", `<button class="btn primary sm" id="habitAdd2">${ico("plus")} Add a habit</button>`)}</div>`}`;
  const add = () => habitModal();
  $("#habitAdd", body).onclick = add; const a2 = $("#habitAdd2", body); if (a2) a2.onclick = add;
  $$("[data-habit-today]", body).forEach(b => b.onclick = () => toggleHabit(b.dataset.habitToday, D2.iso()));
  $$("[data-habit-day]", body).forEach(b => b.onclick = () => { const [id, d] = b.dataset.habitDay.split(":"); toggleHabit(id, d); });
  $$("[data-habit-del]", body).forEach(b => b.onclick = () => confirmDialog("Delete habit?", "Its history will be removed.", () => { D.habits = D.habits.filter(h => h.id !== b.dataset.habitDel); saveDB(); renderPlanner($("#view"), { params: {} }); }));
}
function habitStreak(h) {
  let n = 0, d = new Date();
  if (!h.logs.includes(D2.iso(d))) d.setDate(d.getDate() - 1);
  while (h.logs.includes(D2.iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function toggleHabit(id, day) {
  const h = D.habits.find(x => x.id === id); if (!h) return;
  h.logs = h.logs.includes(day) ? h.logs.filter(d => d !== day) : [...h.logs, day];
  saveDB(); renderPlanner($("#view"), { params: {} });
}
function habitModal() {
  modal({
    title: "New habit", icon: "flame", body: `
      <div class="field"><label for="hbName">Habit</label><input id="hbName" placeholder="e.g. Review flashcards before bed"></div>
      <div class="field"><label for="hbIcon">Icon</label><select id="hbIcon">${[["flame", "Flame"], ["sun", "Morning"], ["cards", "Flashcards"], ["clock", "Focus"], ["bookOpen", "Reading"], ["target", "Practice"]].map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="hbSave">Add habit</button>`,
    onMount: (m) => $("#hbSave", m).onclick = () => {
      const name = $("#hbName", m).value.trim(); if (!name) return toast("Name the habit.", "warn");
      D.habits.push({ id: uid("h"), name, icon: $("#hbIcon", m).value, logs: [] });
      saveDB(); closeModal(); renderPlanner($("#view"), { params: {} }); toast("Habit added");
    }
  });
}

/* ============================ FOCUS TIMER ============================ */
const focusState = { mode: "pomodoro", work: 25, brk: 5, remaining: 25 * 60, running: false, interval: null, startedAt: null, subject: "general", elapsed: 0 };

function renderFocus(root) {
  const F = focusState;
  if (!F.interval) F.remaining = F.work * 60;
  const total = F.work * 60;
  const pct = 100 - Math.round((F.remaining / total) * 100);
  const today = D.sessions.filter(s => s.date === D2.iso());
  const todayMin = sum(today.map(s => s.minutes));
  root.innerHTML = `
    ${pageHead({ eyebrow: "Productivity", title: "Focus timer", desc: "Deliberate, timed study. Completed sessions are logged to your analytics.", actions: `<button class="btn" id="focusSettings">${ico("settings")} Timer settings</button>` })}
    <div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px" id="focusGrid">
      <div class="card">
        <div class="pill-tabs" style="width:fit-content;margin:0 auto 6px">${[["pomodoro", "Pomodoro 25/5"], ["deep", "Deep work 50/10"], ["custom", "Custom"]].map(([k, l]) => `<button class="${F.mode === k ? "on" : ""}" data-fmode="${k}">${l}</button>`).join("")}</div>
        <div class="pomo">
          <div class="pomo-dial" style="--p:${pct}">
            <div class="pomo-inner">
              <div class="pomo-mode" id="pomoMode">${F.running ? "Focus" : "Ready"}</div>
              <div class="pomo-time" id="pomoTime">${fmtClock(F.remaining)}</div>
              <div class="tiny muted" style="margin-top:5px">${D2.dur(F.work)} block · ${D2.dur(F.brk)} break</div>
            </div>
          </div>
          <div class="row" style="gap:8px">
            <button class="btn primary lg" id="pomoToggle">${ico(F.running ? "pause" : "play")} ${F.running ? "Pause" : "Start focus"}</button>
            <button class="btn lg" id="pomoReset">${ico("reset")}</button>
          </div>
          <div class="row" style="gap:8px;margin-top:2px">
            <select id="focusSubject" style="width:auto;font-size:12px;padding:6px 25px 6px 9px" aria-label="Subject">${[["general", "General study"], ...SUBJECTS.map(s => [s.id, s.name])].map(([v, l]) => `<option value="${v}" ${F.subject === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
            <div class="row" style="gap:5px"><span class="chip">${pct}%</span><span class="chip">${todayMin} min today</span></div>
          </div>
          <p class="tiny muted center" style="max-width:42ch">Keep the tab open while you study — the timer runs in this page and does not pretend to work in the background.</p>
        </div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-head"><h3>Today's sessions</h3><span class="tiny muted">${today.length} logged</span></div>
          ${today.length ? `<div class="list">${today.slice(-5).reverse().map(s => `<div class="list-row"><span class="tile" style="width:26px;height:26px">${ico("clock")}</span><div class="grow"><div class="t">${esc(subj(s.subject).name)}</div><div class="s">${s.source} · ${esc(D2.time(s.at || new Date().toISOString()))}</div></div><b class="small">${s.minutes}m</b></div>`).join("")}</div>` : `<p class="small muted">No sessions yet today. One focused block is enough to start.</p>`}
          <div class="divider"></div>
          <div class="row" style="justify-content:space-between"><span class="small muted">Goal</span><span class="small">${D2.dur(todayMin)} / ${D2.dur(D.prefs.dailyGoalMin || 120)}</span></div>
          ${progressBar((todayMin / (D.prefs.dailyGoalMin || 120)) * 100, todayMin >= (D.prefs.dailyGoalMin || 120) ? "ok" : "")}
        </div>
        <div class="card"><div class="card-head"><h3>Manual session</h3></div>
          <p class="small muted">Studied away from the screen? Log it honestly so your analytics stay true.</p>
          <div class="row" style="gap:6px;margin-top:9px"><input id="manualMin" type="number" min="5" max="600" value="30" style="width:80px" aria-label="Minutes"><select id="manualSub" style="flex:1;font-size:12px">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><button class="btn" id="manualAdd">Add</button></div>
        </div>
        <div class="card"><div class="card-head"><h3>Why timed blocks work</h3></div>
          <p class="tiny muted" style="line-height:1.7">A defined block reduces the cost of starting: you commit to 25 minutes, not an entire subject. Breaks are part of the method, not a reward. Log what you actually did, not what you intended.</p>
        </div>
      </div>
    </div>`;

  $$("[data-fmode]", root).forEach(b => b.onclick = () => {
    if (F.running) return toast("Pause the current block first.", "warn");
    F.mode = b.dataset.fmode;
    if (F.mode === "pomodoro") { F.work = 25; F.brk = 5; }
    if (F.mode === "deep") { F.work = 50; F.brk = 10; }
    F.remaining = F.work * 60; renderFocus(root);
  });
  $("#focusSubject", root).onchange = (e) => { F.subject = e.target.value; };
  $("#pomoToggle", root).onclick = () => {
    if (F.running) { F.running = false; clearInterval(F.interval); F.interval = null; renderFocus(root); return; }
    F.running = true; F.startedAt = Date.now();
    const endAt = Date.now() + F.remaining * 1000;
    renderFocus(root);
    F.interval = setInterval(() => {
      F.remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      const t = $("#pomoTime"); const dial = $(".pomo-dial");
      if (t) t.textContent = fmtClock(F.remaining);
      if (dial) dial.style.setProperty("--p", 100 - Math.round((F.remaining / (F.work * 60)) * 100));
      if (F.remaining <= 0) {
        clearInterval(F.interval); F.interval = null; F.running = false;
        completeFocusBlock();
      }
    }, 500);
    window.__clearTimers = () => { if (F.interval) clearInterval(F.interval); F.interval = null; F.running = false; };
  };
  $("#pomoReset", root).onclick = () => { if (F.interval) clearInterval(F.interval); F.interval = null; F.running = false; F.remaining = F.work * 60; renderFocus(root); };
  $("#focusSettings", root).onclick = () => modal({
    title: "Timer settings", icon: "clock", body: `<div class="input-row"><div class="field"><label for="fsWork">Focus minutes</label><input id="fsWork" type="number" min="5" max="120" value="${F.work}"></div><div class="field"><label for="fsBrk">Break minutes</label><input id="fsBrk" type="number" min="1" max="30" value="${F.brk}"></div></div>
      <div class="field"><label for="fsGoal">Daily study goal (minutes)</label><input id="fsGoal" type="number" min="15" max="720" value="${D.prefs.dailyGoalMin || 120}"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="fsSave">Save</button>`,
    onMount: (m) => $("#fsSave", m).onclick = () => {
      F.mode = "custom"; F.work = clamp(+$("#fsWork", m).value || 25, 5, 120); F.brk = clamp(+$("#fsBrk", m).value || 5, 1, 30);
      D.prefs.dailyGoalMin = clamp(+$("#fsGoal", m).value || 120, 15, 720);
      F.remaining = F.work * 60; saveDB(); closeModal(); renderFocus(root);
    }
  });
  $("#manualAdd", root).onclick = () => {
    const mins = clamp(+$("#manualMin", root).value || 0, 1, 600);
    if (!mins) return toast("Enter the minutes studied.", "warn");
    recordStudy(mins, $("#manualSub", root).value, "manual");
    logActivity(`Logged ${mins} minutes of study`, "clock", "focus");
    toast(`${mins} minutes logged`); renderFocus(root);
  };
  const g = $("#focusGrid"); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}
function fmtClock(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function completeFocusBlock() {
  const F = focusState;
  recordStudy(F.work, F.subject, "pomodoro");
  logActivity(`Completed a ${F.work}-minute focus block`, "clock", "focus");
  F.remaining = F.work * 60;
  toast(`${F.work} minutes logged. Take a ${F.brk}-minute break.`, "ok", "Focus block complete");
  renderFocus($("#view"));
}
page("focus", { title: "Focus timer" }, renderFocus);

/* ============================ ANALYTICS ============================ */
function renderProgress(root) {
  const days = [...Array(14)].map((_, i) => D2.addDays(i - 13));
  const series = days.map(d => sum(D.sessions.filter(s => s.date === d).map(s => s.minutes)));
  const bySubject = {};
  D.sessions.forEach(s => { bySubject[s.subject] = (bySubject[s.subject] || 0) + s.minutes; });
  const subjectSegs = Object.entries(bySubject).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => ({ v, c: subj(k).color, k }));
  const total = sum(Object.values(bySubject));
  const attempts = D.attempts.slice(-10);
  const doneTasks = D.tasks.filter(t => t.done).length;
  const submitted = D.assignments.filter(a => a.status === "submitted" || a.status === "graded").length;
  const goal = D.prefs.dailyGoalMin || 120;
  const adherence = days.filter((_, i) => series[i] >= goal).length;

  root.innerHTML = `
    ${pageHead({ eyebrow: "Productivity", title: "Analytics", desc: "Only measured data: study minutes you logged, scores you achieved, work you completed.", actions: `<button class="btn" id="exportCsv">${ico("download")} Export CSV</button>` })}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">${ico("clock")} Total study</div><div class="v">${D2.dur(total)}</div><div class="d">${D.sessions.length} sessions logged</div></div>
      <div class="stat"><div class="k">${ico("flame")} Streak</div><div class="v">${streakDays()} <small>days</small></div><div class="d">${adherence}/${days.length} days hit goal</div></div>
      <div class="stat"><div class="k">${ico("exam")} Exam average</div><div class="v">${attempts.length ? Math.round(avg(attempts.map(a => a.score))) + "%" : "—"}</div><div class="d">${D.attempts.length} attempts</div></div>
      <div class="stat"><div class="k">${ico("check")} Completed</div><div class="v">${doneTasks + submitted}</div><div class="d">${doneTasks} tasks · ${submitted} assignments</div></div>
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px" id="anGrid">
      <div class="card"><div class="card-head"><h3>Study minutes — last 14 days</h3><span class="tiny muted">Goal ${goal} min/day</span></div>
        ${lineChart(series, { h: 190, labels: days.map(d => D2.fmtShort(d)) })}
        <div class="divider"></div>
        <div class="row" style="justify-content:space-between"><span class="small muted">Average</span><b>${D2.dur(avg(series))}/day</b><span class="small muted">Best day</span><b>${D2.dur(Math.max(...series))}</b><span class="small muted">Logged total</span><b>${D2.dur(sum(series))}</b></div>
      </div>
      <div class="card"><div class="card-head"><h3>Time by subject</h3></div>
        <div class="row" style="gap:16px;align-items:center">${donutChart(subjectSegs, { size: 128, thickness: 12, center: `<div><b style="font-size:14px">${D2.dur(total)}</b><div class="tiny muted">total</div></div>` })}
          <div class="legend" style="flex-direction:column;gap:7px">${subjectSegs.map(s => `<span><i style="background:${s.c}"></i>${esc(subj(s.k).name)} <span class="muted">${D2.dur(s.v)}</span></span>`).join("") || `<span class="muted">No sessions yet</span>`}</div></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><h3>Consistency</h3><span class="tiny muted">Last 18 weeks · darker means more minutes</span></div>
      ${heatmap(D.sessions)}
    </div>
    <div class="grid g2" style="gap:16px">
      <div class="card"><div class="card-head"><h3>Exam scores</h3></div>
        ${attempts.length ? `<div class="list">${[...attempts].reverse().map(a => `<div class="list-row"><div class="grow"><div class="t">${esc(a.examTitle)}</div><div class="s">${esc(subj(a.subject).name)} · ${esc(D2.rel((a.finishedAt || "").slice(0, 10)))}</div></div><span class="chip ${a.score >= 80 ? "ok" : a.score >= 60 ? "warn" : "danger"}">${a.score}%</span></div>`).join("")}</div>` : `<p class="small muted">No attempts yet.</p>`}
      </div>
      <div class="card"><div class="card-head"><h3>Mastery by subject</h3></div>
        <div class="stack">${SUBJECTS.filter(s => D.subjects[s.id]).map(s => { const t = topicStats(s.id); return `<div><div class="row" style="justify-content:space-between;margin-bottom:4px"><span class="small">${esc(s.name)}</span><span class="tiny muted">${t.pct}%</span></div>${progressBar(t.pct)}</div>`; }).join("") || `<p class="small muted">Open a subject and start marking topics.</p>`}</div>
      </div>
    </div>`;
  $("#exportCsv", root).onclick = () => {
    const rows = [["date", "minutes", "subject", "source"]].concat(D.sessions.map(s => [s.date, s.minutes, subj(s.subject).name, s.source]));
    download("atlas-study-log.csv", rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
    toast("Study log exported");
  };
  const g = $("#anGrid"); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}
page("progress", { title: "Analytics" }, renderProgress);
</script>

  ["Planck constant", "h", "6.626 × 10⁻³⁴ J·s"], ["Elementary charge", "e", "1.602 × 10⁻¹⁹ C"], ["Electron mass", "mₑ", "9.109 × 10⁻³¹ kg"],
  ["Proton mass", "mₚ", "1.673 × 10⁻²⁷ kg"], ["Avogadro constant", "Nₐ", "6.022 × 10²³ mol⁻¹"], ["Boltzmann constant", "k", "1.381 × 10⁻²³ J/K"],
  ["Gas constant", "R", "8.314 J/(mol·K)"], ["Speed of sound in air (20 °C)", "v", "343 m/s"], ["Astronomical unit", "AU", "1.496 × 10¹¹ m"]

<script>
/* ============================ STUDY TOOLS ============================ */
const toolsState = { tab: "calculator", graphRange: 10, calcExpr: "", calcAns: "", convCat: "length", formulaQ: "", ptFilter: "" };

function renderTools(root, { params }) {
  if (params.tab) toolsState.tab = params.tab;
  const tabs = [["calculator", "Scientific"], ["graphing", "Graphing"], ["solver", "Equation solver"], ["units", "Unit converter"], ["formulas", "Formula library"], ["periodic", "Periodic table"], ["chemistry", "Chemistry"], ["physics", "Physics"], ["notation", "Notation"], ["stats", "Statistics"]];
  root.innerHTML = `
    ${pageHead({ eyebrow: "Toolkit", title: "Study tools", desc: "Working calculators and references — no placeholder buttons. Every result is computed here in your browser.", actions: `<button class="btn" data-go="languages">${ico("globe")} Language centre</button>` })}
    <div class="pill-tabs" id="toolTabs" style="margin-bottom:16px">${tabs.map(([k, l]) => `<button class="${toolsState.tab === k ? "on" : ""}" data-ttab="${k}">${l}</button>`).join("")}</div>
    <div id="toolBody"></div>`;
  $$("[data-ttab]", root).forEach(b => b.onclick = () => { toolsState.tab = b.dataset.ttab; renderTools(root, { params: {} }); });
  const body = $("#toolBody", root);
  ({ calculator: toolCalculator, graphing: toolGraphing, solver: toolSolver, units: toolUnits, formulas: toolFormulas, periodic: toolPeriodic, chemistry: toolChemistry, physics: toolPhysics, notation: toolNotation, stats: toolStats }[toolsState.tab] || toolCalculator)(body);
}

/* ---------- scientific calculator ---------- */
function calcEval(input) {
  let s = input.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/π/g, "Math.PI").replace(/√/g, "Math.sqrt").replace(/\^/g, "**").replace(/,/g, "");
  // factorials
  s = s.replace(/(\d+(?:\.\d+)?)!/g, (_, n) => { let v = 1; for (let i = 2; i <= Math.floor(+n); i++) v *= i; return String(v); });
  s = s.replace(/\b(sin|cos|tan|asin|acos|atan|log|ln|sqrt|abs|exp)\(/g, (m, f) => f === "ln" ? "Math.log(" : f === "log" ? "Math.log10(" : "Math." + f + "(");
  if (!/^[0-9+\-*/().\s]*(?:Math\.(?:PI|E|sqrt|sin|cos|tan|asin|acos|atan|log10|log|abs|exp))*[0-9+\-*/().\s]*$/.test(s.replace(/Math\.(?:PI|E|sqrt|sin|cos|tan|asin|acos|atan|log10|log|abs|exp)/g, ""))) throw new Error("Unsupported expression. Use numbers, + − × ÷, ^, √, sin, cos, tan, log, ln.");
  const fn = new Function("return (" + s + ")");
  const v = fn();
  if (typeof v !== "number" || !isFinite(v)) throw new Error("Result is not a finite number.");
  return v;
}
function toolCalculator(body) {
  const keys = [["sin(", "fn"], ["cos(", "fn"], ["tan(", "fn"], ["ln(", "fn"], ["log(", "fn"],
    ["√(", "fn"], ["(", "op"], [")", "op"], ["^", "op"], ["C", "op"],
    ["7", ""], ["8", ""], ["9", ""], ["÷", "op"], ["⌫", "op"],
    ["4", ""], ["5", ""], ["6", ""], ["×", "op"], ["π", "op"],
    ["1", ""], ["2", ""], ["3", ""], ["−", "op"], ["e", "op"],
    ["0", ""], [".", ""], ["%", "op"], ["+", "op"], ["=", "eq"]];
  body.innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px" id="calcGrid">
    <div class="card"><div class="calc">
      <div class="calc-screen"><div class="calc-expr" id="calcExpr">${esc(toolsState.calcExpr) || "&nbsp;"}</div><div class="calc-out" id="calcOut">${esc(toolsState.calcAns || "0")}</div></div>
      <div class="calc-keys">${keys.map(([k, c]) => `<button class="${c}" data-key="${esc(k)}" ${c === "eq" ? 'aria-label="Equals"' : ""}>${esc(k)}</button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><span class="tiny muted">Angles in radians · ^ is power</span><button class="btn sm ghost" id="calcCopy">${ico("copy")} Copy result</button></div>
    </div></div>
    <div class="stack">
      <div class="card"><div class="card-head"><h3>How to use it</h3></div>
        <ul class="small muted" style="padding-left:18px;line-height:1.8;margin:0">
          <li>Type directly or use the keypad; the display accepts full expressions.</li>
          <li><code>^</code> raises to a power, <code>√(</code> takes a square root.</li>
          <li><code>sin</code>, <code>cos</code>, <code>tan</code> expect radians. Convert with <code>×π/180</code> for degrees.</li>
          <li><code>log</code> is base 10; <code>ln</code> is natural log.</li>
          <li>Backspace removes the last character. <kbd>Enter</kbd> evaluates.</li>
        </ul>
      </div>
      <div class="card"><div class="card-head"><h3>History</h3></div><div id="calcHistory" class="list"></div></div>
    </div></div>`;
  const hist = Safe.get("atlas.calcHist", []);
  const paintHist = () => {
    const h = $("#calcHistory", body);
    h.innerHTML = hist.length ? hist.slice(0, 8).map(x => `<div class="list-row" style="cursor:pointer" data-hist="${esc(x.expr)}"><div class="grow"><div class="t mono" style="font-size:11.5px">${esc(x.expr)}</div><div class="s">= ${esc(x.result)}</div></div>${ico("arrowRight")}</div>`).join("") : `<p class="small muted">Evaluations appear here.</p>`;
    $$("[data-hist]", h).forEach(r => r.onclick = () => { toolsState.calcExpr = r.dataset.hist; toolsState.calcAns = ""; toolCalculator(body); });
  };
  paintHist();
  const expr = $("#calcExpr", body), out = $("#calcOut", body);
  const evaluate = () => {
    const raw = toolsState.calcExpr;
    if (!raw.trim()) return;
    try {
      const v = calcEval(raw);
      const res = Math.abs(v) > 1e12 || (Math.abs(v) < 1e-9 && v !== 0) ? v.toExponential(8) : String(Math.round(v * 1e10) / 1e10);
      toolsState.calcAns = res;
      hist.unshift({ expr: raw, result: res }); Safe.set("atlas.calcHist", hist.slice(0, 30));
      expr.textContent = raw; out.textContent = res; paintHist();
    } catch (e) { out.textContent = "Error"; out.style.color = "var(--danger)"; toast(e.message, "err", "Cannot evaluate"); setTimeout(() => out.style.color = "", 1200); }
  };
  const press = (k) => {
    if (k === "=") return evaluate();
    if (k === "C") { toolsState.calcExpr = ""; toolsState.calcAns = ""; expr.textContent = "\u00a0"; out.textContent = "0"; return; }
    if (k === "⌫") { toolsState.calcExpr = toolsState.calcExpr.slice(0, -1); expr.textContent = toolsState.calcExpr || "\u00a0"; return; }
    toolsState.calcExpr += k; expr.textContent = toolsState.calcExpr;
  };
  $$("[data-key]", body).forEach(b => b.onclick = () => press(b.dataset.key));
  document.onkeydown = null;
  const keyH = (e) => {
    if (!$("#calcExpr")) { document.removeEventListener("keydown", keyH); return; }
    if (e.target.matches("input,textarea,select")) return;
    if (/^[0-9+\-*/().^%]$/.test(e.key)) { toolsState.calcExpr += e.key; expr.textContent = toolsState.calcExpr; e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); evaluate(); }
    else if (e.key === "Backspace") { e.preventDefault(); press("⌫"); }
  };
  document.addEventListener("keydown", keyH);
  $("#calcCopy", body).onclick = () => copyText(toolsState.calcAns || "0");
  const g = $("#calcGrid", body); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}

/* ---------- graphing ---------- */
function toolGraphing(body) {
  body.innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,1fr) 280px;gap:16px" id="graphGrid">
    <div class="card" style="padding:10px">
      <canvas id="graphCanvas" style="width:100%;height:min(56vh,520px);display:block;border-radius:8px" aria-label="Function graph"></canvas>
      <div class="row wrap" style="gap:6px;margin-top:8px"><button class="btn sm" id="zoomIn">${ico("plus")} Zoom in</button><button class="btn sm" id="zoomOut">${ico("minus")} Zoom out</button><button class="btn sm" id="resetView">${ico("reset")} Reset</button><span class="tiny muted" id="graphInfo" style="margin-left:auto"></span></div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-head"><h3>Function</h3></div>
        <div class="field"><label for="fx">y =</label><input id="fx" value="sin(x)" placeholder="e.g. x^2 - 3x + 1" autocomplete="off"></div>
        <div class="row wrap" style="gap:5px">${["sin(x)", "x^2", "1/x", "e^x", "abs(x)", "log(x)", "tan(x)", "sqrt(x)"].map(f => `<button class="chip" style="cursor:pointer;border:0" data-preset="${esc(f)}">${esc(f)}</button>`).join("")}</div>
        <p class="tiny muted" style="margin-top:9px">Use <code>^</code> for powers. Supported: sin, cos, tan, asin, acos, atan, log (base 10), ln, sqrt, abs, exp. Angles in radians.</p>
      </div>
      <div class="card"><div class="card-head"><h3>Table of values</h3></div><div id="graphTable" style="max-height:240px;overflow:auto"></div></div>
    </div></div>`;
  let fn = null;
  const canvas = $("#graphCanvas", body);
  const draw = () => {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height, R = toolsState.graphRange;
    const cs = getComputedStyle(document.documentElement);
    const line = cs.getPropertyValue("--line-soft").trim() || "#eee";
    const text = cs.getPropertyValue("--muted").trim() || "#888";
    const brand = cs.getPropertyValue("--brand").trim() || "#6c5ce7";
    const bg = cs.getPropertyValue("--panel").trim() || "#fff";
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const X = x => W / 2 + (x / R) * (W / 2);
    const Y = y => H / 2 - (y / R) * (H / 2);
    const step = R <= 5 ? 1 : R <= 12 ? 2 : R <= 30 ? 5 : R <= 60 ? 10 : 20;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.font = "10px Inter, sans-serif"; ctx.fillStyle = text;
    for (let g = -Math.floor(R / step) * step; g <= R; g += step) {
      ctx.beginPath(); ctx.moveTo(X(g), 0); ctx.lineTo(X(g), H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, Y(g)); ctx.lineTo(W, Y(g)); ctx.stroke();
      if (g !== 0) { ctx.fillText(String(g), X(g) + 3, H / 2 + 12); if (Math.abs(Y(g) - H / 2) > 12) ctx.fillText(String(g), W / 2 + 5, Y(g) - 3); }
    }
    ctx.strokeStyle = text; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.stroke();
    if (!fn) return;
    ctx.strokeStyle = brand; ctx.lineWidth = 2.2; ctx.beginPath();
    let started = false;
    for (let px = 0; px <= W; px += 1) {
      const x = ((px / W) * 2 - 1) * R;
      let y; try { y = fn(x); } catch { y = NaN; }
      if (!isFinite(y)) { started = false; continue; }
      const py = Y(y);
      if (py < -H * 3 || py > H * 4) { started = false; continue; }
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // table
    const rows = [];
    for (let i = -3; i <= 3; i++) {
      const x = i * (R / 4);
      let y; try { y = fn(x); } catch { y = NaN; }
      rows.push([x.toFixed(2), isFinite(y) ? y.toFixed(4) : "undefined"]);
    }
    $("#graphTable", body).innerHTML = `<table><thead><tr><th>x</th><th>y</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td></tr>`).join("")}</tbody></table>`;
  };
  const compile = () => {
    const src = $("#fx", body).value.trim();
    if (!src) { fn = null; $("#graphInfo", body).textContent = ""; draw(); return; }
    try {
      const js = src.replace(/\^/g, "**").replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|abs|exp)\(/g, (m, f) => "Math." + f + "(").replace(/\bln\(/g, "Math.log(").replace(/\blog\(/g, "Math.log10(");
      if (!/^[0-9xX+\-*/().,\s]*(?:Math\.(?:sin|cos|tan|asin|acos|atan|sqrt|abs|exp|log10|log|PI|E))*[0-9xX+\-*/().,\s]*$/.test(js.replace(/x/gi, "x").replace(/Math\.(?:sin|cos|tan|asin|acos|atan|sqrt|abs|exp|log10|log|PI|E)/g, ""))) throw new Error("Unsupported syntax");
      fn = new Function("x", "with(Math){return " + js + "}");
      fn(1);
      $("#graphInfo", body).textContent = `domain ±${toolsState.graphRange}`;
    } catch { fn = null; $("#graphInfo", body).textContent = "Invalid function"; }
    draw();
  };
  $("#fx", body).oninput = debounce(compile, 320);
  $$("[data-preset]", body).forEach(b => b.onclick = () => { $("#fx", body).value = b.dataset.preset; compile(); });
  $("#zoomIn", body).onclick = () => { toolsState.graphRange = Math.max(1, toolsState.graphRange / 2); compile(); };
  $("#zoomOut", body).onclick = () => { toolsState.graphRange = Math.min(200, toolsState.graphRange * 2); compile(); };
  $("#resetView", body).onclick = () => { toolsState.graphRange = 10; compile(); };
  compile();
  window.addEventListener("resize", debounce(draw, 250), { once: true });
  const g = $("#graphGrid", body); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}

/* ---------- equation solver ---------- */
function toolSolver(body) {
  body.innerHTML = `<div class="grid g2" style="gap:16px">
    <div class="card">
      <div class="card-head"><h3>Linear & quadratic</h3></div>
      <div class="field"><label>Equation type</label>
        <div class="pill-tabs" id="eqType" style="width:fit-content"><button class="on" data-eq="quad">ax² + bx + c = 0</button><button data-eq="lin">ax + b = 0</button></div></div>
      <div class="input-row" id="quadFields">
        <div class="field"><label for="qa">a</label><input id="qa" type="number" value="1" step="any"></div>
        <div class="field"><label for="qb">b</label><input id="qb" type="number" value="-5" step="any"></div>
        <div class="field"><label for="qc">c</label><input id="qc" type="number" value="6" step="any"></div>
      </div>
      <div class="input-row hidden" id="linFields"><div class="field"><label for="la">a</label><input id="la" type="number" value="2" step="any"></div><div class="field"><label for="lb">b</label><input id="lb" type="number" value="-8" step="any"></div></div>
      <button class="btn primary" id="solveEq">${ico("calc")} Solve with steps</button>
      <div id="eqOut" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Simultaneous equations (2×2)</h3></div>
      <p class="small muted">a₁x + b₁y = c₁ and a₂x + b₂y = c₂</p>
      <div class="input-row"><div class="field"><label for="s1a">a₁</label><input id="s1a" type="number" value="2" step="any"></div><div class="field"><label for="s1b">b₁</label><input id="s1b" type="number" value="3" step="any"></div><div class="field"><label for="s1c">c₁</label><input id="s1c" type="number" value="12" step="any"></div></div>
      <div class="input-row"><div class="field"><label for="s2a">a₂</label><input id="s2a" type="number" value="4" step="any"></div><div class="field"><label for="s2b">b₂</label><input id="s2b" type="number" value="-1" step="any"></div><div class="field"><label for="s2c">c₂</label><input id="s2c" type="number" value="2" step="any"></div></div>
      <button class="btn primary" id="solveSys">${ico("calc")} Solve system</button>
      <div id="sysOut" style="margin-top:14px"></div>
    </div></div>`;
  let type = "quad";
  $$("[data-eq]", body).forEach(b => b.onclick = () => {
    type = b.dataset.eq; $$("[data-eq]", body).forEach(x => x.classList.toggle("on", x === b));
    $("#quadFields", body).classList.toggle("hidden", type !== "quad"); $("#linFields", body).classList.toggle("hidden", type !== "lin");
  });
  $("#solveEq", body).onclick = () => {
    const out = $("#eqOut", body);
    if (type === "lin") {
      const a = +$("#la", body).value, b = +$("#lb", body).value;
      if (a === 0) return out.innerHTML = b === 0 ? `<div class="chip warn">Infinitely many solutions</div>` : `<div class="chip danger">No solution (a = 0, b ≠ 0)</div>`;
      out.innerHTML = `<div class="card" style="background:var(--panel-2);padding:13px">
        <div class="small mono">${a}x + (${b}) = 0</div>
        <div class="small mono muted" style="margin-top:5px">${a}x = ${-b} → x = ${-b} / ${a}</div>
        <div style="font-size:22px;font-weight:700;margin-top:7px">x = ${fmtNum(-b / a)}</div>
        <div class="tiny muted" style="margin-top:4px">Check: ${a} × ${fmtNum(-b / a)} + (${b}) = ${fmtNum(a * (-b / a) + b)}</div></div>`;
      return;
    }
    const a = +$("#qa", body).value, b = +$("#qb", body).value, c = +$("#qc", body).value;
    const D_ = b * b - 4 * a * c;
    let steps = `<div class="small mono">a = ${a}, b = ${b}, c = ${c}</div>
      <div class="small mono muted" style="margin-top:6px">Discriminant Δ = b² − 4ac = ${b}² − 4(${a})(${c}) = ${fmtNum(D_)}</div>`;
    let res;
    if (a === 0) res = b === 0 ? "Not a quadratic (a = 0)" : `x = ${fmtNum(-c / b)}`;
    else if (D_ > 0) res = `x₁ = ${fmtNum((-b + Math.sqrt(D_)) / (2 * a))}<br>x₂ = ${fmtNum((-b - Math.sqrt(D_)) / (2 * a))}`;
    else if (D_ === 0) res = `x = ${fmtNum(-b / (2 * a))} (repeated root)`;
    else {
      const re = -b / (2 * a), im = Math.sqrt(-D_) / (2 * a);
      res = `x₁ = ${fmtNum(re)} + ${fmtNum(Math.abs(im))}i<br>x₂ = ${fmtNum(re)} − ${fmtNum(Math.abs(im))}i`;
    }
    out.innerHTML = `<div class="card" style="background:var(--panel-2);padding:13px">${steps}
      <div class="small mono muted" style="margin-top:6px">x = (−b ± √Δ) / 2a = (${-b} ± √${fmtNum(D_)}) / ${2 * a}</div>
      <div style="font-size:19px;font-weight:700;margin-top:9px;line-height:1.5">${res}</div>
      <div class="tiny muted" style="margin-top:5px">${D_ > 0 ? "Two distinct real roots." : D_ === 0 ? "One repeated real root — the curve touches the x-axis." : "No real roots — the parabola does not cross the x-axis."}</div></div>`;
  };
  $("#solveSys", body).onclick = () => {
    const a1 = +$("#s1a", body).value, b1 = +$("#s1b", body).value, c1 = +$("#s1c", body).value;
    const a2 = +$("#s2a", body).value, b2 = +$("#s2b", body).value, c2 = +$("#s2c", body).value;
    const det = a1 * b2 - a2 * b1; const out = $("#sysOut", body);
    if (Math.abs(det) < 1e-12) return out.innerHTML = `<div class="chip danger">No unique solution (determinant = 0)</div>`;
    const x = (c1 * b2 - c2 * b1) / det, y = (a1 * c2 - a2 * c1) / det;
    out.innerHTML = `<div class="card" style="background:var(--panel-2);padding:13px">
      <div class="small mono muted">Det = a₁b₂ − a₂b₁ = (${a1})(${b2}) − (${a2})(${b1}) = ${fmtNum(det)}</div>
      <div style="font-size:21px;font-weight:700;margin-top:8px">x = ${fmtNum(x)}<br>y = ${fmtNum(y)}</div>
      <div class="tiny muted" style="margin-top:6px">Cramer's rule. Verify by substituting back into both equations.</div></div>`;
  };
  $("#solveEq", body).click();
}

/* ---------- periodic table ---------- */
function electronConfig(z) {
  const order = [["1s", 2], ["2s", 2], ["2p", 6], ["3s", 2], ["3p", 6], ["4s", 2], ["3d", 10], ["4p", 6], ["5s", 2], ["4d", 10], ["5p", 6], ["6s", 2], ["4f", 14], ["5d", 10], ["6p", 6], ["7s", 2], ["5f", 14], ["6d", 10], ["7p", 6]];
  let left = z, out = [], shells = {};
  for (const [orb, cap] of order) { if (left <= 0) break; const n = Math.min(cap, left); out.push(orb + n); left -= n; const sh = +orb[0]; shells[sh] = (shells[sh] || 0) + n; }
  return { config: out.join(" "), shells };
}

/* ---------- chemistry ---------- */
function parseMolarMass(formula) {
  let i = 0;
  function parseGroup() {
    let total = 0;
    while (i < formula.length) {
      const c = formula[i];
      if (c === "(" || c === "[") { i++; let inner = parseGroup(); if (formula[i] === ")" || formula[i] === "]") i++; total += inner * readNumber(); }
      else if (c === ")" || c === "]") { return total; }
      else if (/[A-Z]/.test(c)) {
        let sym = c; i++;
        while (i < formula.length && /[a-z]/.test(formula[i])) { sym += formula[i]; i++; }
        const el = ELEMENTS.find(e => e.sym === sym);
        if (!el) throw new Error("Unknown element: " + sym);
        total += el.mass * readNumber();
      } else if (c === "·" || c === "*") { i++; total += parseGroup(); }
      else { i++; }
    }
    return total;
  }
  function readNumber() { let n = ""; while (i < formula.length && /\d/.test(formula[i])) { n += formula[i]; i++; } if (formula[i] === ".") { n += "."; i++; while (i < formula.length && /\d/.test(formula[i])) { n += formula[i]; i++; } } return n ? parseFloat(n) : 1; }
  const mass = parseGroup();
  return mass;
}

function toolStats(body) {
  body.innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px" id="statGrid">
    <div class="card"><div class="card-head"><h3>Descriptive statistics</h3></div>
      <div class="field"><label for="stData">Data values</label><textarea id="stData" rows="6" placeholder="Separate with spaces, commas or new lines&#10;e.g. 12, 15, 11, 18, 22">12, 15, 11, 18, 22, 19, 14, 17</textarea></div>
      <button class="btn primary" id="stGo">${ico("calc")} Analyse</button>
      <div id="stOut" style="margin-top:14px"></div>
    </div>
    <div class="card"><div class="card-head"><h3>Linear regression</h3></div>
      <div class="field"><label for="lrData">Paired data — one pair per line: x, y</label><textarea id="lrData" rows="6" placeholder="1, 2.1&#10;2, 3.9&#10;3, 6.2">1, 2.1
2, 3.9
3, 6.2
4, 8.1
5, 9.8</textarea></div>
      <button class="btn primary" id="lrGo">${ico("calc")} Fit line</button>
      <div id="lrOut" style="margin-top:14px"></div>
    </div>
    <div class="card" style="grid-column:1/-1"><div class="card-head"><h3>Distribution visual</h3></div><div id="stChart"></div></div>
  </div>`;
  $("#stGo", body).onclick = () => {
    const raw = $("#stData", body).value.split(/[\s,;]+/).map(Number).filter(n => !isNaN(n) && $("#stData", body).value.trim() !== "");
    if (raw.length < 2) return $("#stOut", body).innerHTML = `<div class="chip warn">Enter at least two numbers</div>`;
    const v = [...raw].sort((a, b) => a - b), n = v.length;
    const mean = sum(v) / n;
    const median = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
    const counts = {}; v.forEach(x => counts[x] = (counts[x] || 0) + 1);
    const mode = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    const popVar = sum(v.map(x => (x - mean) ** 2)) / n;
    const sampVar = sum(v.map(x => (x - mean) ** 2)) / (n - 1);
    const q = (p) => { const pos = (n - 1) * p, lo = Math.floor(pos), hi = Math.ceil(pos); return v[lo] + (v[hi] - v[lo]) * (pos - lo); };
    const q1 = q(.25), q3 = q(.75), iqr = q3 - q1;
    const outliers = v.filter(x => x < q1 - 1.5 * iqr || x > q3 + 1.5 * iqr);
    const rows = [["Count (n)", n], ["Mean", mean.toFixed(4)], ["Median", median], ["Mode", `${mode[0]} (×${mode[1]})`], ["Minimum", v[0]], ["Maximum", v[n - 1]], ["Range", (v[n - 1] - v[0]).toFixed(4)], ["Sample variance (s²)", sampVar.toFixed(4)], ["Population variance (σ²)", popVar.toFixed(4)], ["Sample SD (s)", Math.sqrt(sampVar).toFixed(4)], ["Population SD (σ)", Math.sqrt(popVar).toFixed(4)], ["Q1", q1.toFixed(4)], ["Q3", q3.toFixed(4)], ["IQR", iqr.toFixed(4)], ["Outliers (1.5×IQR)", outliers.length ? outliers.join(", ") : "None"]];
    $("#stOut", body).innerHTML = `<table><tbody>${rows.map(([k, val]) => `<tr><td class="muted">${k}</td><td class="right mono">${val}</td></tr>`).join("")}</tbody></table>`;
    const bins = 8, min = v[0], max = v[n - 1], w = (max - min) / bins || 1;
    const hist = [...Array(bins)].map((_, i) => ({ k: (min + i * w).toFixed(1), v: v.filter(x => x >= min + i * w && (i === bins - 1 ? x <= max : x < min + (i + 1) * w)).length }));
    $("#stChart", body).innerHTML = barChart(hist, { h: 170 }) + `<div class="tiny muted center" style="margin-top:6px">Histogram · bin width ${w.toFixed(2)}</div>`;
  };
  $("#lrGo", body).onclick = () => {
    const pairs = $("#lrData", body).value.trim().split(/\n/).map(l => l.split(/[\s,;]+/).map(Number)).filter(p => p.length >= 2 && p.every(x => !isNaN(x)));
    if (pairs.length < 2) return $("#lrOut", body).innerHTML = `<div class="chip warn">Enter at least two x,y pairs</div>`;
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
    const num = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))), den = sum(xs.map(x => (x - mx) ** 2));
    const m = den ? num / den : 0, b = my - m * mx;
    const sst = sum(ys.map(y => (y - my) ** 2)), sse = sum(ys.map((y, i) => (y - (m * xs[i] + b)) ** 2));
    const r2 = sst ? 1 - sse / sst : 0, r = Math.sign(m) * Math.sqrt(Math.max(0, r2));
    $("#lrOut", body).innerHTML = `<div class="card" style="background:var(--panel-2);padding:12px"><div class="tiny muted">Regression line</div><div class="mono" style="font-size:18px;font-weight:650">y = ${m.toFixed(4)}x ${b >= 0 ? "+" : "−"} ${Math.abs(b).toFixed(4)}</div>
      <div class="row wrap" style="gap:5px;margin-top:7px"><span class="chip">r = ${r.toFixed(4)}</span><span class="chip">r² = ${r2.toFixed(4)}</span><span class="chip">n = ${pairs.length}</span></div>
      <div class="tiny muted" style="margin-top:6px">Correlation is not causation. r² = ${(r2 * 100).toFixed(1)}% of variance in y is explained by x.</div></div>
      ${lineChart(ys.map((y, i) => y), { h: 120 })}`;
  };
  $("#stGo", body).click(); $("#lrGo", body).click();
  const g = $("#statGrid", body); if (g && window.innerWidth < 900) g.style.gridTemplateColumns = "1fr";
}

function langReading(body) {

function langWriting(body) {
  body.innerHTML = `<div class="grid g2" style="gap:14px">
    <div class="card"><div class="card-head"><h3>Writing practice</h3></div>
      <div class="field"><label for="wLang">Language</label><select id="wLang">${Object.keys(GRAMMAR_LESSONS).map(l => `<option ${l === langState.lang ? "selected" : ""}>${l}</option>`).join("")}</select></div>

    const out = $("#wOut", body); out.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
    try {
      const res = await AI.chat([{ role: "user", content: `Language: ${$("#wLang", body).value}\nTask: ${$("#wPrompt", body).value}\nStudent response:\n${text}\n\nGive feedback in English: (1) corrected version in the target language, (2) the 4 most important grammar/vocabulary corrections with explanations, (3) one thing done well, (4) one next step. Be precise and do not invent rules.` }], { system: "You are a meticulous language teacher. Correct only what is wrong; explain each correction. If unsure about a usage, say so.", max_tokens: 1500 });
      out.innerHTML = `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(res)}</div></div></div>`;
    } catch (e) { out.innerHTML = `<div class="card" style="border-color:var(--danger)"><b class="small">Request failed</b><p class="small muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
  };
  $("#wSelf", body).onclick = () => {
    $("#wOut", body).innerHTML = `<div class="stack" style="gap:8px">${[
      "Does every sentence have a conjugated verb that agrees with its subject?",
      "Do articles and adjectives agree with noun gender and number?",
      "Did you use at least two tenses or time expressions correctly?",
      "Is there a clear opening, middle and closing?",
      "Did you check accents and spelling against a dictionary?",
      "Read it aloud — does the rhythm sound natural?"
    ].map(q => `<label class="check"><input type="checkbox"><span>${q}</span></label>`).join("")}<p class="tiny muted" style="margin:0">This checklist is Atlas guidance, not automated correction. For corrections, connect an AI provider.</p></div>`;
  };
}
function langTranslate(body) {
  body.innerHTML = `<div class="card" style="max-width:760px;margin:0 auto">
    <div class="card-head"><h3>Translation assistance</h3>${AI.ready() ? aiBadge : `<span class="chip warn">AI not configured</span>`}</div>
    <div class="row" style="gap:8px;margin-bottom:10px"><select id="trFrom" style="flex:1">${["English", "Spanish", "French", "German", "Italian", "Portuguese"].map(l => `<option>${l}</option>`).join("")}</select>
      <button class="icon-btn" id="trSwap" aria-label="Swap languages">${ico("reset")}</button>
      <select id="trTo" style="flex:1">${["Spanish", "English", "French", "German", "Italian", "Portuguese"].map(l => `<option ${l === "Spanish" ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><textarea id="trText" rows="5" placeholder="Type or paste text to translate…"></textarea></div>
    <div class="row" style="gap:6px"><button class="btn primary" id="trGo" ${AI.ready() ? "" : "disabled"}>${ico("send")} Translate</button><button class="btn ghost" id="trClear">Clear</button></div>
    <div id="trOut" style="margin-top:14px"></div>
    ${AI.ready() ? "" : `<p class="small muted" style="margin-top:10px">Atlas contains no bundled translation engine and does not fake one. Add an OpenRouter key in Settings → AI to enable real translation.</p>`}
  </div>`;
  $("#trSwap", body).onclick = () => { const a = $("#trFrom", body).value; $("#trFrom", body).value = $("#trTo", body).value; $("#trTo", body).value = a; };
  $("#trClear", body).onclick = () => { $("#trText", body).value = ""; $("#trOut", body).innerHTML = ""; };
  $("#trGo", body).onclick = async () => {
    if (!aiGuard()) return;
    const t = $("#trText", body).value.trim(); if (!t) return;
    const out = $("#trOut", body); out.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
    try {
      const res = await AI.chat([{ role: "user", content: `Translate the following from ${$("#trFrom", body).value} to ${$("#trTo", body).value}. Provide the translation, then 2–4 notes on idioms, register or grammar that a learner should notice. If something cannot be translated cleanly, explain why.\n\n${t}` }], { system: "You are an accurate translator and language teacher. Do not add information not present in the source.", max_tokens: 1200 });
      out.innerHTML = `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(res)}</div></div></div>`;
    } catch (e) { out.innerHTML = `<div class="card" style="border-color:var(--danger)"><b class="small">Request failed</b><p class="small muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
  };
}
page("languages", { title: "Language centre" }, renderLanguages);

<script>

function setProfile(body) {

    <div class="divider"></div>
    <div class="grid g2" style="gap:12px">
      <div><div class="label" style="margin-bottom:5px">What AI is used for</div><ul class="small muted" style="margin:0;padding-left:17px;line-height:1.75"><li>Tutoring conversations and step-by-step explanations</li><li>Note summaries and flashcard generation</li><li>Essay outlines, writing feedback, maths explanations</li><li>Source synthesis, reading/writing practice, translation</li></ul></div>
      <div><div class="label" style="margin-bottom:5px">What stays deterministic</div><ul class="small muted" style="margin:0;padding-left:17px;line-height:1.75"><li>Spaced-repetition scheduling</li><li>Exam grading and topic analysis</li><li>Unit conversion, calculators, statistics</li><li>Citation formatting from your metadata</li></ul></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Privacy</h3></div>
    <p class="small muted" style="margin:0">When you send a message, the conversation history (last 14 messages) and a tutoring system prompt are transmitted to OpenRouter and the model provider you select. Notes, documents and flashcards are only sent when you explicitly invoke an AI action on them. Nothing is used to train a model by Atlas, and Atlas has no server-side copy.</p>
  </div>`;
  $("#aiEye", body).onclick = () => { const k = $("#aiKey", body); k.type = k.type === "password" ? "text" : "password"; };
  $("#aiSave", body).onclick = () => {
    const key = $("#aiKey", body).value.trim();
    AI.save({ key, model: $("#aiModel", body).value });
    saveDB(true); toast(key ? "AI connection saved" : "AI key removed", key ? "ok" : "warn"); renderRoute();
  };
  $("#aiTest", body).onclick = async () => {
    const out = $("#aiTestOut", body); out.textContent = "Testing…";
    AI.save({ key: $("#aiKey", body).value.trim(), model: $("#aiModel", body).value });
    try { const r = await AI.test(); out.innerHTML = `<span style="color:var(--ok)">Connected: “${esc(r.slice(0, 40))}”</span>`; toast("AI connection works", "ok"); }
    catch (e) { out.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`; toast(e.message, "err", "Connection failed"); }
  };
  $("#aiClear", body).onclick = () => confirmDialog("Remove the AI key?", "AI features will be disabled until you add a key again. Your notes and data are unaffected.", () => {
    AI.save({ key: "" }); toast("AI key removed", "warn"); renderRoute();
  }, "Remove key");
}
function setData(body) {
  let used = 0; try { for (const k in localStorage) if (k.startsWith("atlas.")) used += (localStorage[k] || "").length; } catch {}
  body.innerHTML = `<div class="card">
    <div class="card-head"><h3>Backup & restore</h3></div>
    <p class="small muted">Your workspace lives in this browser. Export a JSON backup before clearing site data or switching devices.</p>
    <div class="row wrap" style="gap:7px;margin-top:10px"><button class="btn primary" id="expAll">${ico("download")} Export everything</button>
      <label class="btn" style="margin:0">${ico("upload")} Import backup<input type="file" id="impFile" accept="application/json,.json" class="hidden"></label>
      <button class="btn ghost" id="expNotes">${ico("note")} Export notes as Markdown</button></div>
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between"><span class="small muted">Estimated local storage used</span><b>${bytes(used)}</b></div>
    <div class="tiny muted" style="margin-top:4px">Browsers typically allow about 5 MB. Large embedded PDFs consume space fastest.</div>
  </div>
  <div class="card" style="margin-top:16px;border-color:rgba(220,38,38,.25)">
    <div class="card-head"><h3 style="color:var(--danger)">Danger zone</h3></div>
    <div class="row wrap" style="justify-content:space-between;gap:10px;padding:9px 0"><div><b class="small">Reset workspace data</b><div class="tiny muted">Delete notes, cards, exams, tasks and progress. Keep the account and sign-in.</div></div><button class="btn danger sm" id="resetData">Reset data</button></div>
    <div class="row wrap" style="justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)"><div><b class="small">Delete account</b><div class="tiny muted">Remove the account and all associated data from this browser. This cannot be undone.</div></div><button class="btn danger sm" id="delAccount">Delete account</button></div>
  </div>`;
  $("#expAll", body).onclick = () => {
    const payload = { app: "Atlas", exportedAt: new Date().toISOString(), version: DB_VER, profile: { name: CURRENT_USER.name, email: CURRENT_USER.email, level: CURRENT_USER.level }, data: D };
    download("atlas-backup-" + D2.iso() + ".json", JSON.stringify(payload, null, 2));
    toast("Backup downloaded");
  };
  $("#expNotes", body).onclick = () => {
    if (!D.notes.length) return toast("No notes to export.", "warn");
    const mdText = D.notes.map(n => `# ${n.title}\n_${subj(n.subject).name} · ${D2.fmt(n.updated)}_\n\n${(n.html || "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n\n").replace(/<[^>]+>/g, "")}\n`).join("\n---\n\n");
    download("atlas-notes.md", mdText, "text/markdown"); toast("Notes exported as Markdown");
  };
  $("#impFile", body).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const payload = JSON.parse(await f.text());
      if (!payload.data || payload.app !== "Atlas") throw new Error("This is not an Atlas backup file.");
      const size = f.size;
      confirmDialog("Import this backup?", `It will replace your current workspace (${bytes(JSON.stringify(D).length)}) with the backup (${bytes(size)}). This cannot be undone.`, () => {
        D = { ...blankDB(), ...payload.data, prefs: { ...blankDB().prefs, ...(payload.data.prefs || {}) } };
        saveDB(); toast("Backup imported"); renderShell(); renderRoute();
      }, "Replace and import");
    } catch (err) { toast(err.message, "err", "Import failed"); }
  };
  $("#resetData", body).onclick = () => confirmDialog("Reset workspace data?", "All notes, cards, exams, tasks, sessions and settings will be deleted. Your account remains.", () => {
    D = blankDB(); D.profile = { name: CURRENT_USER.name, level: CURRENT_USER.level }; saveDB(); toast("Workspace reset"); renderShell(); renderRoute();
  }, "Reset everything");
  $("#delAccount", body).onclick = () => confirmDialog("Delete your account?", "Your account and every piece of data stored in this browser will be erased. This cannot be undone.", () => {
    const users = Auth.users().filter(u => u.id !== CURRENT_USER.id);
    Safe.set(LS.users, users); Safe.del(dbKey(CURRENT_USER.id)); Safe.del(LS.session); CURRENT_USER = null; D = null; history.replaceState(null, "", location.pathname + location.search); renderAuth("register"); toast("Account deleted");
  }, "Delete account");
}
function setSecurity(body) {
  body.innerHTML = `<div class="card">
    <div class="card-head"><h3>Password</h3></div>
    <p class="small muted">Passwords are hashed with PBKDF2-SHA256 (160,000 iterations) and a unique random salt, then stored locally. Atlas cannot recover your password.</p>
    <div class="field"><label for="scOld">Current password</label><input id="scOld" type="password" autocomplete="current-password"></div>
    <div class="input-row"><div class="field"><label for="scNew">New password</label><input id="scNew" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="scNew2">Confirm new password</label><input id="scNew2" type="password" autocomplete="new-password"></div></div>
    <button class="btn primary" id="scSave">${ico("shield")} Update password</button>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Session</h3></div>
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b class="small">Signed in as</b><div class="tiny muted">${esc(CURRENT_USER.email)}</div></div><button class="btn danger" id="scLogout">${ico("logout")} Sign out</button></div>
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between"><span class="small muted">Session token</span><span class="tiny mono">${esc((Auth.session()?.token || "").slice(0, 12))}…</span></div>
    <div class="row" style="justify-content:space-between;margin-top:4px"><span class="small muted">Started</span><span class="tiny">${esc(D2.fmt((Auth.session()?.at ? new Date(Auth.session().at).toISOString() : "").slice(0, 10)))}</span></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>How Atlas handles accounts</h3></div>
    <p class="small muted" style="margin:0">This is a local-first application: the account exists only in this browser. Signing in on another device requires exporting a backup and importing it there. There is no email verification server and no password reset email — the trade-off that keeps the app free of a backend and your data out of a database.</p>
  </div>
  <div class="card" style="margin-top:16px;text-align:center"><div class="brand" style="justify-content:center;padding:6px 0 4px"><div class="brand-mark">A</div><div style="text-align:left"><div class="brand-name">Atlas</div><div class="brand-sub">Academic OS · v1.0</div></div></div>
    <p class="tiny muted" style="margin:6px 0 0">Built as a complete, self-contained academic workspace.<br>Your data stays yours.</p></div>`;
  $("#scSave", body).onclick = async () => {
    const oldPw = $("#scOld", body).value, nw = $("#scNew", body).value, nw2 = $("#scNew2", body).value;
    if (nw !== nw2) return toast("New passwords do not match.", "warn");
    try { await Auth.changePassword(oldPw, nw); toast("Password updated"); $("#scOld", body).value = $("#scNew", body).value = $("#scNew2", body).value = ""; }
    catch (e) { toast(e.message, "err"); }
  };
  $("#scLogout", body).onclick = () => Auth.logout();
}
page("settings", { title: "Settings" }, renderSettings);
</script>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
