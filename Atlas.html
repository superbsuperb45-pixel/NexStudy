        <div class="label" style="margin-bottom:9px">Question navigator</div>
        <div class="exam-progress-grid">${A.questions.map((qq, i) => `<button data-jump="${i}" class="${A.answers[qq.id] !== undefined && A.answers[qq.id] !== "" ? "done" : ""} ${qq.flagged ? "flagged" : ""}" aria-label="Go to question ${i + 1}${qq.flagged ? " (flagged)" : ""}" title="${qq.flagged ? "Flagged for review" : ""}">${i + 1}</button>`).join("")}</div>
        <p class="tiny muted" style="margin:9px 0 0">Questions may be answered in any order. Short answers are self-marked after submission against a model answer.</p>
      </div>
    </div>`;

  // input binding
  bindAnswer(root, A, q);
  $("#prevQ", root).onclick = () => { A.index--; renderTakeExam(root, attId); };
  $("#nextQ", root) && ($("#nextQ", root).onclick = () => { A.index++; renderTakeExam(root, attId); });
  $$("[data-jump]", root).forEach(b => b.onclick = () => { A.index = +b.dataset.jump; renderTakeExam(root, attId); });
  $("#submitExam", root).onclick = () => submitExam();
  const s2 = $("#submitExam2", root); if (s2) s2.onclick = () => submitExam();
  $("#flagQ", root).onclick = () => { q.flagged = !q.flagged; toast(q.flagged ? "Question flagged for review" : "Flag removed"); renderTakeExam(root, attId); };

  if (examSession.timer) clearInterval(examSession.timer);
  const tick = () => {
    const left = Math.max(0, Math.round((A.endsAt - Date.now()) / 1000));
    const el = $("#examTimer"); if (!el) { clearInterval(examSession.timer); return; }
    el.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 60);
    if (left <= 0) { clearInterval(examSession.timer); examSession.timer = null; toast("Time is up — submitting your paper.", "warn"); submitExam(true); }
  };
  tick(); examSession.timer = setInterval(tick, 1000);
  window.__clearTimers = () => { if (examSession.timer) clearInterval(examSession.timer); examSession.timer = null; };
}
function questionInput(q, val) {
  if (q.type === "mcq" || q.type === "tf") {
    const options = q.type === "tf" ? ["True", "False"] : q.options;
    return `<div role="radiogroup">${options.map((o, i) => `<label class="opt ${val === i ? "sel" : ""}"><input type="radio" name="opt" value="${i}" ${val === i ? "checked" : ""} data-answer="${q.id}"><span>${q.type === "mcq" ? String.fromCharCode(65 + i) + ". " : ""}${esc(o)}</span></label>`).join("")}</div>`;
  }
  return `<div class="field"><label class="sr-only" for="shortAns">Your answer</label><textarea id="shortAns" rows="5" placeholder="Write your answer — show working or structure where relevant." data-answer="${q.id}">${esc(val || "")}</textarea></div>`;
}
function bindAnswer(root, A, q) {
  $$("[data-answer]", root).forEach(inp => {
    if (inp.type === "radio") inp.onchange = () => { A.answers[q.id] = +inp.value; $$(".opt", root).forEach(o => o.classList.toggle("sel", o.querySelector("input").checked)); updateAnswered(root, A); };
    else inp.oninput = debounce(() => { A.answers[q.id] = inp.value; updateAnswered(root, A); }, 250);
  });
}
function updateAnswered(root, A) {
  const n = Object.values(A.answers).filter(v => v !== "" && v !== undefined).length;
  const bar = $(".progress i", root); if (bar) bar.style.width = (n / A.questions.length) * 100 + "%";
  const c = $("#qCounter", root);
  const txt = $(`[data-jump="${A.index}"]`, root); if (txt) txt.classList.add("done");
  const lab = $$(".card .row .tiny.muted", root)[0]; if (lab) lab.textContent = `${n} answered`;
}
function submitExam(auto) {
  const A = examSession.active; if (!A) return go("exams");
  const answeredCount = Object.values(A.answers).filter(v => v !== "" && v !== undefined).length;
  const finish = () => {
    if (examSession.timer) { clearInterval(examSession.timer); examSession.timer = null; }
    let correct = 0, objective = 0; const byTopic = {}; const review = [];
    A.questions.forEach(q => {
      const ua = A.answers[q.id];
      const isObj = q.type !== "short";
      const isCorrect = isObj && typeof ua === "number" && ua === q.answer;
      if (isObj) { objective++; if (isCorrect) correct++; }
      (byTopic[q.topic] = byTopic[q.topic] || []).push(isObj ? (isCorrect ? 100 : 0) : null);
      review.push({ q, ua, correct: isObj ? isCorrect : null, selfGrade: null });
    });
    const objTopics = {};
    Object.entries(byTopic).forEach(([k, v]) => { const vals = v.filter(x => x !== null); if (vals.length) objTopics[k] = Math.round(avg(vals)); });
    const score = objective ? Math.round((correct / objective) * 100) : 0;
    const att = {
      id: uid("at"), examId: A.examId, examTitle: A.examTitle, subject: A.subject,
      startedAt: A.startedAt, finishedAt: new Date().toISOString(),
      minutes: Math.round((Date.now() - new Date(A.startedAt).getTime()) / 60000),
      questions: A.questions, answers: A.answers, review, selfGrades: {},
      score, total: 100, correct, count: A.questions.length, objective, byTopic: objTopics
    };
    D.attempts.unshift(att);
    recordStudy(att.minutes, A.subject, "exam");
    logActivity(`Completed “${A.examTitle}” — ${score}%`, "exam", "exams");
    saveDB(); examSession.active = null; delete window.__clearTimers;
    go("exams", { result: att.id });
  };
  if (auto) return finish();
  const unans = A.questions.length - answeredCount;
  modal({
    title: "Submit this paper?", icon: "check", body: `<p>You have answered <b>${answeredCount} of ${A.questions.length}</b> questions.${unans ? ` ${unans} remain blank and will be marked incorrect (objective) or unmarked (short answer).` : ""}</p><p class="small muted">You cannot reopen this attempt after submitting.</p>`,
    footer: `<button class="btn" data-close>Keep working</button><button class="btn primary" id="cfmSubmit">Submit exam</button>`,
    onMount: (m) => $("#cfmSubmit", m).onclick = () => { closeModal(); finish(); }
  });
}

function renderResult(root, attId) {
  const att = D.attempts.find(a => a.id === attId);
  if (!att) { root.innerHTML = `<div class="card">${emptyState("alert", "Attempt not found", "This result is no longer available.", `<button class="btn" data-go="exams">Back to exams</button>`)}</div>`; return; }
  const shortQs = att.review.filter(r => r.q.type === "short");
  const selfDone = shortQs.filter(r => att.selfGrades?.[r.q.id] !== undefined).length;
  const selfScore = shortQs.length ? Math.round((shortQs.filter(r => att.selfGrades?.[r.q.id]).length / shortQs.length) * 100) : null;
  const objScore = att.objective ? Math.round((att.correct / att.objective) * 100) : null;
  const shown = shortQs.length && selfDone === shortQs.length ? Math.round(((att.correct + shortQs.filter(r => att.selfGrades?.[r.q.id]).length) / att.count) * 100) : att.score;
  const topicRows = Object.entries(att.byTopic || {}).sort((a, b) => a[1] - b[1]);

  root.innerHTML = `
    <div class="exam-shell">
      <div class="row" style="margin-bottom:12px"><button class="btn sm ghost" data-go="exams">${ico("arrowLeft")} All exams</button></div>
      <div class="card" style="margin-bottom:14px">
        <div class="row" style="flex-wrap:wrap;gap:20px">
          ${donutChart([{ v: shown, c: shown >= 80 ? "var(--ok)" : shown >= 60 ? "var(--warn)" : "var(--danger)" }, { v: Math.max(0, 100 - shown), c: "var(--panel-3)" }], { size: 110, thickness: 11, center: `<div><b style="font-size:22px">${shown}%</b><div class="tiny muted">score</div></div>` })}
          <div style="flex:1;min-width:200px">
            <div class="eyebrow">Result</div>
            <h1 style="font-size:24px;margin:3px 0 5px">${esc(att.examTitle)}</h1>
            <div class="row wrap" style="gap:6px"><span class="chip">${esc(subj(att.subject).name)}</span><span class="chip">${att.correct}/${att.count} correct</span><span class="chip">${att.minutes} min</span><span class="chip">${esc(D2.fmt((att.finishedAt || "").slice(0, 10)))}</span></div>
            <p class="small muted" style="margin:10px 0 0">${shown >= 80 ? "Strong performance. Keep the schedule, but re-test this topic in a week so it sticks." : shown >= 60 ? "Solid base with clear gaps. Work the weakest topics below before re-testing." : "This topic needs rebuilding from the concept level, not more question drilling."}</p>
          </div>
          <div class="stack" style="gap:6px">
            <button class="btn primary" id="retake">${ico("reset")} Retake</button>
            <button class="btn" data-go="exams">New exam</button>
          </div>
        </div>
        ${shortQs.length ? `<div class="divider"></div><div class="row wrap" style="gap:10px"><div style="flex:1;min-width:220px"><b style="font-size:12.5px">Self-mark short answers</b><div class="tiny muted">${selfDone}/${shortQs.length} reviewed. Your marks update the total.</div></div>${objScore !== null ? `<span class="chip">Objective: ${objScore}%</span>` : ""}</div>` : ""}
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3>Question review</h3><span class="tiny muted">Every answer with its explanation</span></div>
        <div class="stack">${att.review.map((r, i) => {
          const isShort = r.q.type === "short";
          const userTxt = isShort ? (r.ua || "—") : (r.ua !== undefined ? (r.q.options || ["True", "False"])[r.ua] : "No answer");
          const rightTxt = isShort ? (r.q.model || r.q.explanation) : (r.q.options || ["True", "False"])[r.q.answer];
          const state = isShort ? (att.selfGrades?.[r.q.id] === true ? "correct" : att.selfGrades?.[r.q.id] === false ? "wrong" : "") : r.correct ? "correct" : "wrong";
          return `<div class="q-card" style="margin:0;padding:14px">
            <div class="row" style="align-items:flex-start;gap:9px"><span class="chip ${state === "correct" ? "ok" : state === "wrong" ? "danger" : ""}">${i + 1}</span><div style="flex:1"><div style="font-weight:600;font-size:13.5px;margin-bottom:5px">${esc(r.q.text)}</div>
            <div class="small" style="color:${state === "correct" ? "var(--ok)" : state === "wrong" ? "var(--danger)" : "var(--muted)"}">Your answer: ${esc(userTxt)}</div>
            ${state !== "correct" ? `<div class="small" style="color:var(--ok);margin-top:2px">Correct: ${esc(rightTxt)}</div>` : ""}
            ${r.q.explanation ? `<div class="tiny muted" style="margin-top:5px;line-height:1.6">${esc(r.q.explanation)}</div>` : ""}
            ${isShort ? `<div class="row" style="gap:5px;margin-top:8px"><button class="btn sm ${att.selfGrades?.[r.q.id] === true ? "primary" : ""}" data-self="1" data-qid="${r.q.id}">${ico("check")} I got this</button><button class="btn sm ${att.selfGrades?.[r.q.id] === false ? "danger" : ""}" data-self="0" data-qid="${r.q.id}">${ico("x")} Missed it</button></div>` : ""}
            </div></div></div>`;
        }).join("")}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>What to do next</h3>${aiBadge}</div>
        <div class="grid g3" style="gap:10px">
          ${topicRows.slice(0, 3).map(([t, v]) => `<div class="card" style="padding:12px;background:var(--panel-2)"><div class="small" style="font-weight:650">${esc(t)}</div><div class="tiny muted" style="margin:2px 0 8px">${v}% on this paper</div><button class="btn sm block" data-practise="${esc(t)}">${ico("target")} 10 questions</button></div>`).join("") || `<p class="small muted">No topic breakdown available.</p>`}
        </div>
        <div class="divider"></div>
        <div class="row wrap" style="gap:6px"><button class="btn sm soft" data-go="tutor">${ico("sparkle")} Ask the tutor about weak topics</button><button class="btn sm" data-go="notes">${ico("note")} Review your notes</button><button class="btn sm" data-go="flashcards">${ico("cards")} Drill flashcards</button></div>
      </div>
    </div>`;

  $("#retake", root).onclick = () => {
    const e = D.exams.find(x => x.id === att.examId);
    if (e) startExam(e.id); else startCustom(att.questions, att.examTitle, att.subject, 30);
  };
  $$("[data-self]", root).forEach(b => b.onclick = () => {
    att.selfGrades = att.selfGrades || {};
    att.selfGrades[b.dataset.qid] = b.dataset.self === "1";
    const short = att.review.filter(r => r.q.type === "short");
    const got = short.filter(r => att.selfGrades[r.q.id]).length;
    att.score = Math.round(((att.correct + got) / att.count) * 100);
    saveDB(); renderResult(root, attId);
  });
  $$("[data-practise]", root).forEach(b => b.onclick = () => {
    const qs = QUESTION_BANK.filter(q => q.topic === b.dataset.practise);
    if (qs.length) startCustom(shuffle(qs).slice(0, 10), "Practice — " + b.dataset.practise, qs[0].subject, 15);
    else toast("No bank questions for that topic yet.", "warn");
  });
}
page("exams", { title: "Examinations" }, renderExams);
</script>
<script>
/* ============================ ASSIGNMENTS ============================ */
const asgFilter = { status: "all", subject: "all", sort: "due" };

function renderAssignments(root, { params }) {
  let items = [...D.assignments];
  if (asgFilter.status !== "all") items = items.filter(a => a.status === asgFilter.status);
  if (asgFilter.subject !== "all") items = items.filter(a => a.subject === asgFilter.subject);
  items.sort((a, b) => {
    if (asgFilter.sort === "priority") { const w = { high: 0, med: 1, low: 2 }; return (w[a.priority] ?? 1) - (w[b.priority] ?? 1) || (a.due || "9999").localeCompare(b.due || "9999"); }
    if (asgFilter.sort === "progress") return (b.progress || 0) - (a.progress || 0);
    return (a.due || "9999").localeCompare(b.due || "9999");
  });
  const open = D.assignments.filter(a => a.status !== "submitted" && a.status !== "graded");
  const overdue = open.filter(a => a.due && D2.days(a.due) < 0);
  const dueWeek = open.filter(a => a.due && D2.days(a.due) >= 0 && D2.days(a.due) <= 7);
  const citations = D.sources;

  root.innerHTML = `
    ${pageHead({ eyebrow: "Study", title: "Assignments", desc: "Every piece of work, its real deadline and how far along it actually is.", actions: `<button class="btn" id="writingTools">${ico("pencil")} Writing tools</button><button class="btn primary" id="addAsg">${ico("plus")} New assignment</button>` })}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">${ico("task")} Open work</div><div class="v">${open.length}</div><div class="d">${D.assignments.filter(a => a.status === "submitted" || a.status === "graded").length} completed</div></div>
      <div class="stat"><div class="k">${ico("alert")} Overdue</div><div class="v" style="color:${overdue.length ? "var(--danger)" : "inherit"}">${overdue.length}</div><div class="d">${overdue.length ? "Address these first" : "Nothing overdue"}</div></div>
      <div class="stat"><div class="k">${ico("calendar")} Due this week</div><div class="v">${dueWeek.length}</div><div class="d">Next 7 days</div></div>
      <div class="stat"><div class="k">${ico("quote")} Saved sources</div><div class="v">${citations.length}</div><div class="d"><button class="btn sm ghost" id="openCites" style="padding:0;height:auto;border:0;background:transparent;color:var(--brand-2)">Open citation library</button></div></div>
    </div>
    <div class="row wrap" style="gap:8px;margin-bottom:14px">
      <div class="pill-tabs">${[["all", "All"], ["todo", "To do"], ["in-progress", "In progress"], ["submitted", "Submitted"], ["graded", "Graded"]].map(([k, l]) => `<button class="${asgFilter.status === k ? "on" : ""}" data-fstatus="${k}">${l}</button>`).join("")}</div>
      <span class="spacer"></span>
      <select id="fSubject" style="width:auto;font-size:12px;padding:5px 24px 5px 9px">${["all", ...SUBJECTS.map(s => s.id)].map(v => `<option value="${v}" ${asgFilter.subject === v ? "selected" : ""}>${v === "all" ? "All subjects" : esc(subj(v).name)}</option>`).join("")}</select>
      <select id="fSort" style="width:auto;font-size:12px;padding:5px 24px 5px 9px">${[["due", "Sort: deadline"], ["priority", "Sort: priority"], ["progress", "Sort: progress"]].map(([v, l]) => `<option value="${v}" ${asgFilter.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    </div>
    ${items.length ? `<div class="stack">${items.map(a => assignmentCard(a)).join("")}</div>` : `<div class="card">${emptyState("task", "No assignments here", "Add a piece of work with its deadline and Atlas will track it across your dashboard, planner and analytics.", `<button class="btn primary" id="addAsg2">${ico("plus")} Add assignment</button>`)}</div>`}`;

  $("#addAsg", root).onclick = () => assignmentModal();
  const a2 = $("#addAsg2", root); if (a2) a2.onclick = () => assignmentModal();
  $("#writingTools", root).onclick = writingToolsModal;
  $("#openCites", root).onclick = citationLibraryModal;
  $$("[data-fstatus]", root).forEach(b => b.onclick = () => { asgFilter.status = b.dataset.fstatus; renderRoute(); });
  $("#fSubject", root).onchange = (e) => { asgFilter.subject = e.target.value; renderRoute(); };
  $("#fSort", root).onchange = (e) => { asgFilter.sort = e.target.value; renderRoute(); };
  bindAssignmentCards(root);
}

function assignmentCard(a) {
  const days = a.due ? D2.days(a.due) : null;
  const st = { todo: ["To do", ""], "in-progress": ["In progress", "warn"], submitted: ["Submitted", "info"], graded: ["Graded", "ok"] }[a.status] || ["To do", ""];
  const late = days !== null && days < 0 && a.status !== "submitted" && a.status !== "graded";
  return `<div class="card hoverable" style="padding:14px" data-card="${a.id}">
    <div class="row wrap" style="align-items:flex-start;gap:11px">
      <div class="tile" style="background:${subj(a.subject).color}1c;color:${subj(a.subject).color}">${ico(subj(a.subject).icon)}</div>
      <div style="flex:1;min-width:180px">
        <div class="row wrap" style="gap:7px"><span style="font-weight:650;font-size:14px">${esc(a.title)}</span>
          <span class="chip ${a.priority === "high" ? "danger" : a.priority === "med" ? "warn" : ""}">${a.priority === "high" ? "High" : a.priority === "med" ? "Medium" : "Low"} priority</span>
          <span class="chip ${st[1]}">${st[0]}</span>
          ${late ? `<span class="chip danger">Overdue</span>` : ""}</div>
        <div class="small muted" style="margin-top:3px">${esc(subj(a.subject).name)} · ${a.due ? esc(D2.fmt(a.due)) + " · " + esc(D2.rel(a.due)) : "No deadline"}${a.grade ? " · Grade: " + esc(a.grade) : ""}</div>
      </div>
      <div class="row" style="gap:5px">
        <select data-status="${a.id}" style="width:auto;font-size:11.5px;padding:4px 22px 4px 7px" aria-label="Status">
          ${[["todo", "To do"], ["in-progress", "In progress"], ["submitted", "Submitted"], ["graded", "Graded"]].map(([v, l]) => `<option value="${v}" ${a.status === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button class="icon-btn" data-edit-asg="${a.id}" aria-label="Edit assignment">${ico("edit")}</button>
        <button class="icon-btn" data-del-asg="${a.id}" aria-label="Delete assignment">${ico("trash")}</button>
      </div>
    </div>
    <div class="row" style="gap:9px;margin-top:11px"><div style="flex:1">${progressBar(a.progress || 0, a.progress >= 100 ? "ok" : days !== null && days < 1 && a.progress < 50 ? "danger" : "")}</div>
      <span class="tiny muted" style="width:34px;text-align:right">${a.progress || 0}%</span>
      <input type="range" min="0" max="100" step="5" value="${a.progress || 0}" data-progress="${a.id}" style="width:110px" aria-label="Progress for ${esc(a.title)}">
    </div>
    ${a.notes ? `<div class="small muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)">${esc(a.notes.slice(0, 220))}</div>` : ""}
  </div>`;
}
function bindAssignmentCards(root) {
  $$("[data-status]", root).forEach(s => s.onchange = () => {
    const a = D.assignments.find(x => x.id === s.dataset.status);
    a.status = s.value;
    if (s.value === "submitted") a.progress = 100;
    if (s.value === "graded") a.progress = 100;
    a.updated = D2.iso(); logActivity(`Assignment “${a.title}” moved to ${s.value}`, "task", "assignments"); saveDB(); renderRoute();
  });
  $$("[data-progress]", root).forEach(inp => {
    inp.oninput = () => { const a = D.assignments.find(x => x.id === inp.dataset.progress); a.progress = +inp.value; const bar = inp.closest(".row")?.querySelector(".progress i"); if (bar) bar.style.width = inp.value + "%"; const lab = inp.closest(".row")?.querySelector(".tiny.muted"); if (lab) lab.textContent = inp.value + "%"; };
    inp.onchange = () => { saveDB(); renderRoute(); };
  });
  $$("[data-edit-asg]", root).forEach(b => b.onclick = () => assignmentModal(D.assignments.find(x => x.id === b.dataset.editAsg)));
  $$("[data-del-asg]", root).forEach(b => b.onclick = () => confirmDialog("Delete assignment?", "This removes it from your dashboard and analytics.", () => {
    D.assignments = D.assignments.filter(x => x.id !== b.dataset.delAsg); saveDB(); renderRoute();
  }));
}
function assignmentModal(a) {
  const edit = !!a;
  modal({
    title: edit ? "Edit assignment" : "New assignment", icon: "task", wide: true, body: `
      <div class="field"><label for="aTitle">Title</label><input id="aTitle" placeholder="e.g. Biology lab report" value="${esc(a?.title || "")}"></div>
      <div class="input-row">
        <div class="field"><label for="aSub">Subject</label><select id="aSub">${SUBJECTS.map(s => `<option value="${s.id}" ${a?.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${a?.subject === "general" ? "selected" : ""}>General</option></select></div>
        <div class="field"><label for="aDue">Deadline</label><input id="aDue" type="date" value="${a?.due || D2.addDays(7)}"></div>
        <div class="field"><label for="aPrio">Priority</label><select id="aPrio">${[["high", "High"], ["med", "Medium"], ["low", "Low"]].map(([v, l]) => `<option value="${v}" ${a?.priority === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="input-row">
        <div class="field"><label for="aStatus">Status</label><select id="aStatus">${[["todo", "To do"], ["in-progress", "In progress"], ["submitted", "Submitted"], ["graded", "Graded"]].map(([v, l]) => `<option value="${v}" ${a?.status === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="aProg">Progress (%)</label><input id="aProg" type="number" min="0" max="100" value="${a?.progress || 0}"></div>
        <div class="field"><label for="aGrade">Grade (optional)</label><input id="aGrade" placeholder="e.g. A− / 72%" value="${esc(a?.grade || "")}"></div>
      </div>
      <div class="field"><label for="aNotes">Notes & requirements</label><textarea id="aNotes" rows="4" placeholder="Word count, rubric points, what still needs doing…">${esc(a?.notes || "")}</textarea></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="aSave">${edit ? "Save changes" : "Add assignment"}</button>`,
    onMount: (m) => $("#aSave", m).onclick = () => {
      const data = {
        title: $("#aTitle", m).value.trim(), subject: $("#aSub", m).value, due: $("#aDue", m).value,
        priority: $("#aPrio", m).value, status: $("#aStatus", m).value, progress: clamp(+$("#aProg", m).value || 0, 0, 100),
        grade: $("#aGrade", m).value.trim(), notes: $("#aNotes", m).value.trim(), updated: D2.iso()
      };
      if (!data.title) return toast("Give the assignment a title.", "warn");
      if (edit) Object.assign(a, data);
      else { D.assignments.unshift({ id: uid("as"), createdAt: D2.iso(), ...data }); logActivity(`Added assignment “${data.title}”`, "task", "assignments"); }
      saveDB(); closeModal(); renderRoute(); toast(edit ? "Assignment updated" : "Assignment added");
    }
  });
}

/* ---------- writing tools ---------- */
const CITE_STYLES = {
  apa: (s) => `${s.author || "Unknown author"} (${s.year || "n.d."}). ${s.title || "Untitled"}. ${s.publisher ? s.publisher + ". " : ""}${s.url ? s.url : ""}`,
  mla: (s) => `${s.author || "Unknown author"}. “${s.title || "Untitled"}.” ${s.publisher || ""}${s.publisher ? ", " : ""}${s.year || "n.d."}${s.url ? ", " + s.url : ""}.`,
  chicago: (s) => `${s.author || "Unknown author"}. ${s.title || "Untitled"}. ${s.publisher ? s.publisher + ", " : ""}${s.year || "n.d."}${s.url ? ". " + s.url : ""}.`
};
function formatCitation(s, style) { return (CITE_STYLES[style] || CITE_STYLES.apa)(s); }

function writingToolsModal(tab = "outline") {
  modal({
    title: "Writing & problem-solving tools", icon: "wand", wide: true, body: `
      <div class="tabs" id="wtTabs">
        ${[["outline", "Essay outline"], ["grammar", "Grammar & clarity"], ["math", "Maths explainer"], ["cite", "Citations"]].map(([k, l]) => `<button data-wt="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}
      </div>
      <div id="wtBody"></div>`,
    footer: `<button class="btn" data-close>Close</button>`,
    onMount: (m) => {
      const body = $("#wtBody", m);
      const paint = (t) => {
        $$("[data-wt]", m).forEach(b => b.classList.toggle("on", b.dataset.wt === t));
        if (t === "cite") {
          body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="small muted">${D.sources.length} saved source${D.sources.length === 1 ? "" : "s"}. Citations are formatted deterministically from the metadata you enter.</span><button class="btn sm" id="addCite">${ico("plus")} Add source</button></div>
            <div id="citeList">${citeListHTML()}</div>`;
          bindCite(body);
        } else if (t === "math") {
          body.innerHTML = `<p class="small muted">Paste a problem and your working. The tutor diagnoses the step where reasoning breaks, not just the final answer.</p>
            <div class="field"><label for="mathProblem">Problem</label><textarea id="mathProblem" rows="3" placeholder="e.g. Solve 2x² − 5x − 3 = 0"></textarea></div>
            <div class="field"><label for="mathWork">Your working (optional)</label><textarea id="mathWork" rows="4" placeholder="Show what you tried…"></textarea></div>
            <button class="btn primary" id="mathGo" ${AI.ready() ? "" : "disabled"}>${ico("sparkle")} Explain step by step</button>${AI.ready() ? "" : `<p class="tiny muted" style="margin-top:8px">Requires an AI key in Settings → AI.</p>`}
            <div id="mathOut" style="margin-top:14px"></div>`;
          $("#mathGo", body).onclick = async () => {
            if (!aiGuard()) return;
            const p = $("#mathProblem", body).value.trim(); if (!p) return toast("Enter a problem first.", "warn");
            const work = $("#mathWork", body).value.trim();
            const out = $("#mathOut", body); out.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
            try {
              const txt = await AI.chat([{ role: "user", content: `Problem: ${p}\n\nStudent working:\n${work || "(none provided)"}\n\nGive a step-by-step solution. For each step state the rule used. Then identify the most likely point of confusion and give one similar practice problem with the answer hidden at the end.` }], { system: tutorSystem("math", D.profile.level), max_tokens: 1500 });
              out.innerHTML = `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(txt)}</div></div></div>`;
            } catch (e) { out.innerHTML = `<div class="card" style="border-color:var(--danger)"><b class="small">Request failed</b><p class="small muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
          };
        } else if (t === "grammar") {
          body.innerHTML = `<p class="small muted">Paste a paragraph. You get a corrected version plus explanations of each change — useful for learning, not just polishing.</p>
            <div class="field"><label for="grText">Your writing</label><textarea id="grText" rows="8" placeholder="Paste a paragraph from your essay…"></textarea></div>
            <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" id="grGo" ${AI.ready() ? "" : "disabled"}>${ico("sparkle")} Improve writing</button><span class="tiny muted">AI is not a substitute for proofreading your own argument.</span></div>
            <div id="grOut" style="margin-top:14px"></div>`;
          $("#grGo", body).onclick = async () => {
            if (!aiGuard()) return;
            const text = $("#grText", body).value.trim(); if (text.length < 30) return toast("Paste at least a couple of sentences.", "warn");
            const out = $("#grOut", body); out.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
            try {
              const txt = await AI.chat([{ role: "user", content: `Improve this student writing for grammar, clarity and flow without changing the argument or adding new claims. Return: (1) the revised text, (2) a table of the 5 most important changes with the reason, (3) one structural suggestion.\n\n${text}` }], { system: "You are a careful writing tutor. Preserve the student's voice and meaning. Never invent evidence.", max_tokens: 1600 });
              out.innerHTML = `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(txt)}</div></div></div>`;
            } catch (e) { out.innerHTML = `<div class="card" style="border-color:var(--danger)"><b class="small">Request failed</b><p class="small muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
          };
        } else {
          body.innerHTML = `<p class="small muted">Describe the question, your subject and the required length. The outline gives a defensible structure you can write from.</p>
            <div class="input-row"><div class="field"><label for="olSub">Subject</label><select id="olSub">${SUBJECTS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
            <div class="field"><label for="olLen">Length</label><select id="olLen"><option>Short (500 words)</option><option selected>Standard essay (1200 words)</option><option>Extended (2500 words)</option></select></div></div>
            <div class="field"><label for="olQ">Essay question</label><textarea id="olQ" rows="3" placeholder="e.g. “Evaluate the view that inflation is always harmful.”"></textarea></div>
            <button class="btn primary" id="olGo" ${AI.ready() ? "" : "disabled"}>${ico("sparkle")} Build outline</button>
            <div id="olOut" style="margin-top:14px"></div>`;
          $("#olGo", body).onclick = async () => {
            if (!aiGuard()) return;
            const q = $("#olQ", body).value.trim(); if (!q) return toast("Enter the essay question.", "warn");
            const out = $("#olOut", body); out.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
            try {
              const txt = await AI.chat([{ role: "user", content: `Essay question: ${q}\nSubject: ${subj($("#olSub", body).value).name}\nTarget length: ${$("#olLen", body).value}\n\nProduce an essay plan: a thesis, 3 body paragraphs (claim, evidence to find, analysis angle), one counter-argument with response, and a conclusion direction. Include 3 questions the student must answer with their own evidence. Do not fabricate quotations or statistics.` }], { system: "You are an essay planning tutor. Structure only — never invent sources or quotations.", max_tokens: 1400 });
              out.innerHTML = `<div class="msg ai"><div class="av">${ico("sparkle")}</div><div class="body"><div class="text">${md(txt)}</div></div></div>`;
            } catch (e) { out.innerHTML = `<div class="card" style="border-color:var(--danger)"><b class="small">Request failed</b><p class="small muted" style="margin:4px 0 0">${esc(e.message)}</p></div>`; }
          };
        }
      };
      $$("[data-wt]", m).forEach(b => b.onclick = () => paint(b.dataset.wt));
      paint(tab);
    }
  });
}
function citeListHTML() {
  if (!D.sources.length) return `<div class="empty" style="padding:24px"><p>No sources saved yet. Add one and Atlas formats APA, MLA and Chicago automatically.</p></div>`;
  return `<div class="stack">${D.sources.map(s => `<div class="card" style="padding:11px">
    <div class="row" style="align-items:flex-start;gap:8px"><div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(s.title)}</div><div class="tiny muted">${esc(s.author || "Unknown author")} · ${esc(s.year || "n.d.")} · ${esc(s.type || "source")}</div></div>
      <button class="icon-btn" style="width:26px;height:26px" data-del-src="${s.id}" aria-label="Delete source">${ico("trash")}</button></div>
    <div class="stack" style="gap:4px;margin-top:8px">${["apa", "mla", "chicago"].map(st => `<div class="row" style="align-items:flex-start;gap:6px"><span class="chip" style="min-width:52px;justify-content:center;font-size:9.5px">${st.toUpperCase()}</span><span class="tiny" style="flex:1;color:var(--text-2);line-height:1.5">${esc(formatCitation(s, st))}</span><button class="icon-btn" style="width:22px;height:22px;border:0;background:transparent" data-copy-cite="${s.id}:${st}" aria-label="Copy citation">${ico("copy")}</button></div>`).join("")}</div>
  </div>`).join("")}</div>`;
}
function bindCite(scope) {
  const add = $("#addCite", scope); if (add) add.onclick = () => sourceModal();
  $$("[data-del-src]", scope).forEach(b => b.onclick = () => confirmDialog("Delete source?", "It will be removed from your citation library.", () => {
    D.sources = D.sources.filter(s => s.id !== b.dataset.delSrc); saveDB(); closeModal(); writingToolsModal("cite");
  }));
  $$("[data-copy-cite]", scope).forEach(b => b.onclick = () => {
    const [id, style] = b.dataset.copyCite.split(":"); const s = D.sources.find(x => x.id === id);
    if (s) copyText(formatCitation(s, style), "Citation copied");
  });
}
function citationLibraryModal() { writingToolsModal("cite"); }

function sourceModal(src, projectId) {
  const s = src || {};
  modal({
    title: src ? "Edit source" : "Add source", icon: "quote", wide: true, body: `
      <div class="row" style="margin-bottom:12px"><span class="chip brand">${ico("shield")} Deterministic formatting</span><span class="tiny muted">Citations are generated from your metadata — no AI involved.</span></div>
      <div class="field"><label for="srcTitle">Title</label><input id="srcTitle" value="${esc(s.title || "")}" placeholder="Book, article or page title"></div>
      <div class="input-row"><div class="field"><label for="srcAuthor">Author(s)</label><input id="srcAuthor" value="${esc(s.author || "")}" placeholder="Surname, Initial."></div>
      <div class="field"><label for="srcYear">Year</label><input id="srcYear" value="${esc(s.year || "")}" placeholder="2020"></div>
      <div class="field"><label for="srcType">Type</label><select id="srcType">${["book", "journal article", "website", "report", "video", "other"].map(t => `<option ${s.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>
      <div class="input-row"><div class="field"><label for="srcPublisher">Publisher / journal</label><input id="srcPublisher" value="${esc(s.publisher || "")}"></div>
      <div class="field"><label for="srcUrl">URL</label><input id="srcUrl" value="${esc(s.url || "")}" placeholder="https://…"></div></div>
      <div class="field"><label for="srcNotes">Notes / what it argues</label><textarea id="srcNotes" rows="3">${esc(s.notes || "")}</textarea></div>
      <div class="field"><label for="srcQuote">Key quotation (optional)</label><textarea id="srcQuote" rows="2">${esc(s.quote || "")}</textarea></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="srcSave">${src ? "Save source" : "Add to library"}</button>`,
    onMount: (m) => $("#srcSave", m).onclick = () => {
      const title = $("#srcTitle", m).value.trim();
      if (!title) return toast("A title is required for a citation.", "warn");
      const data = { title, author: $("#srcAuthor", m).value.trim(), year: $("#srcYear", m).value.trim(), type: $("#srcType", m).value, publisher: $("#srcPublisher", m).value.trim(), url: $("#srcUrl", m).value.trim(), notes: $("#srcNotes", m).value.trim(), quote: $("#srcQuote", m).value.trim(), accessed: D2.iso(), projectId: projectId || s.projectId || null };
      if (src) Object.assign(src, data);
      else D.sources.unshift({ id: uid("src"), ...data });
      saveDB(); closeModal();
      if (projectId) { toast("Source added"); renderRoute(); } else writingToolsModal("cite");
    }
  });
}
page("assignments", { title: "Assignments" }, renderAssignments);
</script>
<script>
/* ============================ RESEARCH CENTRE ============================ */
const rsState = { tab: "overview", view: "projects" };

function renderResearch(root, { params }) {
  if (params.id) return renderProject(root, params.id);
  const projects = [...D.research].sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  const totalSources = D.sources.length;
  root.innerHTML = `
    ${pageHead({ eyebrow: "Study", title: "Research", desc: "A workspace that keeps your sources, their claims and your own synthesis visibly separate.", actions: `<button class="btn" id="knowledgeLib">${ico("bookOpen")} Knowledge library</button><button class="btn primary" id="newResearch">${ico("plus")} New project</button>` })}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">${ico("flask")} Active projects</div><div class="v">${projects.filter(p => p.status === "active").length}</div><div class="d">${projects.length} total</div></div>
      <div class="stat"><div class="k">${ico("quote")} Sources collected</div><div class="v">${totalSources}</div><div class="d">${uniq(D.sources.map(s => s.type)).length || 0} source types</div></div>
      <div class="stat"><div class="k">${ico("sparkle")} AI syntheses</div><div class="v">${sum(projects.map(p => (p.aiNotes || []).length))}</div><div class="d">Always labelled as generated</div></div>
      <div class="stat"><div class="k">${ico("note")} Research notes</div><div class="v">${sum(projects.map(p => (p.outline || []).length))}</div><div class="d">Outline points</div></div>
    </div>
    ${projects.length ? `<div class="grid g-fit">${projects.map(p => {
      const srcs = D.sources.filter(s => s.projectId === p.id);
      return `<div class="card hoverable" data-proj="${p.id}" role="button" tabindex="0" style="cursor:pointer">
        <div class="row" style="align-items:flex-start;margin-bottom:9px"><div class="tile" style="background:${subj(p.subject).color}1c;color:${subj(p.subject).color}">${ico("flask")}</div><span class="spacer"></span><span class="chip ${p.status === "active" ? "brand" : p.status === "complete" ? "ok" : ""}">${esc(p.status)}</span></div>
        <h4 style="font-size:14px;margin-bottom:4px">${esc(p.title)}</h4>
        <p class="small muted" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px">${esc(p.question || "No research question set yet.")}</p>
        <div class="row wrap" style="gap:5px"><span class="chip">${srcs.length} sources</span><span class="chip">${(p.outline || []).length} outline points</span><span class="chip">${(p.aiNotes || []).length} AI notes</span></div>
      </div>`;
    }).join("")}</div>` : `<div class="card">${emptyState("flask", "Start a research project", "Frame a question, collect sources with their claims, then build an outline. Atlas keeps sourced evidence and AI synthesis clearly separated.", `<button class="btn primary" id="newResearch2">${ico("plus")} Create project</button>`)}</div>`}`;

  $("#newResearch", root).onclick = () => researchModal();
  const n2 = $("#newResearch2", root); if (n2) n2.onclick = () => researchModal();
  $$("[data-proj]", root).forEach(p => p.onclick = () => go("research", { id: p.dataset.proj }));
  $("#knowledgeLib", root).onclick = () => knowledgeLibraryModal();
}

function researchModal(p) {
  const edit = !!p;
  modal({
    title: edit ? "Project settings" : "New research project", icon: "flask", body: `
      <div class="field"><label for="rTitle">Project title</label><input id="rTitle" placeholder="e.g. Does bilingual education improve cognitive flexibility?" value="${esc(p?.title || "")}"></div>
      <div class="field"><label for="rQ">Research question</label><textarea id="rQ" rows="3" placeholder="A focused, answerable question…">${esc(p?.question || "")}</textarea></div>
      <div class="input-row"><div class="field"><label for="rSub">Subject</label><select id="rSub">${SUBJECTS.map(s => `<option value="${s.id}" ${p?.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${p?.subject === "general" ? "selected" : ""}>General</option></select></div>
      <div class="field"><label for="rStat">Status</label><select id="rStat">${["active", "paused", "complete"].map(s => `<option ${p?.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rSave">${edit ? "Save" : "Create project"}</button>`,
    onMount: (m) => $("#rSave", m).onclick = () => {
      const title = $("#rTitle", m).value.trim(); if (!title) return toast("Give the project a title.", "warn");
      const data = { title, question: $("#rQ", m).value.trim(), subject: $("#rSub", m).value, status: $("#rStat", m).value, updated: D2.iso() };
      if (edit) Object.assign(p, data);
      else { const np = { id: uid("r"), outline: [], aiNotes: [], notes: "", createdAt: D2.iso(), ...data }; D.research.unshift(np); saveDB(); closeModal(); go("research", { id: np.id }); return; }
      saveDB(); closeModal(); renderRoute();
    }
  });
}

function renderProject(root, id) {
  const p = D.research.find(x => x.id === id);
  if (!p) { root.innerHTML = `<div class="card">${emptyState("alert", "Project not found", "It may have been deleted.", `<button class="btn" data-go="research">Back to research</button>`)}</div>`; return; }
  const sources = D.sources.filter(s => s.projectId === p.id);
  const tab = rsState.tab || "overview";
  root.innerHTML = `
    <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:7px"><button class="btn sm ghost" data-go="research">${ico("arrowLeft")} Research</button><span class="spacer"></span>
      <button class="btn sm" id="editProj">${ico("settings")} Settings</button><button class="btn sm ghost" id="exportProj">${ico("download")} Export</button><button class="btn sm ghost danger" id="delProj">${ico("trash")}</button></div>
    <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,${subj(p.subject).color}12,transparent 60%)">
      <div class="row wrap" style="gap:12px;align-items:flex-start">
        <div class="tile" style="width:46px;height:46px;border-radius:13px;background:${subj(p.subject).color}1c;color:${subj(p.subject).color}">${ico("flask")}</div>
        <div style="flex:1;min-width:220px"><div class="eyebrow">${esc(subj(p.subject).name)} · ${esc(p.status)}</div><h1 style="font-size:23px;margin:2px 0 5px">${esc(p.title)}</h1>
        <p class="small muted" style="margin:0;max-width:70ch">${esc(p.question || "No research question set yet.")}</p></div>
        <div class="row" style="gap:14px">${donutChart([{ v: sources.length, c: "var(--brand)" }, { v: Math.max(0, 5 - sources.length), c: "var(--panel-3)" }], { size: 74, thickness: 8, center: `<div><b style="font-size:14px">${sources.length}</b><div class="tiny muted">sources</div></div>` })}</div>
      </div>
    </div>
    <div class="tabs" id="rTabs">${[["overview", "Overview"], ["outline", "Outline"], ["sources", `Sources (${sources.length})`], ["ai", `AI synthesis (${(p.aiNotes || []).length})`]].map(([k, l]) => `<button data-rtab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div id="rBody"></div>`;

  $$("[data-rtab]", root).forEach(b => b.onclick = () => { rsState.tab = b.dataset.rtab; renderProject(root, id); });
  $("#editProj", root).onclick = () => researchModal(p);
  $("#delProj", root).onclick = () => confirmDialog("Delete project?", "Sources will be kept in your knowledge library; the outline and AI notes will be deleted.", () => {
    D.research = D.research.filter(x => x.id !== p.id); saveDB(); go("research"); toast("Project deleted");
  });
  $("#exportProj", root).onclick = () => {
    const srcs = D.sources.filter(s => s.projectId === p.id);
    const txt = `${p.title}\n${"=".repeat(p.title.length)}\n\nResearch question: ${p.question || "—"}\nSubject: ${subj(p.subject).name}\nStatus: ${p.status}\n\nOUTLINE\n${(p.outline || []).map((o, i) => `${i + 1}. ${o}`).join("\n") || "—"}\n\nNOTES\n${p.notes || "—"}\n\nSOURCES\n${srcs.map((s, i) => `${i + 1}. ${formatCitation(s, "apa")}\n   Notes: ${s.notes || "—"}\n   Key quote: ${s.quote || "—"}`).join("\n\n") || "—"}\n\nAI SYNTHESIS (generated, verify independently)\n${(p.aiNotes || []).map(a => `— ${D2.fmt(a.at)} (${a.model})\n${a.content}`).join("\n\n") || "—"}\n`;
    download(p.title.replace(/[^\w\s-]/g, "") + ".txt", txt, "text/plain"); toast("Project exported");
  };

  const body = $("#rBody", root);
  if (tab === "overview") {
    body.innerHTML = `<div class="grid g2" style="gap:16px">
      <div class="card">
        <div class="card-head"><h3>Working notes</h3><span class="save-state" id="rSaved">Autosaves</span></div>
        <textarea id="projNotes" rows="12" placeholder="Working notes, decisions, open questions…" style="min-height:220px">${esc(p.notes || "")}</textarea>
      </div>
      <div class="stack">
        <div class="card"><div class="card-head"><h3>Project checklist</h3></div>
          ${[["Question is focused and answerable", !!p.question], ["At least 3 credible sources collected", sources.length >= 3], ["Outline drafted", (p.outline || []).length >= 3], ["Source notes written", sources.some(s => s.notes)], ["Synthesis reviewed against sources", (p.aiNotes || []).length > 0]].map(([t, ok]) => `<div class="row" style="padding:6px 0;gap:8px"><span style="width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:${ok ? "var(--ok-soft)" : "var(--panel-3)"};color:${ok ? "var(--ok)" : "var(--faint)"}">${ok ? ico("check") : ""}</span><span class="small ${ok ? "" : "muted"}">${t}</span></div>`).join("")}
        </div>
        <div class="card"><div class="card-head"><h3>Evidence balance</h3></div>
          <p class="tiny muted">Sourced material is what you recorded from a real source. AI synthesis is interpretation and must be checked against those sources before you cite anything.</p>
          <div class="row" style="gap:16px;margin-top:10px"><div><div style="font-size:20px;font-weight:700">${sources.length}</div><div class="tiny muted">sourced records</div></div><div><div style="font-size:20px;font-weight:700">${(p.aiNotes || []).length}</div><div class="tiny muted">AI syntheses</div></div></div>
        </div>
      </div>
    </div>`;
    const ta = $("#projNotes", body);
    ta.oninput = debounce(() => { p.notes = ta.value; p.updated = new Date().toISOString(); saveDB(); const s = $("#rSaved", body); s.textContent = "Saved"; s.className = "save-state ok"; }, 500);
  }
  if (tab === "outline") {
    body.innerHTML = `<div class="card">
      <div class="card-head"><h3>Structure</h3><span class="tiny muted">${(p.outline || []).length} points</span></div>
      <div class="stack" id="outlineList">${(p.outline || []).map((o, i) => `<div class="row" style="align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <span class="chip" style="min-width:24px;justify-content:center">${i + 1}</span>
        <div style="flex:1;font-size:13px">${esc(o)}</div>
        <button class="icon-btn" style="width:26px;height:26px" data-ol-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move up">${ico("chevronDown")}</button>
        <button class="icon-btn" style="width:26px;height:26px" data-ol-del="${i}" aria-label="Delete point">${ico("trash")}</button>
      </div>`).join("") || `<p class="small muted">No outline yet. Add your first point below, or ask AI for a scaffold and edit it.</p>`}</div>
      <div class="divider"></div>
      <div class="row" style="gap:7px"><input id="olNew" placeholder="Add an outline point…" style="flex:1"><button class="btn primary" id="olAdd">${ico("plus")} Add</button></div>
      <div class="divider"></div>
      <div class="row wrap" style="gap:6px"><button class="btn sm soft" id="olAi" ${AI.ready() ? "" : "disabled"}>${ico("sparkle")} AI outline scaffold</button><span class="tiny muted">${AI.ready() ? "Generated structure is labelled and editable." : "Requires an API key."}</span></div>
    </div>`;
    const add = () => { const v = $("#olNew", body).value.trim(); if (!v) return; p.outline = p.outline || []; p.outline.push(v); p.updated = D2.iso(); saveDB(); renderProject(root, id); };
    $("#olAdd", body).onclick = add;
    $("#olNew", body).onkeydown = (e) => { if (e.key === "Enter") add(); };
    $$("[data-ol-del]", body).forEach(b => b.onclick = () => { p.outline.splice(+b.dataset.olDel, 1); saveDB(); renderProject(root, id); });
    $$("[data-ol-up]", body).forEach(b => b.onclick = () => { const i = +b.dataset.olUp; [p.outline[i - 1], p.outline[i]] = [p.outline[i], p.outline[i - 1]]; saveDB(); renderProject(root, id); });
    const ai = $("#olAi", body);
    if (ai) ai.onclick = async () => {
      if (!aiGuard()) return; ai.disabled = true; ai.textContent = "Thinking…";
      try {
        const out = await AI.chat([{ role: "user", content: `Research question: ${p.question || p.title}\nCreate a 6-point research outline. Each point must be a single sentence naming the section and its purpose. Do not include sources or facts that need citation; this is structure only. Return a numbered list.` }], { system: "You are a research methods tutor. Produce structure only, no invented evidence.", max_tokens: 700 });
        const lines = out.split("\n").map(l => l.replace(/^\s*\d+[.)]\s*/, "").trim()).filter(l => l.length > 3).slice(0, 8);
        p.outline = p.outline || []; p.outline.push(...lines.map(l => l + "  [AI scaffold]"));
        p.aiNotes = p.aiNotes || []; p.aiNotes.unshift({ id: uid("ai"), at: new Date().toISOString(), model: AI.cfg().model, type: "outline", content: out });
        saveDB(); renderProject(root, id); toast("AI scaffold added — edit it to fit your argument.");
      } catch (e) { toast(e.message, "err", "AI request failed"); ai.disabled = false; ai.innerHTML = `${ico("sparkle")} AI outline scaffold`; }
    };
  }
  if (tab === "sources") {
    body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div><b style="font-size:13.5px">Sourced evidence</b><div class="tiny muted">Only records you added from a real source appear here.</div></div><button class="btn primary sm" id="addSrc">${ico("plus")} Add source</button></div>
      ${sources.length ? `<div class="stack">${sources.map(s => `<div class="card" style="padding:13px">
        <div class="row" style="align-items:flex-start;gap:9px"><div class="tile" style="width:30px;height:30px">${ico("quote")}</div><div style="flex:1"><div style="font-weight:650;font-size:13px">${esc(s.title)}</div><div class="tiny muted">${esc(s.author || "Unknown author")} · ${esc(s.year || "n.d.")} · ${esc(s.type || "source")}${s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">link</a>` : ""}</div></div>
          <button class="icon-btn" style="width:26px;height:26px" data-edit-src="${s.id}" aria-label="Edit source">${ico("edit")}</button><button class="icon-btn" style="width:26px;height:26px" data-del-src2="${s.id}" aria-label="Delete source">${ico("trash")}</button></div>
        ${s.quote ? `<blockquote style="margin:9px 0;padding:6px 11px;border-left:3px solid var(--brand);background:var(--panel-2);font-size:12.5px;font-style:italic;color:var(--text-2)">“${esc(s.quote)}”</blockquote>` : ""}
        ${s.notes ? `<div class="small muted" style="margin-top:6px">${esc(s.notes)}</div>` : ""}
        <div class="row" style="gap:4px;margin-top:8px"><span class="chip" style="font-size:9.5px">APA</span><span class="tiny" style="flex:1;color:var(--text-2)">${esc(formatCitation(s, "apa"))}</span><button class="icon-btn" style="width:22px;height:22px;border:0;background:transparent" data-copy-src="${s.id}" aria-label="Copy citation">${ico("copy")}</button></div>
      </div>`).join("")}</div>` : emptyState("quote", "No sources yet", "Add a book, article or page with the specific claim you are taking from it.", `<button class="btn primary sm" id="addSrc2">${ico("plus")} Add first source</button>`)}`;
    const add = () => sourceModal(null, p.id);
    $("#addSrc", body).onclick = add; const a2 = $("#addSrc2", body); if (a2) a2.onclick = add;
    $$("[data-edit-src]", body).forEach(b => b.onclick = () => sourceModal(D.sources.find(s => s.id === b.dataset.editSrc), p.id));
    $$("[data-del-src2]", body).forEach(b => b.onclick = () => confirmDialog("Delete source?", "It will be removed from this project and the citation library.", () => {
      D.sources = D.sources.filter(s => s.id !== b.dataset.delSrc2); saveDB(); renderProject(root, id);
    }));
    $$("[data-copy-src]", body).forEach(b => b.onclick = () => { const s = D.sources.find(x => x.id === b.dataset.copySrc); if (s) copyText(formatCitation(s, "apa"), "Citation copied"); });
  }
  if (tab === "ai") {
    body.innerHTML = `<div class="card" style="margin-bottom:14px;border-color:var(--brand)">
      <div class="row" style="margin-bottom:9px"><span class="chip brand">${ico("sparkle")} AI-generated · verify before citing</span><span class="spacer"></span><span class="tiny muted">${AI.ready() ? AI.cfg().model : "AI not configured"}</span></div>
      <div class="row wrap" style="gap:7px"><button class="btn sm primary" id="synthSources" ${AI.ready() && sources.length ? "" : "disabled"}>${ico("sparkle")} Synthesise my sources</button>
      <button class="btn sm" id="sumDoc" ${AI.ready() ? "" : "disabled"}>${ico("note")} Summarise a document</button></div>
      <p class="tiny muted" style="margin:9px 0 0">${sources.length ? "Synthesis uses the source notes and quotes you recorded — not invented material." : "Add sources first; synthesis draws only on what you recorded."}</p>
    </div>
    ${(p.aiNotes || []).length ? `<div class="stack">${p.aiNotes.map(a => `<div class="card">
      <div class="row" style="margin-bottom:6px"><span class="chip brand">${ico("sparkle")} ${esc(a.type || "synthesis")}</span><span class="spacer"></span><span class="tiny muted">${esc(D2.fmt((a.at || "").slice(0, 10)))} · ${esc(a.model || "")}</span><button class="icon-btn" style="width:26px;height:26px" data-del-ai="${a.id}" aria-label="Delete AI note">${ico("trash")}</button></div>
      <div class="text" style="font-size:13px">${md(a.content)}</div></div>`).join("")}</div>` : `<div class="card">${emptyState("sparkle", "No synthesis yet", "Once you have sources, generate a synthesis or summarise a document. Every AI output stays labelled and separate from your sourced evidence.")}</div>`}`;
    $$("[data-del-ai]", body).forEach(b => b.onclick = () => { p.aiNotes = p.aiNotes.filter(x => x.id !== b.dataset.delAi); saveDB(); renderProject(root, id); });
    const synth = $("#synthSources", body);
    if (synth) synth.onclick = async () => {
      if (!aiGuard()) return; synth.disabled = true; synth.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
      try {
        const material = sources.map((s, i) => `SOURCE ${i + 1}: ${s.author || "Unknown"} (${s.year || "n.d."}), “${s.title}”. Notes: ${s.notes || "(none)"}${s.quote ? ` Quote: “${s.quote}”` : ""}`).join("\n\n");
        const out = await AI.chat([{ role: "user", content: `Research question: ${p.question || p.title}\n\nHere are the student's own source records:\n${material}\n\nProduce: (1) where sources agree, (2) where they conflict, (3) what the evidence does NOT establish, (4) a suggested argument. Cite sources by number only where the student's notes support the claim. If the notes are too thin to support a point, say so explicitly.` }], { system: "You synthesise only from the supplied source records. Never add outside facts or invent citations. Distinguish evidence from inference.", max_tokens: 1600 });
        p.aiNotes = p.aiNotes || []; p.aiNotes.unshift({ id: uid("ai"), at: new Date().toISOString(), model: AI.cfg().model, type: "synthesis", content: out });
        saveDB(); renderProject(root, id); toast("Synthesis saved and labelled as AI-generated.");
      } catch (e) { toast(e.message, "err", "AI request failed"); synth.disabled = false; synth.innerHTML = `${ico("sparkle")} Synthesise my sources`; }
    };
    const sum = $("#sumDoc", body);
    if (sum) sum.onclick = () => modal({
      title: "Summarise a document", icon: "note", wide: true, body: `<p class="small muted">Paste text from a source. The summary is saved here as AI-generated and stays separate from your source records.</p>
        <div class="field"><label for="rsDoc">Document text</label><textarea id="rsDoc" rows="9" placeholder="Paste the passage or chapter…"></textarea></div>
        <div class="field"><label for="rsFocus">What should the summary focus on?</label><input id="rsFocus" placeholder="e.g. evidence about long-term retention" value="${esc(p.question || "")}"></div>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="rsGo">${ico("sparkle")} Summarise</button>`,
      onMount: (m) => $("#rsGo", m).onclick = async () => {
        if (!aiGuard()) return;
        const text = $("#rsDoc", m).value.trim(); if (text.length < 100) return toast("Paste a longer passage.", "warn");
        const btn = $("#rsGo", m); btn.disabled = true; btn.textContent = "Summarising…";
        try {
          const out = await AI.chat([{ role: "user", content: `Summarise this document for a research project. Focus: ${$("#rsFocus", m).value || "main claims and evidence"}.\nReturn: overview, key claims (bullets), methodology/limits mentioned, and 3 questions it raises. Do not add outside information.\n\n${text.slice(0, 16000)}` }], { system: "You summarise only the supplied text. Never invent claims, data or citations.", max_tokens: 1400 });
          p.aiNotes = p.aiNotes || []; p.aiNotes.unshift({ id: uid("ai"), at: new Date().toISOString(), model: AI.cfg().model, type: "document summary", content: out });
          saveDB(); closeModal(); renderProject(root, id); toast("Summary saved as AI-generated.");
        } catch (e) { toast(e.message, "err", "AI request failed"); btn.disabled = false; btn.innerHTML = `${ico("sparkle")} Summarise`; }
      }
    });
  }
  if (window.innerWidth < 900) { const g = $(".grid", body); if (g) g.style.gridTemplateColumns = "1fr"; }
}

function knowledgeLibraryModal() {
  const rows = D.sources;
  modal({
    title: "Knowledge library", icon: "bookOpen", wide: true, body: `
      <div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div><b style="font-size:13.5px">${rows.length} sources</b><div class="tiny muted">Shared across assignments and research projects.</div></div><button class="btn sm primary" id="klAdd">${ico("plus")} Add source</button></div>
      ${rows.length ? `<div class="stack">${rows.map(s => {
        const proj = D.research.find(p => p.id === s.projectId);
        return `<div class="card" style="padding:12px"><div class="row" style="align-items:flex-start;gap:9px"><div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(s.title)}</div><div class="tiny muted">${esc(s.author || "Unknown")} · ${esc(s.year || "n.d.")} · ${esc(s.type)}${proj ? " · " + esc(proj.title) : ""}</div></div>
        <button class="icon-btn" style="width:25px;height:25px" data-kl-del="${s.id}" aria-label="Delete source">${ico("trash")}</button></div>
        <div class="tiny" style="margin-top:6px;color:var(--text-2)">${esc(formatCitation(s, "apa"))}</div></div>`;
      }).join("")}</div>` : `<p class="small muted">Nothing saved yet.</p>`}`,
    footer: `<button class="btn" data-close>Close</button>`,
    onMount: (m) => {
      $("#klAdd", m).onclick = () => sourceModal();
      $$("[data-kl-del]", m).forEach(b => b.onclick = () => { D.sources = D.sources.filter(s => s.id !== b.dataset.klDel); saveDB(); closeModal(); renderRoute(); });
    }
  });
}
page("research", { title: "Research" }, renderResearch);
</script>
<script>
/* ============================ PLANNER / TASKS / GOALS / HABITS ============================ */
const plannerState = { tab: "week", month: new Date(), taskFilter: "open" };

function renderPlanner(root, { params }) {
  if (params.tab) plannerState.tab = params.tab;
  const tab = plannerState.tab;
  root.innerHTML = `
    ${pageHead({ eyebrow: "Productivity", title: "Planner", desc: "Your week, tasks, goals and habits in one place — fed by the same deadlines as the rest of Atlas.", actions: `<button class="btn" id="addEvent">${ico("calendar")} Add event</button><button class="btn primary" id="addTask">${ico("plus")} New task</button>` })}
    <div class="tabs" id="pTabs">${[["week", "Week"], ["calendar", "Calendar"], ["tasks", `Tasks (${D.tasks.filter(t => !t.done).length})`], ["goals", "Goals"], ["habits", "Habits"]].map(([k, l]) => `<button data-ptab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div id="pBody"></div>`;
  $$("[data-ptab]", root).forEach(b => b.onclick = () => { plannerState.tab = b.dataset.ptab; renderPlanner(root, { params: {} }); });
  $("#addTask", root).onclick = () => taskModal();
  $("#addEvent", root).onclick = () => eventModal();
  const body = $("#pBody", root);
  if (tab === "week") weekView(body);
  if (tab === "calendar") calendarView(body);
  if (tab === "tasks") tasksView(body);
  if (tab === "goals") goalsView(body);
  if (tab === "habits") habitsView(body);
}

function weekView(body) {
  const start = D2.weekStart();
  const days = [...Array(7)].map((_, i) => D2.addDays(i, D2.parse(start)));
  body.innerHTML = `<div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:10px" id="weekGrid">
    ${days.map(d => {
      const isToday = d === D2.iso();
      const tasks = D.tasks.filter(t => t.due === d);
      const asg = D.assignments.filter(a => a.due === d && a.status !== "submitted");
      const exams = D.exams.filter(e => e.dueDate === d);
      const events = D.events.filter(e => e.date === d).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
      return `<div class="card" style="padding:11px;${isToday ? "border-color:var(--brand)" : ""}">
        <div class="row" style="justify-content:space-between;margin-bottom:7px"><div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.07em">${D2.parse(d).toLocaleDateString(undefined, { weekday: "short" })}</div><div style="font-weight:700;font-size:17px;${isToday ? "color:var(--brand-2)" : ""}">${D2.parse(d).getDate()}</div></div>
        <button class="icon-btn" style="width:23px;height:23px;border:0;background:transparent" data-day-add="${d}" aria-label="Add to ${d}">${ico("plus")}</button></div>
        <div class="stack" style="gap:4px">
          ${events.map(e => `<div style="font-size:10.5px;padding:3px 5px;border-radius:4px;background:var(--info-soft);color:var(--info);border-left:2px solid var(--info);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.title)}">${esc(e.time || "")} ${esc(e.title)}</div>`).join("")}
          ${tasks.map(t => `<div class="row" style="gap:4px;font-size:10.5px;${t.done ? "opacity:.5;text-decoration:line-through" : ""}"><input type="checkbox" ${t.done ? "checked" : ""} data-week-task="${t.id}" style="width:12px;height:12px;accent-color:var(--brand)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.title)}">${esc(t.title)}</span></div>`).join("")}
          ${asg.map(a => `<div style="font-size:10.5px;padding:3px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.title)}">${ico("task")} ${esc(a.title)}</div>`).join("")}
          ${exams.map(e => `<div style="font-size:10.5px;padding:3px 5px;border-radius:4px;background:var(--danger-soft);color:var(--danger)">${ico("exam")} ${esc(e.title)}</div>`).join("")}
          ${!events.length && !tasks.length && !asg.length && !exams.length ? `<div class="tiny muted" style="padding:6px 0">—</div>` : ""}
        </div></div>`;
    }).join("")}</div>
    <div class="grid g2" style="gap:16px;margin-top:16px">
      <div class="card"><div class="card-head"><h3>This week at a glance</h3></div>
        <div class="list">
          <div class="list-row"><span class="small muted" style="flex:1">Open tasks</span><b>${D.tasks.filter(t => !t.done).length}</b></div>
          <div class="list-row"><span class="small muted" style="flex:1">Work due</span><b>${D.assignments.filter(a => a.status !== "submitted" && a.due && D2.days(a.due) <= 7 && D2.days(a.due) >= 0).length}</b></div>
          <div class="list-row"><span class="small muted" style="flex:1">Planned study</span><b>${D2.dur(sum(D.sessions.filter(s => s.date >= start).map(s => s.minutes)))}</b></div>
          <div class="list-row"><span class="small muted" style="flex:1">Events scheduled</span><b>${D.events.filter(e => e.date >= start && e.date <= D2.addDays(6, D2.parse(start))).length}</b></div>
        </div>
      </div>
      <div class="card"><div class="card-head"><h3>Unscheduled tasks</h3></div>
        ${D.tasks.filter(t => !t.done && !t.due).length ? `<div class="list">${D.tasks.filter(t => !t.done && !t.due).slice(0, 5).map(t => `<div class="list-row"><div class="grow"><div class="t">${esc(t.title)}</div><div class="s">${esc(subj(t.subject).name)}</div></div><button class="btn sm" data-schedule="${t.id}">Schedule</button></div>`).join("")}</div>` : `<p class="small muted">Everything has a date. Good.</p>`}
      </div>
    </div>`;
  $$("[data-week-task]", body).forEach(c => c.onchange = () => { const t = D.tasks.find(x => x.id === c.dataset.weekTask); t.done = c.checked; saveDB(); renderRoute(); });
  $$("[data-day-add]", body).forEach(b => b.onclick = () => eventModal({ date: b.dataset.dayAdd }));
  $$("[data-schedule]", body).forEach(b => b.onclick = () => { const t = D.tasks.find(x => x.id === b.dataset.schedule); modal({ title: "Schedule task", icon: "calendar", body: `<div class="field"><label for="schD">Date</label><input type="date" id="schD" value="${D2.addDays(1)}"></div>`, footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="schGo">Schedule</button>`, onMount: (m) => $("#schGo", m).onclick = () => { t.due = $("#schD", m).value; saveDB(); closeModal(); renderRoute(); } }); });
  const wg = $("#weekGrid", body); if (wg && window.innerWidth < 980) wg.style.gridTemplateColumns = "repeat(2,minmax(0,1fr))";
  if (wg && window.innerWidth < 560) wg.style.gridTemplateColumns = "1fr";
}

function calendarView(body) {
  const m = plannerState.month;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = [];
  const prevDays = new Date(m.getFullYear(), m.getMonth(), 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) cells.push({ d: new Date(m.getFullYear(), m.getMonth() - 1, prevDays - i), out: true });
  for (let i = 1; i <= daysIn; i++) cells.push({ d: new Date(m.getFullYear(), m.getMonth(), i), out: false });
  while (cells.length % 7) cells.push({ d: new Date(m.getFullYear(), m.getMonth() + 1, cells.length - startDow - daysIn + 1), out: true });
  body.innerHTML = `<div class="card">
    <div class="row" style="margin-bottom:12px"><button class="icon-btn" id="prevM" aria-label="Previous month">${ico("chevronLeft")}</button><h3 style="flex:1;text-align:center;font-size:15px">${D2.monthName(m)}</h3><button class="icon-btn" id="nextM" aria-label="Next month">${ico("chevronRight")}</button><button class="btn sm" id="todayM">Today</button></div>
    <div class="cal-grid">
      ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells.map(c => {
        const k = D2.iso(c.d);
        const evs = D.events.filter(e => e.date === k);
        const deadlines = D.assignments.filter(a => a.due === k && a.status !== "submitted");
        const exams = D.exams.filter(e => e.dueDate === k);
        return `<div class="cal-day ${c.out ? "out" : ""} ${k === D2.iso() ? "today" : ""}" data-cal-day="${k}" role="button" tabindex="0">
          <div class="n">${c.d.getDate()}</div>
          ${evs.slice(0, 2).map(e => `<div class="cal-ev">${esc(e.title)}</div>`).join("")}
          ${deadlines.slice(0, 1).map(a => `<div class="cal-ev deadline">${esc(a.title)}</div>`).join("")}
          ${exams.slice(0, 1).map(e => `<div class="cal-ev exam">Exam: ${esc(e.title)}</div>`).join("")}
          ${evs.length + deadlines.length + exams.length > 3 ? `<div class="tiny muted">+${evs.length + deadlines.length + exams.length - 3}</div>` : ""}
        </div>`;
      }).join("")}
    </div>
    <div class="row" style="margin-top:12px;gap:14px;flex-wrap:wrap"><span class="tiny muted">${ico("calendar")} Click any day to add an event.</span><span class="spacer"></span>
      <span class="tiny muted"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--brand)"></i> Event</span>
      <span class="tiny muted"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--danger)"></i> Deadline</span>
      <span class="tiny muted"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--warn)"></i> Exam</span>
    </div></div>`;
  $("#prevM", body).onclick = () => { plannerState.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); renderPlanner($("#view"), { params: {} }); };
  $("#nextM", body).onclick = () => { plannerState.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); renderPlanner($("#view"), { params: {} }); };
  $("#todayM", body).onclick = () => { plannerState.month = new Date(); renderPlanner($("#view"), { params: {} }); };
  $$("[data-cal-day]", body).forEach(c => c.onclick = () => dayModal(c.dataset.calDay));
}
function dayModal(date) {
  const evs = D.events.filter(e => e.date === date);
  const tasks = D.tasks.filter(t => t.due === date);
  const asg = D.assignments.filter(a => a.due === date);
  modal({
    title: D2.fmt(date), icon: "calendar", body: `
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:13px">Schedule</b><button class="btn sm primary" id="dayAdd">${ico("plus")} Add event</button></div>
      ${evs.length ? `<div class="stack">${evs.map(e => `<div class="list-row"><div class="grow"><div class="t">${esc(e.title)}</div><div class="s">${esc(e.time || "All day")}${e.duration ? " · " + e.duration + " min" : ""}${e.notes ? " · " + esc(e.notes) : ""}</div></div>
        <button class="icon-btn" style="width:26px;height:26px" data-del-ev="${e.id}" aria-label="Delete event">${ico("trash")}</button></div>`).join("")}</div>` : `<p class="small muted">No events scheduled.</p>`}
      <div class="divider"></div>
      <b style="font-size:13px">Tasks & deadlines</b>
      ${tasks.length || asg.length ? `<div class="list">${tasks.map(t => `<div class="list-row"><span class="grow small">${esc(t.title)}</span><span class="chip ${t.done ? "ok" : ""}">${t.done ? "Done" : "Task"}</span></div>`).join("")}${asg.map(a => `<div class="list-row"><span class="grow small">${esc(a.title)}</span><span class="chip warn">Assignment</span></div>`).join("")}</div>` : `<p class="small muted">Nothing due this day.</p>`}`,
    footer: `<button class="btn" data-close>Close</button>`,
    onMount: (m) => {
      $("#dayAdd", m).onclick = () => { closeModal(); eventModal({ date }); };
      $$("[data-del-ev]", m).forEach(b => b.onclick = () => { D.events = D.events.filter(e => e.id !== b.dataset.delEv); saveDB(); closeModal(); renderRoute(); });
    }
  });
}

function tasksView(body) {
  const f = plannerState.taskFilter;
  let tasks = [...D.tasks];
  if (f === "open") tasks = tasks.filter(t => !t.done);
  if (f === "done") tasks = tasks.filter(t => t.done);
  if (f === "today") tasks = tasks.filter(t => !t.done && (!t.due || t.due <= D2.iso()));
  if (f === "overdue") tasks = tasks.filter(t => !t.done && t.due && D2.days(t.due) < 0);
  tasks.sort((a, b) => (a.done - b.done) || (a.due || "9999").localeCompare(b.due || "9999") || ({ high: 0, med: 1, low: 2 }[a.priority] ?? 1) - ({ high: 0, med: 1, low: 2 }[b.priority] ?? 1));
  body.innerHTML = `<div class="card">
    <div class="row wrap" style="gap:8px;margin-bottom:12px">
      <div class="pill-tabs">${[["open", "Open"], ["today", "Today"], ["overdue", "Overdue"], ["done", "Done"], ["all", "All"]].map(([k, l]) => `<button class="${f === k ? "on" : ""}" data-tfilter="${k}">${l}</button>`).join("")}</div>
      <span class="spacer"></span><button class="btn sm primary" id="tAdd">${ico("plus")} Add task</button>
    </div>
    <div class="list" id="taskList">
      ${tasks.length ? tasks.map(t => `<div class="list-row" style="padding:10px 0">
        <button class="icon-btn" style="width:23px;height:23px;border-radius:6px;${t.done ? "background:var(--ok);color:#fff;border-color:var(--ok)" : ""}" data-toggle-task="${t.id}" aria-label="${t.done ? "Reopen" : "Complete"} task">${ico("check")}</button>
        <div class="grow"><div class="t" style="${t.done ? "text-decoration:line-through;opacity:.55" : ""}">${esc(t.title)}</div>
        <div class="s">${esc(subj(t.subject).name)}${t.due ? " · " + esc(D2.rel(t.due)) : ""}${t.done ? " · completed" : ""}</div></div>
        <span class="chip ${t.priority === "high" ? "danger" : t.priority === "med" ? "warn" : ""}">${t.priority === "high" ? "High" : t.priority === "med" ? "Med" : "Low"}</span>
        <div class="row" style="gap:2px"><button class="icon-btn" style="width:26px;height:26px" data-edit-task="${t.id}" aria-label="Edit task">${ico("edit")}</button><button class="icon-btn" style="width:26px;height:26px" data-del-task="${t.id}" aria-label="Delete task">${ico("trash")}</button></div>
      </div>`).join("") : emptyState("check", f === "done" ? "Nothing completed yet" : "No tasks in this view", "Tasks feed the dashboard, week planner and study recommendations.", `<button class="btn primary sm" id="tAdd2">${ico("plus")} Add a task</button>`)}
    </div>
  </div>`;
  $$("[data-tfilter]", body).forEach(b => b.onclick = () => { plannerState.taskFilter = b.dataset.tfilter; tasksView(body); });
  const a1 = $("#tAdd", body); a1.onclick = () => taskModal();
  const a2 = $("#tAdd2", body); if (a2) a2.onclick = () => taskModal();
  $$("[data-toggle-task]", body).forEach(b => b.onclick = () => {
    const t = D.tasks.find(x => x.id === b.dataset.toggleTask); t.done = !t.done; t.completedAt = t.done ? new Date().toISOString() : null;
    if (t.done) logActivity(`Completed task “${t.title}”`, "check", "planner");
    saveDB(); tasksView(body); updateNavBadges();
  });
  $$("[data-edit-task]", body).forEach(b => b.onclick = () => taskModal(D.tasks.find(t => t.id === b.dataset.editTask)));
  $$("[data-del-task]", body).forEach(b => b.onclick = () => confirmDialog("Delete task?", "It will be removed everywhere.", () => {
    D.tasks = D.tasks.filter(t => t.id !== b.dataset.delTask); saveDB(); tasksView(body); updateNavBadges();
  }));
}
function taskModal(t) {
  const edit = !!t;
  modal({
    title: edit ? "Edit task" : "New task", icon: "check", body: `
      <div class="field"><label for="tkTitle">Task</label><input id="tkTitle" value="${esc(t?.title || "")}" placeholder="What needs doing?"></div>
      <div class="input-row"><div class="field"><label for="tkSub">Subject</label><select id="tkSub">${SUBJECTS.map(s => `<option value="${s.id}" ${t?.subject === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}<option value="general" ${t?.subject === "general" ? "selected" : ""}>General</option></select></div>
      <div class="field"><label for="tkDue">Due</label><input id="tkDue" type="date" value="${t?.due || D2.iso()}"></div>
      <div class="field"><label for="tkPrio">Priority</label><select id="tkPrio">${[["high", "High"], ["med", "Medium"], ["low", "Low"]].map(([v, l]) => `<option value="${v}" ${t?.priority === v ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="tkSave">${edit ? "Save" : "Add task"}</button>`,
    onMount: (m) => {
      $("#tkTitle", m).focus();
      $("#tkSave", m).onclick = () => {
        const title = $("#tkTitle", m).value.trim(); if (!title) return toast("Enter a task.", "warn");
        const data = { title, subject: $("#tkSub", m).value, due: $("#tkDue", m).value, priority: $("#tkPrio", m).value };
        if (edit) Object.assign(t, data);
        else { D.tasks.unshift({ id: uid("t"), done: false, createdAt: D2.iso(), ...data }); logActivity(`Added task “${title}”`, "check", "planner"); }
        saveDB(); closeModal(); renderRoute(); toast(edit ? "Task updated" : "Task added");
      };
    }
  });
}

    inp.onchange = () => saveDB();

  $$("[data-goal-edit]", body).forEach(b => b.onclick = () => goalModal(D.goals.find(g => g.id === b.dataset.goalEdit)));
  $$("[data-goal-del]", body).forEach(b => b.onclick = () => confirmDialog("Delete goal?", "This removes it from your planner.", () => { D.goals = D.goals.filter(g => g.id !== b.dataset.goalDel); saveDB(); renderPlanner($("#view"), { params: {} }); }));
